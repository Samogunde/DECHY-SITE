name: CI

# Quick checks on every change: types, lint, formatting, unit tests, content validation, the
# dependency audit, and the production build. The full browser suite lives in browser-tests.yml and
# runs only when started by hand (before launch, before the domain switch, or on request), so the
# free GitHub Actions minutes for this private repository last the month (owner, 24 October 2026).
on:
  push:
    # Dependabot branches are checked once, through their pull request, not twice.
    branches-ignore: ["dependabot/**"]
    # Planning documents do not change the site.
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run on the same branch (a push and its pull request share one
# group), but never on main: every commit on main finishes its own run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  SITE_ORIGIN: http://localhost:4310
  SITE_INDEXING: "false"
  CONTACT_DELIVERY: log

jobs:
  quick:
    name: Quick checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Content and entity-graph validation
        run: npm run validate

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
