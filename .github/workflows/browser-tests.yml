name: Browser tests

# The complete browser suite (every route, responsive widths, navigation, accessibility, security
# headers such as noindex, forms, alignment), split into four parallel shards. It runs only when
# started by hand from the Actions tab ("Run workflow"): before launch, before the domain switch, or
# when the owner asks. No test is skipped or reduced; sharding only divides the same tests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"
  SITE_ORIGIN: http://localhost:4310
  SITE_INDEXING: "false"
  CONTACT_DELIVERY: log

jobs:
  browser:
    name: Browser tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
