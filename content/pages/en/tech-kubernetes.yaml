        entityIds: [tool.docker, tool.terraform, tool.github-actions, tool.prometheus, tool.grafana]
      - title: Related services
        entityIds: [svc.software-development, svc.cybersecurity]
      - title: Solutions
        entityIds: [sol.cloud-migration, sol.legacy-system-modernization]
      - title: Systems we build
        entityIds: [workarea.devops-infrastructure, workarea.cloud-platforms]
      - title: Where it applies
        entityIds: [ind.saas, ind.finance, ind.telecommunications]

  - type: cta
    id: contact-cta
    heading: Describe the services you run
    body: "Tell us how many services you run, how they scale, and who looks after them. We will assess honestly whether Kubernetes is justified and what simpler options exist."
    primary: { label: Talk to DECHY about Kubernetes, href: "/contact/?service=cloud" }
