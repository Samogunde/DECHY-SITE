  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about telecom software
    items:
      - q: How much does a telecom self-service app cost?
        a:
          A customer self-service app usually costs $16,000 to $36,000 and takes 4 to 8 weeks, depending on
          billing integration.
      - q: Can you connect to our billing system?
        a:
          Usually, yes, through its interfaces. Billing stays the source of truth and the app reads from
          it.
      - q: Can customers check service availability online?
        a: Yes. Address checks show available plans and speeds before checkout.
      - q: Can you automate provisioning?
        a: Yes. We automate the steps between ordering and activation and flag exceptions for staff.
      - q: Do you build tools for field engineers?
        a: Yes. Engineers get jobs, equipment details, tests, and sign-off in one mobile app.
      - q: Can customers see outage information?
        a:
          Yes. Outages and repair status appear in the app, so customers do not need to call. Proactive
          messages can go out by text and push notification as soon as an outage is confirmed, along
          with updates when the service is restored.
