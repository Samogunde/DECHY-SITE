  - type: prose
    id: different
    tone: white
    label: What is different
    heading: What telecom providers need from software today
    paragraphs:
      - Telecom customers rarely want to call. They want to check usage, change a plan, report a
        fault, and see when it will be fixed, all from their phone. Every call that could have been
        self-service costs money and patience.
      - Behind the scenes, ordering and provisioning often pass through several systems with manual
        steps between them. New customers wait days for activation that could take minutes.
      - Field engineers carry the rest of the burden. When they arrive without the right details,
        installs fail and repeat visits follow.
      - We build the customer and operations layer that connects these pieces to your billing and
        network systems, so the whole journey from order to working service runs smoothly.
      - We build so your teams can keep changing the journeys after launch. Offers, plans, and
        messages are managed in admin tools rather than code, and every integration is documented,
        monitored, and tested, so adding the next journey is faster than the first. The same
        building blocks then support new products, partner channels, and business customers without
        starting again.
