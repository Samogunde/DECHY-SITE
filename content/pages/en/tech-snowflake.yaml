comprehension:
  what: Snowflake is a cloud data platform. It holds a business's data in one place and lets many teams analyze it at the same time without slowing each other down.
  problem: Different teams need the same data for different jobs, reports slow each other, and nobody is sure what the platform costs or who can see what.
  audience: Organizations with many data users and sources, on any major cloud, and teams already using Snowflake.
  choose: Choose Snowflake for many teams sharing governed data across clouds, or for sharing data with partners. Choose a simpler warehouse or a database when your needs are smaller.
  next: Tell us who needs which data and what the current reports cost in time. We will outline a platform and a cost model.
