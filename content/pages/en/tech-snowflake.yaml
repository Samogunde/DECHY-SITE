        text: Stored once, governed once.
      spokes:
        - title: Finance reports
          text: Month-end numbers, run without slowing others.
        - title: Marketing analysis
          text: Campaign data joined with sales.
        - title: Data science
          text: Large experiments on the same data.
        - title: Operations dashboards
          text: Live views for managers.
        - title: Partner sharing
