    variant: service
    eyebrow: Data platform
    headline: Snowflake
    lead: Snowflake is a platform for storing and analyzing large amounts of business data in the cloud. Its signature idea is that many teams can use the same data at once without getting in each other's way. We design, load, govern, and tune Snowflake, and we keep its cost visible.
    support: This page covers how Snowflake works, where it fits against BigQuery and simpler options, and how to keep spending predictable.
    ctas:
