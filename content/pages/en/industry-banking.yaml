  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why banking modernization works best in steps
    paragraphs:
      - Banks carry decades of systems that still work and still hold the money. Replacing them all
        at once is expensive and risky, and many such projects stall. Meanwhile customers compare
        your app with the best ones on their phone.
      - We take a different path. We pick one journey, build a modern front end and the services
        behind it, and connect it to the core through a controlled layer. Each release is reviewed,
        tested, and reversible.
      - Customers feel the improvement within months, and your risk team sees evidence at every step.
      - Our role is to make each step small enough to approve and safe enough to undo. Your teams
        keep ownership of the core, the data, and the decisions, and we leave behind code, tests,
        and documentation they can run without us.
