  - type: process
    id: how
    tone: white
    label: How we deliver
    heading: How we modernize a banking journey
    intro:
      Each journey moves from baseline to staged release in about two to three months, with risk
      and compliance involved from the first prototype.
    steps:
      - title: Choose the journey
        body: We agree one journey with clear value, such as account opening, and measure it today.
        artifacts:
          - Journey baseline
          - Success measures
      - title: Design and validate
        body: We prototype the journey with real customers and review it with risk and compliance early.
        artifacts:
          - Tested prototype
          - Review notes
      - title: Build the integration layer
        body: We connect to the core through a controlled layer, never by changing it directly.
        artifacts:
          - Integration services
          - Test environment
      - title: Release in stages
        body: We release to a small group, monitor closely, then widen to all customers.
        artifacts:
          - Staged release
          - Monitoring
  - type: index
    id: needs
    tone: paper
    columns: 2
    label: What we build
    heading: Banking software we build
    intro:
      Each of these connects to your existing core through a controlled layer, so new journeys go
      live without touching the system that holds the money.
    items:
      - title: Mobile and online banking
        body: Balances, transfers, cards, and statements in an app customers rate highly.
      - title: Digital account opening
        body: Identity checks and account setup in one sitting, with a handoff to staff when needed.
      - title: Loan origination tools
        body: Applications, document collection, decisions, and offers that move in days, not weeks.
      - title: Staff servicing console
        body: One screen for customer details, requests, and history, so calls end sooner.
      - title: Integration layer
        body: A controlled connection between new apps and the core, with logging and limits.
      - title: Management reporting
        body: Accurate daily figures for leaders and regulators, from one agreed set of definitions.
  - type: technical
    id: technology
    tone: paper
    label: Technical depth
    heading: Technical notes for banking
    intro: What your architecture and security teams will ask about the core, data, and access.
    panels:
      - title: Working with the core
        items:
          - We connect through the interfaces your core system offers and add a layer that controls
            volume and logs every call.
          - Test environments use synthetic data, never real customer records.
      - title: Security and access
        items:
          - Strong customer authentication and device checks protect every sign-in.
          - Staff access is role-based and reviewed, and every action is logged.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about banking software
    items:
      - q: Do we need to replace our core banking system?
        a:
          Usually not. Most of the value comes from new journeys connected to the core you have. We replace
          parts only when it clearly pays.
      - q: How long does a new banking journey take?
        a: A focused journey such as account opening usually takes 8 to 12 weeks, including reviews,
          testing, and a staged release.
      - q: How do you handle regulatory review?
        a:
          We involve your risk and compliance teams from the first prototype and provide documentation,
          tests, and logs as evidence.
      - q: Can you work with our in-house team?
        a:
          Yes. We often work alongside bank teams, sharing code standards and handing over everything we
          build.
      - q: What does a banking project cost?
        a:
          Most journeys cost $32,000 to $80,000 depending on integration and review needs. Larger programs
          are planned in stages.
      - q: Can you improve the app we already have?
        a:
          Yes. Many banks start by fixing the journeys customers complain about in their current app,
          before building anything new.
