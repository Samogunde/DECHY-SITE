comprehension:
  what: "We build AI agents: systems that work toward a goal in several steps, choosing which tool to use at each step, such as searching records, drafting a message, or updating a system."
  problem: Some tasks are too varied for fixed rules, but too long and repetitive for people to do well, such as researching a lead or resolving a routine request.
  audience: Teams with multi-step tasks that need judgment, and leaders who want automation they can inspect and control.
  choose: Use an agent only when the steps vary. If the steps are always the same, a plain automation is cheaper and more reliable.
  next: Describe a multi-step task and where judgment is needed. We will say whether an agent, an automation, or a person is the better fit.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Work Area
    headline: AI Agents
    lead: "We build AI agents that work toward a goal in several steps, using your tools along the way: looking up a record, drafting a reply, updating a system. Every agent we build has clear limits, a record of what it did, and a person who approves the steps that matter."
    ctas:
      - label: Discuss an agent
        href: /contact/?service=ai
      - label: Agent or automation?
        href: "#compare"
    spec:
      kind: hub
      center:
        title: The agent
        text: Plans steps toward a goal and picks tools.
      spokes:
        - title: Your records
          text: Looks up customers, orders, and history.
        - title: Your documents
          text: Finds answers and policies.
        - title: Messaging
          text: Drafts replies for approval.
        - title: Your systems
          text: Creates or updates records.
        - title: Limits
          text: What it may and may not do.
        - title: A person
          text: Approves the steps that matter.
    purpose: relationship
    takeaway: An agent chooses among tools such as records, documents, messaging, and systems, within limits, and with a person approving key steps.
    visualTitle: What an AI agent connects to
    figureCaption: This diagram shows an AI agent in the middle, connected to records, documents, messaging, systems, limits, and a person who approves key steps.
  - type: definition
    id: what-is
    tone: white
    label: In practice
    heading: A system that decides the next step
    answer: "We build AI agents: software that pursues a goal over several steps, deciding at each one what to do next, such as looking something up or drafting a message, instead of following one fixed script."
    paragraphs:
      - This makes agents useful for tasks that vary, like researching a new lead or sorting out a routine customer request. It also makes them harder to predict than a plain automation.
      - We therefore design agents with narrow permissions, a record of every step, and clear points where a person must approve. The goal is dependable help, not an unsupervised system.
  - type: table
    id: compare
    tone: paper
    label: Choosing
    heading: Agent, automation, or person?
    caption: Comparison of an AI agent, a fixed automation, and a person
    columns:
      - Situation
      - Best fit
      - Why
    rows:
      - - The steps are always the same
        - A fixed automation.
        - It is cheaper, faster, and predictable.
      - - The steps vary, but each is low risk
        - An AI agent.
        - It can adapt, and mistakes are easy to undo.
      - - The steps vary and mistakes are costly
        - An agent that proposes, and a person who approves.
        - Judgment stays with a person.
      - - The task is rare or highly sensitive
        - A person.
        - Building a system costs more than doing it.
  - type: diagram
    id: assistant-view
    tone: white
    label: What it looks like
    heading: An agent that answers, cites, and hands over
    intro: An agent should be easy to supervise.
    figure: assistant-ui
    purpose: system
    takeaway: A supervised AI agent answers from approved content, cites its source, and hands difficult cases to a person.
    caption: This sketch shows a conceptual chat with an answer that cites its source and an offer to talk to a person. It illustrates a kind of system we build and is not a client's product.
    points: []
  - type: diagram
    id: loop
    tone: white
    label: How it works
    heading: The agent's loop
    intro: An agent repeats a short loop until the goal is met or it needs help.
    spec:
      kind: flow
      steps:
        - title: Understand the goal
          text: What is being asked, and what counts as done?
        - title: Choose a step
          text: Pick the next tool or action.
        - title: Act within limits
          text: Run the step, if it is allowed.
        - title: Check the result
          text: Did it work? Is anything doubtful?
        - title: Continue, ask, or stop
          text: Repeat, ask a person, or finish and report.
    purpose: process
    takeaway: An agent repeats a loop of choosing a step, acting within limits, and checking the result until it finishes or asks for help.
    caption: This diagram shows an agent's loop through five stages, from understanding the goal to continuing, asking a person, or stopping.
  - type: columns
    id: controls
    tone: paper
    label: Control
    heading: How we keep an agent under control
    columns:
      - title: Narrow permissions
        items:
          - It can use only the tools and records the task needs.
          - It cannot spend money or delete records on its own.
      - title: Human approval
        items:
          - Steps that affect customers or money wait for a person.
          - Doubtful cases are passed up.
      - title: Records
        items:
          - Every step and reason is logged.
          - Samples are reviewed regularly.
      - title: Testing
        items:
          - It is tested on past cases before it goes live.
          - It starts in a small area and widens as trust grows.
  - type: callout
    id: scenario
    tone: white
    variant: illustrative
    title: An agent handling inbound enquiries
    paragraphs:
      - A typical case is a sales team that receives enquiries from a form. Someone must look up the company, check whether it is already a customer, and write a first reply.
      - An agent could do the lookups, draft the reply, and file the enquiry in the customer records. A salesperson would read each draft and press send. Anything unclear would be flagged.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about AI agents
    items:
      - q: Can an agent act without asking?
        a: Only for low-risk steps you have approved. Anything touching customers, money, or sensitive records waits for a person.
      - q: What if the agent is wrong?
        a: Steps are logged and reviewable, mistakes are easy to reverse by design, and we measure error rates before widening the agent's role.
      - q: Which AI model does it use?
        a: We choose among several providers based on the task, cost, and your data rules. The agent is built so a model can be changed later.
  - type: related
    id: related
    tone: white
    label: Related
    heading: Agents across DECHY
    groups:
      - title: The service behind this
        entityIds:
          - svc.ai
          - svc.automation
      - title: Related solutions
        entityIds:
          - sol.ai-agents
          - sol.ai-automation
      - title: Related work areas
        entityIds:
          - workarea.ai-solutions
          - workarea.automation-systems
          - workarea.workflow-automation
  - type: cta
    id: contact-cta
    heading: Tell us about the multi-step task
    body: Describe the task, where judgment is needed, and what could go wrong. We will say whether an agent, an automation, or a person fits best.
    primary:
      label: Discuss your AI agents
      href: /contact/?service=ai
