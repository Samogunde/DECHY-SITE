  - type: process
    id: engagement
    tone: white
    label: Working together
    heading: Working across US time zones
    intro: The continental United States spans four time zones, so we agree how to work at the start.
    steps:
      - title: Set the rhythm
        body: We agree a regular call, with times that suit your team's day, and a place where written updates are posted.
        artifacts:
          - Meeting schedule
          - Update channel
      - title: Keep decisions in writing
        body: Decisions, questions, and next steps are written down, so a team in one zone is never waiting for a call in another.
        artifacts:
          - Decision log
      - title: Release often
        body: Small, frequent releases let you check progress when it suits you.
        artifacts:
          - Release notes
          - Demo access
      - title: Plan for support hours
        body: For systems that must be watched, we agree what is covered and how urgent issues reach us.
        artifacts:
          - Support terms
