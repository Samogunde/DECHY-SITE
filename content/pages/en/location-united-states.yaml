  - type: prose
    id: market
    tone: white
    label: The market
    heading: What US technology buyers usually ask for
    paragraphs:
      - "The United States is a very large and varied market, from startups building a first product to enterprises modernizing systems that are decades old. The work we are asked for most often falls into a few groups: custom software and portals, connecting systems, automating manual processes, and adding AI to existing applications."
      - Buyers here often compare several suppliers and ask for evidence of how a supplier handles security and delivery. They may send a security questionnaire before a project starts. We answer these plainly, describing what we do, without claiming certifications we do not hold.
      - Speed to a first working version matters, and so does a path to scale. We usually agree a small first stage that proves the idea, then extend it.
  - type: table
    id: rules
    tone: paper
    label: Rules and expectations
    heading: Considerations that shape US software projects
    caption: Four US considerations that commonly affect software and data projects and how they shape what we build
    columns:
      - Consideration
      - Why it matters
      - What it means for the build
    rows:
      - - State privacy laws
        - There is no single national privacy law for most businesses. Several states, including California, have their own rules on personal data.
        - We design for consent, access, and deletion requests, so the system can meet the strictest rules that apply to you.
      - - Sector rules
        - Health, finance, and education data carry specific requirements, for example health information handled by healthcare organizations.
        - We ask which apply, limit access by role, keep audit logs, and build to the requirements you give us.
      - - Supplier security reviews
        - Larger buyers often ask suppliers to describe their security practices, and may expect independent audit reports.
        - We document how we handle access, secrets, and testing, and answer questionnaires directly.
      - - Accessibility
        - Websites and applications are expected to work for people with disabilities.
        - We build to the web accessibility guidelines and test with keyboard and screen reader.
    note: These points are a starting list, not legal advice. Your own adviser can confirm what applies to your organization.
  - type: index
    id: integrations
    tone: white
    columns: 2
    label: Systems in use
    heading: Tools and payment methods we connect to in the US
    items:
      - title: Card payments and bank transfers
        body: Cards and ACH bank transfers are the usual ways to pay online, through providers such as [Stripe](ref:int.stripe).
      - title: Sales tax
        body: Sales tax rules differ by state and can depend on where the customer is. We connect stores to tax calculation services instead of coding rates by hand.
      - title: Customer systems
        body: "[Salesforce](ref:plat.salesforce) and [HubSpot](ref:plat.hubspot) are widely used. See [connecting customer systems](/solutions/crm-integration/)."
      - title: Accounting
        body: Small and mid-sized businesses commonly use QuickBooks or similar tools. We connect orders and invoices to the books.
      - title: Sign-in
        body: Single sign-on through the identity provider your organization already uses, so staff sign in once.
      - title: Cloud platforms
        body: "[AWS](ref:plat.aws), [Azure](ref:plat.azure), and [Google Cloud](ref:plat.google-cloud) are all in common use, with regions across the country."
