  - type: faq
    id: faq
    tone: white
    label: Common questions
    heading: Questions from US organizations
    items:
      - q: Do you have a US office?
        a: No. DECHY is a global company and works remotely. Clients reach us through the contact form, and we arrange calls at times that suit your team.
      - q: How do you handle the time difference?
        a: We agree meeting windows, keep decisions in writing, and release in small steps, so work continues whichever zone you are in.
      - q: Can you meet our company's security questionnaire?
        a: We answer it honestly, describing what we do. We do not claim certifications we do not hold, and we say if a requirement is beyond what we can offer.
      - q: Do you work with state or federal agencies?
        a: Public-sector projects have their own procurement rules. Tell us about the project and we will say whether and how we can take part.
  - type: cta
    id: contact-cta
    heading: Tell us about your project
    body: Describe what you want to build or fix, and where your team works. We will propose how an engagement would run.
