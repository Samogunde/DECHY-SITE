  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why construction needs software built for the site
    paragraphs:
      - A construction business is many temporary factories running at once, each with its own team,
        suppliers, and problems. Information travels from site to office by phone, photo, and paper,
        and arrives late. By the time a cost overrun shows up in the accounts, the money is spent.
      - Generic project tools were designed for desks, not muddy boots and poor signal. We build
        apps that work offline with gloves on, and connect them to the systems the office already
        uses.
      - "The aim is simple: every project leader sees the truth about cost and progress every day."
      - Subcontractors and suppliers are part of the picture too. When orders, payment applications,
        and documents move through one portal, disputes drop and everyone works from the same record
        of what was agreed and delivered.
