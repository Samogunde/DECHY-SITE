  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about construction software
    items:
      - q: How much does a construction app cost?
        a:
          A site diary or approvals app usually costs $12,000 to $28,000 and takes 4 to 6 weeks. A full
          project platform costs more and is built in stages.
      - q: Will site teams actually use it?
        a: They do when it saves them time. We design with site managers and keep every task to a few taps.
      - q: Does it work without signal?
        a: Yes. Entries are saved on the phone and sync automatically when a connection returns.
      - q: Can you connect to our accounting system?
        a: Usually, yes. Orders, invoices, and costs flow between the app and your accounts automatically.
      - q: Can subcontractors use it?
        a: Yes. Subcontractors get their own portal for orders, payment applications, and documents.
      - q: Can we capture photos and sign-offs on site?
        a: Yes. Site teams take photos, record signatures, and complete checklists in the app, and
          everything is filed against the right project automatically.
  - type: index
    id: needs
    tone: paper
    columns: 2
    label: What we build
    heading: Construction software we build
    intro:
      Site teams get simple tools that work in the field, and the office gets live numbers on every
      project without chasing anyone for updates.
    items:
      - title: Site diary app
        body: Daily reports, labor, weather, delays, and photos captured on site, even without signal.
      - title: Purchase approvals
        body: Requests routed by value and project, approved on a phone, and turned into orders
          automatically.
      - title: Cost and valuation tracking
        body: Budget against committed and actual cost per project, updated as orders and invoices arrive.
      - title: Document control
        body: The latest drawings and method statements on every phone, with old versions clearly retired.
      - title: Safety inspections
        body: Checklists, incidents, and actions tracked to closure, with evidence for audits.
      - title: Subcontractor portal
        body: Orders, applications for payment, and documents exchanged in one place.
