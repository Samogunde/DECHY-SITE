    label: What we build
    heading: Fitness software we build
    intro: Pick one piece or the full platform. Every part shares the same member profile, so what a
      member does in the app shows up at the front desk and in your reports.
    items:
      - title: Member app
        body: Book classes, track workouts, and follow programs on iPhone and Android, with your branding.
      - title: Class and trainer booking
        body: Live timetables, waitlists, late-cancel rules, and reminders that cut no-shows.
      - title: Memberships and billing
        body: Plans, trials, freezes, family accounts, and automatic renewals with failed-payment retries.
      - title: Online coaching
        body: Programs, video, check-ins, and messaging for trainers who coach clients remotely.
      - title: Progress and challenges
        body: Workout logs, personal bests, streaks, and team challenges that keep people engaged.
      - title: Owner dashboards
        body: Attendance, revenue, and churn risk by site and class, so you act before members leave.
