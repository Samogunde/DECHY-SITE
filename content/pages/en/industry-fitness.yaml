    tone: paper
    label: Technical depth
    heading: Technical notes for fitness platforms
    intro: What your operations or technical lead will ask about wearables, payments, and peak traffic.
    panels:
      - title: Wearables and health data
        items:
          - We connect to Apple Health and Google Health Connect when members choose to share their
            data.
          - Health data is stored separately and only with the member's consent.
      - title: Peak-time booking
        items:
          - Class releases cause traffic spikes, so booking is built to handle a rush without
            double-booking a spot.
          - Payments use tested providers with automatic retries and receipts.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about fitness software
    items:
      - q: How much does a fitness app cost?
        a:
          Most member apps cost $10,000 to $35,000 and take 2 to 6 weeks. A full platform with coaching,
          billing, and multiple sites sits at the top of that range or above.
      - q: Can you connect to the gym system we already use?
        a:
          Usually, yes. We connect through the booking and billing platform you have, so staff keep their
          tools and members get a better app.
      - q: Do members need a separate login for the app and the website?
        a: No. Members use one account for booking on the web, in the app, and at the front desk.
      - q: Can trainers use it to coach online?
        a:
          Yes. Trainers build programs, share videos, review check-ins, and message clients from the same
          platform.
      - q: Will it work for a single studio?
        a:
          Yes. We size the build to you. A single studio usually starts with booking, payments, and a
          branded app.
      - q: Can members pay for packs and personal training in the app?
        a: Yes. Members buy class packs, memberships, and personal training sessions in the app, and
          payments land in the same account as your front desk sales.
