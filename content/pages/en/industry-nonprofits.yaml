  - type: prose
    id: different
    tone: white
    label: What is different
    heading: What nonprofits need from their technology
    paragraphs:
      - Nonprofits run on generosity and stretched budgets. Every donation lost to a confusing form,
        and every hour spent coordinating volunteers by email, is money and time that does not reach
        the cause.
      - Good tools pay for themselves quickly. A simple, fast donation journey raises more,
        especially monthly giving. Volunteer scheduling frees staff for program work. One supporter
        record lets you thank people properly and ask at the right time.
      - Supporters also want to see impact. Clear stories and numbers about what their gifts
        achieved keep them giving year after year.
      - We keep running costs low and build with tools your small team can manage, often on
        affordable platforms, so the technology stays an asset rather than a burden.
      - We also plan for the people who will run the tools after we leave. Admin screens are simple,
        training is short, and the documentation is written for staff and volunteers rather than
        developers. If your team changes, the knowledge stays. That matters in organizations where a
        single staff member often looks after the website, the database, and the newsletter at the
        same time.
