  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about nonprofit technology
    items:
      - q: How much does a nonprofit donation website cost?
        a: A donation website usually costs $2,500 to $6,000 and launches in 1 to 2 weeks.
      - q: Can you connect to our supporter database?
        a: Usually, yes. We connect donation and volunteer tools to the database you already use.
      - q: Do you offer nonprofit pricing?
        a:
          We keep builds lean and use affordable platforms, and we will always suggest the lowest-cost
          route that meets your goals.
      - q: Can volunteers manage their own shifts?
        a: Yes. Volunteers sign up, choose shifts, and get reminders without staff coordinating by email.
      - q: Can donors give monthly?
        a:
          Yes. Monthly giving is built in, with automatic receipts and simple ways to update payment
          details.
      - q: Can we show the impact of donations?
        a:
          Yes. We build impact pages and dashboards that show what gifts achieved in clear numbers and
          stories. Each gift is linked to the campaign that inspired it, so you can see which
          appeals and stories work best and plan the next one with confidence.
