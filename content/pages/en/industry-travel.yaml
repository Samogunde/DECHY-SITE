  - type: prose
    id: different
    tone: white
    label: What is different
    heading: What travel companies need from their software
    paragraphs:
      - Travel is sold on dreams and delivered through details. A traveler compares options for
        weeks, then expects booking to take minutes and every confirmation to be right. Behind the
        scenes, your team juggles suppliers, seats, rooms, and changes.
      - Many travel companies still manage availability in spreadsheets and send itineraries as
        attachments. That is where errors and refunds come from. One platform for availability,
        booking, and payments removes most of them.
      - During the trip, an itinerary app keeps every booking, ticket, and contact in one place,
        works offline abroad, and lets you send updates when plans change.
      - We design for seasonal peaks, many currencies, and the moment a traveler is standing at an
        airport with a question. The software has to work then, not only during a calm demo.
