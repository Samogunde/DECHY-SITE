      - title: Package builder
        body: Flights, rooms, and activities combined into packages with deposits and balance payments.
      - title: Itinerary app
        body: The whole trip on the traveler's phone, offline, with updates when plans change.
      - title: Supplier integrations
        body: Live rates and availability from hotels, transport, and activity suppliers.
      - title: Agent and back-office tools
