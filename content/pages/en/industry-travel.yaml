  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about travel software
    items:
      - q: How much does a travel booking platform cost?
        a:
          A tour or activity booking site usually costs $4,000 to $10,000. A full platform with many
          suppliers and agent tools costs $32,000 to $72,000 or more.
      - q: Can you connect to our suppliers?
        a: Usually, yes, through their systems or the booking networks they use. Where there is no
          connection, we build simple supplier tools.
      - q: Does the itinerary app work offline?
        a:
          Yes. Tickets, maps, and contacts are stored on the phone so travelers can use them without data
          roaming.
      - q: Can travelers pay a deposit and the balance later?
        a: Yes. Deposits, balance reminders, and automatic payments are built in.
      - q: Do you handle several currencies?
        a: Yes. Prices and payments can be shown and taken in the traveler's currency.
      - q: Can our agents use the same system?
        a: Yes. Agents get tools for quotes, changes, and refunds on the same platform travelers use.
