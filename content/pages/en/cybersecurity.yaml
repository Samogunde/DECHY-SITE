comprehension:
  what: "Cybersecurity is protecting your systems, accounts, and information from being stolen, damaged, or misused, and being ready if something goes wrong."
  problem: "Most breaches come from a small gap: a weak password, an old update, an account with too much access. Many organizations do not know where their gaps are."
  audience: "Owners and leaders who hold customer or payment information, teams building software, and anyone who has been asked about security by a customer or insurer."
  choose: "Start by finding out what you hold and what could go wrong. Then fix the gaps that matter most first, before buying any tools."
  next: "Tell us what you protect and what concerns you. We will suggest a practical first step, such as a review of your most important system."

sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Service
    headline: Cybersecurity
    lead: "At DECHY, we help you protect what matters. We work out what you hold and who might want it, find the weak points, and build practical protection into your software, your systems, and your everyday habits."
    support: "Security is part of how we design and build everything, from software to cloud. It is also a service on its own, for systems you already run."
    ctas:
      - { label: Talk to us about security, href: "/contact/?service=cybersecurity" }
      - { label: See how we prioritize, href: "#layers" }
    spec:
      kind: funnel
      stages:
        - title: Everything that could go wrong
          text: Every possible threat to every system.
        - title: What applies to you
          text: Threats that fit what you hold and how you work.
        - title: What is likely and damaging
          text: Ranked by chance and by harm.
        - title: What to fix first
          text: A short, ordered list you can act on.
        - title: Watch and respond
          text: Alerts and a plan for when something happens.
    purpose: transformation
    takeaway: "Good security does not try to fix everything. It narrows the long list of threats to the few that matter and deals with them first."
    visualTitle: "From every possible threat to a short list to fix"
    figureCaption: "This diagram shows how a long list of possible threats narrows to the few to fix first, and ends with watching and being ready to respond."

  - type: definition
    id: what-is
    tone: white
    label: What it is
    heading: What cybersecurity means for a business
    answer: "Cybersecurity is the set of habits, tools, and design choices that keep your systems and information safe from theft, damage, and misuse. No one can promise zero risk. The aim is to make attacks hard, limit the harm if one succeeds, and recover quickly."
    paragraphs:
      - "People often picture hackers breaking through firewalls. In practice, most problems start with ordinary gaps: a reused password, an unpatched program, a file shared with the wrong person, or a former employee who still has access."
      - "That is good news, because ordinary gaps can be fixed. A clear picture of what you hold, plus a handful of dependable habits, removes most of the risk."

  - type: diagram
    id: layers
    tone: paper
    label: Layers of protection
    heading: Security works in layers
    intro: "No single measure is enough. Protection works best as several layers, so one failure does not open everything."
    spec:
      kind: layers
      layerLabel: Layers of protection
      supportLabel: What backs it up
      layers:
        - title: People and accounts
          text: Strong sign-in and clear habits.
          support:
            - title: Two-step sign-in
              text: A second proof, such as a code on a phone.
        - title: Applications
          text: Software built and tested to resist attack.
          support:
            - title: Secure building habits
              text: Reviews and checks while code is written.
        - title: Information
          text: Encrypted, backed up, and limited to those who need it.
          support:
            - title: Backups that are tested
              text: A way to recover if information is lost or locked.
        - title: Networks and cloud
          text: Locked-down connections and settings.
          support:
            - title: Watching and alerts
              text: Records and warnings when something unusual happens.
    purpose: architecture
    takeaway: "Several layers of protection, each backed by a safeguard, mean one failure does not expose everything."
    caption: "This diagram shows four layers of protection from people at the top to networks at the bottom, each with a safeguard beside it."

  - type: index
    id: services
    tone: white
    columns: 2
    label: What we do
    heading: The security work we do
    items:
      - title: Security reviews and audits
        ref: cap.security-audits
        body: "A structured look at your systems, settings, and habits, with a ranked list of what to fix."
      - title: Security testing
        ref: cap.security-testing
        body: "Safe attempts to break into your software before someone else does."
      - title: Secure software development
        ref: cap.secure-software-development
        body: "Security built into software from the first design, not added at the end."
      - title: Access and sign-in
        ref: cap.access-management
        body: "Making sure the right people have the right access, and nobody else."
      - title: Cloud and application security
        ref: cap.cloud-security
        body: "Protecting what runs in the cloud and the programs that handle your information."
      - title: Backup and recovery planning
        ref: cap.backup-and-disaster-recovery
        body: "A tested plan to get back to work quickly after a failure or attack."

  - type: chooser
    id: help
    tone: paper
    label: Choosing help
    heading: What kind of help do you need?
    intro: "Security help comes in three shapes. Choose by where you are today."
    question: Where are you now?
    options:
      - label: Check what I already have
        when: "You run systems today and want to know how exposed they are."
        get: "A clear report of weaknesses, ranked by risk, with practical fixes."
        watch: "A review is a snapshot. Security needs repeating as things change."
        cta: { label: Ask about a review, href: "/contact/?service=cybersecurity" }
      - label: Build something secure
        when: "You are creating new software or a new system and want it safe from the start."
        get: "Security designed into the plan and tested before launch."
        watch: "It needs involvement early, when changes are cheapest."
        cta: { label: Plan a secure build, href: "/contact/?service=cybersecurity" }
      - label: Watch and respond
        when: "You want ongoing protection and a plan for when something happens."
        get: "Monitoring, alerts, regular checks, and a rehearsed response."
        watch: "It needs a named owner on your side to act on alerts."
        cta: { label: Discuss ongoing protection, href: "/contact/?service=cybersecurity" }

  - type: process
    id: review
    tone: white
    label: How a review runs
    heading: How a security review runs
    steps:
      - title: Agree what to protect
        body: "We list your most important systems and information, and who relies on them."
        artifacts: [List of what matters, Scope of the review]
      - title: Think like an attacker
        body: "We ask how each could be reached and what an attacker would want."
        artifacts: [Threat notes, Likely attack paths]
      - title: Check and test
        body: "We review settings and software, and test safely for weaknesses."
        artifacts: [Findings, Evidence]
      - title: Rank and explain
        body: "We rank findings by risk, in plain language, with the cost and effort of each fix."
        artifacts: [Ranked report, Fix plan]
      - title: Fix and recheck
        body: "We help you fix the most important items and confirm they are closed."
        artifacts: [Fixes verified, Short follow-up report]

  - type: callout
    id: limits
    tone: paper
    variant: note
    title: What no one can promise
    paragraphs:
      - "Be cautious of anyone who promises that you will never be attacked. Security lowers risk. It does not remove it."
      - "What we can promise is honest assessment, practical priorities, and clear explanation. We do not claim certifications or results we cannot show."

  - type: columns
    id: basics
    tone: white
    label: Good habits
    heading: Four habits that remove most risk
    columns:
      - title: Strong sign-in
        items:
          - "Unique passwords kept in a password manager."
          - "A second step on important accounts."
      - title: Keep things updated
        items:
          - "Apply updates to software and devices on a schedule."
          - "Retire programs nobody uses."
      - title: Least access
        items:
          - "People get only the access their job needs."
          - "Access is removed when people leave."
      - title: Backups that work
        items:
          - "Regular copies kept apart from the originals."
          - "A recovery that has been tried, not assumed."

  - type: technical
    id: technology
    tone: paper
    label: Technology
    heading: For technical readers
    intro: "Most visitors can skip this section. It outlines our methods."
    panels:
      - title: Application security
        paragraphs:
          - "We follow the [OWASP](ref:con.owasp) guidance on common web security mistakes: weak access control, injection, insecure design, and misconfiguration. We combine code review, dependency scanning, and testing."
      - title: Identity and access
        paragraphs:
          - "We design sign-in around standards such as [OAuth](ref:con.oauth) and MFA (multi-factor authentication, the second step at sign-in), manage permissions through [IAM](ref:tech.iam) (identity and access management), and protect secrets with [secrets management](ref:con.secrets-management)."
      - title: Encryption and trust
        paragraphs:
          - "Information is protected with [encryption](ref:con.encryption) in transit using [TLS](ref:con.tls-ssl), and at rest. We design with [zero trust](ref:con.zero-trust) ideas: nothing is trusted just because it is inside the network."
      - title: Detection and response
        items:
          - "Central logs and alerts tuned to real signals."
          - "An incident plan: who decides, who acts, who tells customers."
          - "Practice runs, so the plan works under pressure."

  - type: prose
    id: culture
    tone: paper
    label: People and habits
    heading: Security is partly about habits
    paragraphs:
      - "Most security incidents begin with an ordinary mistake: a reused password, a message that looked real, an old account that was never closed. Technology reduces the chance and the damage, but habits matter too."
      - "We pair technical work with simple guidance your team can follow, such as how to report something suspicious, who approves access, and what to do first if an account is lost."

  - type: faq
    id: faq
    tone: white
    label: Common questions
    heading: Questions about security
    items:
      - q: Where do we start if we have never done a security review?
        a: "Start with the system that would hurt most if it failed, such as your customer information or payment flow. A focused review of that one system teaches you the most and gives you a short list to act on."
      - q: Are we too small to be a target?
        a: "Many attacks are automatic and do not choose by size. They look for easy gaps. Small organizations are often targeted because they have fewer protections."
      - q: Do you hold security certifications?
        a: "We do not make certification claims on this site. We describe the work we do and the standards we follow. If your customer or insurer asks for a specific certificate, we will tell you plainly what we can and cannot provide."
      - q: Can you secure software someone else built?
        a: "Yes. We review existing software, find weaknesses, and help fix them, or recommend a safer approach when fixing would cost more than rebuilding."
      - q: What should we do if we think we have been attacked?
        a: "Contact us as soon as you can through the [contact page](/contact/). Do not delete anything, and note what you saw and when. Quick, careful action limits the harm."
      - q: How does this relate to privacy rules?
        a: "Good security helps you meet privacy rules, but the rules have their own requirements. We identify the rules that apply during discovery and recommend that you take legal advice for your situation."

  - type: index
    id: work
    tone: paper
    label: What it looks like
    heading: See the security systems we build
    items:
      - title: Cybersecurity systems
        href: /work/areas/cybersecurity-systems/
        body: "Assessments, secure builds, access controls, and monitoring."

  - type: related
    id: related
    tone: white
    label: Related
    heading: Security across DECHY
    groups:
      - title: Related services
        entityIds:
          [svc.cloud, svc.software-development, svc.api-integration, svc.consulting, svc.ai]
      - title: Technologies and ideas
        entityIds:
          [con.owasp, con.oauth, con.encryption, con.zero-trust, tech.iam, con.secrets-management]
      - title: Systems we build
        entityIds: [workarea.cybersecurity-systems]

  - type: cta
    id: contact-cta
    heading: Tell us what you need to protect
    body: "Describe your most important system or information and what worries you. We will suggest a practical first step and tell you honestly what it will and will not achieve."
    primary: { label: Talk to DECHY about security, href: "/contact/?service=cybersecurity" }
