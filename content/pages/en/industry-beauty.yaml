    panels:
      - title: Payments and deposits
        items:
          - Deposits and no-show fees run through card providers such as Stripe or Square.
          - Cards are stored by the provider, never on your own system.
      - title: Client privacy
        items:
          - Treatment notes and photos are visible only to staff who need them.
          - Clients can see, update, or delete their own details.
