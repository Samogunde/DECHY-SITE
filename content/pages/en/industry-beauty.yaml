  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why beauty businesses need booking built for them
    paragraphs:
      - In a salon, time is the product. An empty hour cannot be sold again, and a no-show costs a
        stylist's full rate. Every booking tool promises to fix this, yet many businesses still
        juggle a booking app, a website, a till, and a notebook of client formulas.
      - We build around your services, your team, and your brand. Clients pick a treatment and a
        person they trust, pay a deposit, and get a reminder they can act on. Staff see the client's
        history before they say hello.
      - Done well, the tools feel as considered as your treatments.
      - "Owners get the view they rarely have: which services earn most, which stylists are booked
        out, and which clients have not been back in three months. A simple campaign to those
        clients often pays for the project on its own."
