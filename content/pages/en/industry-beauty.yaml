  - type: index
    id: needs
    tone: paper
    columns: 2
    label: What we build
    heading: Salon and spa software we build
    intro:
      Each tool works on its own and gets better together. Bookings, notes, loyalty, and sales all
      attach to the same client record your team already knows.
    items:
      - title: Booking website
        body:
          A fast website with real-time booking by treatment, stylist, and location, built to rank in
          local search.
      - title: Branded booking app
        body: An app clients keep on their phone for rebooking, offers, and loyalty points.
      - title: Deposits and cancellation rules
        body: Card deposits and clear cancellation windows that cut no-shows without awkward conversations.
      - title: Client records
        body: Treatment history, color formulas, allergies, and photos, visible to the right staff only.
      - title: Loyalty and referrals
        body: Points, rewards, and referral codes that turn first visits into regular appointments.
      - title: Online product store
        body: Sell the products you use in the chair, with click-and-collect at the salon.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about salon software
    items:
      - q: How much does a salon booking website cost?
        a:
          Most booking websites cost $2,500 to $6,000 and launch in 1 to 3 weeks. A branded app with
          loyalty usually adds $8,000 to $20,000.
      - q: Can we keep the booking system we already pay for?
        a:
          Yes, if it has an open connection. We can build your website and app on top of it, or replace it
          if it holds you back.
      - q: Will deposits put clients off?
        a:
          Rarely, when the rules are clear and refunds are easy. Most salons see far fewer no-shows and
          almost no lost bookings.
      - q: Can we run several locations?
        a: Yes. Clients choose a location, and you see bookings and revenue for each one and for the group.
      - q: Do you build product stores too?
        a: Yes. We add an online shop with click-and-collect, so products sell between visits.
      - q: Can clients rebook straight after an appointment?
        a:
          Yes. The receipt and the app both offer the next appointment with the same stylist, which is one
          of the simplest ways to raise repeat visits.
