  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about custom software
    items:
      - q: How much does custom software cost?
        a: "It depends on scope, complexity, integrations, and the level of assurance required, so any single figure would be a guess. We estimate after a discovery conversation, in stages: a small discovery or prototype first to reduce risk, then a build plan with a range that narrows as unknowns are resolved. If you are comparing providers, ask each what is included in the price: testing, security, documentation, and support after launch."
      - q: How long does a custom software project take?
        a: "A focused internal tool can reach real users in weeks. A multi-role platform with integrations typically takes months, delivered in increments so something usable appears early. The honest answer comes from discovery, because the main drivers are the number of distinct workflows, the quality of the data you start from, and how many external systems must connect."
      - q: Should we build or buy?
        a: "Buy when the need is common and a mature product fits with little customization. Build when the process is specific to you or a source of advantage. Integrate when the tools you have are fine but do not share data. Many projects combine all three, as the comparison above shows."
      - q: Can you work with software we already have?
        a: "Yes. Improving existing systems is a large part of our work: reviewing and stabilizing code, adding features, integrating with other tools, moving to the cloud, or modernizing in stages. The first step is a technical review to understand what is there."
      - q: Who owns the code and the system afterwards?
        a: "Ownership and licensing terms are agreed in writing before work starts. We aim to keep code in a repository you can access, document key decisions, and avoid proprietary lock-in where it is not needed, so your system can be maintained by whoever you choose."
      - q: How is security handled?
        a: "Security is designed in from the architecture stage: authentication and authorization, least-privilege access, encryption in transit and at rest, dependency scanning, and attention to the OWASP Top 10. Where regulation applies, such as privacy law or industry rules, we identify the requirements during discovery. Our [cybersecurity](ref:svc.cybersecurity) practice can also review an existing system."
      - q: Do you support software after launch?
        a: "Yes. Maintenance includes monitoring, patching dependencies, fixing defects, and extending features. Software that matters needs an owner who keeps it current, whether that is your team, us, or both."

