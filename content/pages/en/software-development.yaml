  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about custom software
    items:
      - q: How much does custom software cost?
        a: "It depends on scope, complexity, connections to other systems, and the level of assurance required, so any single figure would be a guess. We estimate after a discovery conversation, in stages: a small discovery or prototype first to reduce risk, then a build plan with a range that narrows as unknowns are resolved. If you are comparing providers, ask each what the price includes: testing, security, documentation, and support after launch."
      - q: How long does a custom software project take?
        a: A focused internal tool can reach real users in weeks. A system with several user roles and connections to other tools typically takes months, delivered in steps so something usable appears early. The honest answer comes from discovery, because the main drivers are the number of distinct workflows, the quality of the information you start with, and how many other systems must connect.
      - q: Should we build or buy?
        a: Buy when the need is common and a mature product fits with little change. Build when the process is specific to you or gives you an edge. Connect when the tools you have are fine but do not share information. Many projects combine all three, as the comparison above shows.
      - q: Can you work with software we already have?
        a: "Yes. Improving existing systems is a large part of our work: reviewing and stabilizing code, adding features, connecting to other tools, moving to the cloud, or modernizing in stages. The first step is a technical review to understand what is there."
      - q: Who owns the code and the system afterward?
        a: Ownership and licensing terms are agreed in writing before work starts. We aim to keep code in a repository you can access, document key decisions, and avoid lock-in where it is not needed, so your system can be maintained by whoever you choose.
      - q: How is security handled?
        a: Security is designed in from the planning stage. That covers sign-in and permissions, giving people only the access they need, encrypting information, and scanning for known weaknesses. We also follow the OWASP list of common web security mistakes. Where rules apply, such as privacy law or industry regulation, we identify the requirements during discovery. Our [cybersecurity](ref:svc.cybersecurity) practice can also review an existing system.
      - q: Do you support software after launch?
        a: Yes. Support includes monitoring, updating parts that age, fixing defects, and adding features. Software that matters needs an owner who keeps it current, whether that is your team, us, or both.
