sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Service
    headline: Software Development
    lead: "At DECHY, we build custom software around the way your organization actually works: business applications, SaaS platforms, portals, dashboards, and internal tools, designed, engineered, tested, and maintained as one continuous practice."
    support: "Software development is one part of our wider work across software, AI, automation, integration, and cloud."
    ctas:
      - { label: Discuss a software project, href: "/contact/?service=software-development" }
      - { label: See how we deliver, href: "#delivery" }
    figure: software-anatomy
    figureCaption: "Conceptual diagram: the parts a custom business application typically has. Real systems vary."

  - type: definition
    id: what-is
    tone: white
    label: What it is
    heading: What custom software development is, and when it is the right answer
    answer: "Custom software development is the design and engineering of software built for one organization's specific processes, data, and users, instead of adopting a product built for the average customer. It is the right answer when the workflow is a source of advantage, when off-the-shelf tools force workarounds, or when several systems need to behave as one."
    paragraphs:
      - "It is often the wrong answer too, and we will tell you when it is. A common spreadsheet process may be better served by a configured platform. A generic need such as invoicing is usually better bought. We start by testing which of build, buy, or integrate fits, because the cheapest software is the software you do not have to write."
      - "When building is right, the work covers more than code. It includes understanding the process, designing the architecture and data model, building the application and its APIs, testing it, securing it, deploying it, and keeping it healthy after launch. We treat those as one practice, which is why [software architecture](ref:cap.software-architecture), [software testing](ref:cap.software-testing), and [software maintenance](ref:cap.software-maintenance) are part of every engagement rather than add-ons."

  - type: table
    id: build-buy-integrate
    tone: paper
    label: Choosing an approach
    heading: Build, buy, or integrate
    intro: "The first decision on most projects. The honest answer depends on how specific the process is and how well existing tools fit it."
    caption: Comparison of build, buy, and integrate approaches
    columns: [Approach, Choose it when, Watch out for, Typical outcome]
    rows:
      - - Build custom software
        - "The process is specific to your organization, a source of advantage, or poorly served by available products."
        - "Higher upfront investment and a long-term ownership responsibility."
        - "A system shaped to your workflow, owned and extended by you."
      - - Buy and configure
        - "The need is common and mature products cover it well, such as accounting, email, or standard HR."
        - "Workarounds that grow over time, license costs that scale with users, and limited control."
        - "Fast to start, with the product's limits built in."
      - - Integrate what you have
        - "Good tools exist but do not share data, so people re-key or reconcile by hand."
        - "Poor or missing APIs, and integrations nobody monitors."
        - "Existing tools behave as one system, with less new code."
      - - Combine them
        - "Most real situations: buy the commodity parts, build the differentiating part, integrate the rest."
        - "Unclear ownership between the pieces."
        - "A pragmatic mix with a clear boundary around what is custom."
    note: "We recommend an approach on the merits of your situation, including recommending against a build."

  - type: index
    id: system-types
    tone: white
    columns: 2
    label: What we build
    heading: Systems we design and build
    intro: "Most projects take one of these shapes, or combine several of them."
    items:
      - title: Business applications and management systems
        ref: cap.business-management-systems
        body: "Applications that run a process end to end: orders, jobs, cases, approvals, inventory, billing. Designed around roles, permissions, and an audit trail."
      - title: SaaS platforms
        ref: cap.saas-development
        body: "Multi-tenant products with accounts, billing, permissions, and operations built in, from first release through scaling."
      - title: Customer and employee portals
        ref: cap.customer-portals
        body: "Secure self-service for customers, partners, or staff: documents, requests, status, payments, and support in one place."
      - title: Dashboards and reporting
        ref: cap.business-dashboards
        body: "Live views of the numbers a team runs on, drawn from the right sources and designed to be trusted."
      - title: Marketplaces
        ref: cap.marketplace-development
        body: "Platforms that connect buyers and sellers, or providers and clients, with listings, matching, payments, and trust features."
      - title: Booking and scheduling systems
        ref: cap.booking-systems
        body: "Appointment, resource, and capacity management with availability rules, reminders, and payments."
      - title: Membership and subscription platforms
        ref: cap.membership-platforms
        body: "Access, billing, renewals, and delivery of content or services for recurring relationships."
      - title: CRM, ERP, and inventory systems
        ref: cap.crm-development
        body: "Custom or extended systems for customer data, resources, stock, and operations where products do not fit."
      - title: Internal tools
        ref: cap.internal-tools
        body: "Focused tools that replace spreadsheets and email chains for one team, built quickly and maintained properly."
      - title: Learning and payment systems
        ref: cap.learning-platforms
        body: "Course delivery, progress tracking, and certification, and payment flows built on providers such as Stripe and PayPal."

  - type: diagram
    id: interfaces
    tone: paper
    label: Interfaces
    heading: What the interface layer of a portal looks like
    intro: "Most people judge a system by its interface. This conceptual wireframe shows how a customer portal might organize navigation, status at a glance, and the records people come for, on a desktop and on a phone."
    figure: portal-wireframe
    photo: { asset: asset.photo-interfaces-wireframes, layout: aside, position: "50% 35%" }
    caption: "Conceptual wireframe of a customer portal. It illustrates a type of system we design and build and is not a client interface."
    points:
      - title: Role-based views
        body: "Customers, staff, and administrators see what they need and nothing they should not, enforced by the same permission model across the interface and the API."
      - title: Designed for every screen
        body: "The phone layout is designed on its own terms rather than shrunk from the desktop one, with touch-sized controls and the most important status first."
      - title: Accessible by default
        body: "Keyboard operation, clear focus, readable contrast, and plain labels are part of the interface standard, not a later remediation."

  - type: process
    id: delivery
    tone: paper
    label: How we deliver
    heading: From first conversation to a system that stays healthy
    intro: "These stages are common to most engagements. Their size depends on the project, and we do not skip any of them."
    steps:
      - title: Discover
        body: "We learn the process, the users, the data, and what success means, and we test whether to build, buy, or integrate."
        artifacts:
          [
            Problem and scope statement,
            Process and data map,
            "Build, buy, or integrate recommendation",
          ]
      - title: Architect
        body: "We choose the shape of the system: components, data model, integration points, security model, and hosting, and we write decisions down with their trade-offs."
        artifacts: [Architecture overview, Data model, Decision records]
      - title: Build
        body: "We deliver in short increments you can see and use, riskiest parts first. Code is reviewed, and every increment is demonstrable."
        artifacts:
          [Working software each iteration, Reviewed and versioned code, Progress you can inspect]
      - title: Test
        body: "Automated tests at several levels, plus accessibility, performance, and security checks, run on every change."
        artifacts:
          [
            Automated test suite,
            Security and dependency scan results,
            Performance and accessibility checks,
          ]
      - title: Release
        body: "Staged releases to a preview environment first, then production, with a rehearsed rollback and a clear handover."
        artifacts: [Deployment pipeline, Release notes, Rollback plan]
      - title: Maintain
        body: "We monitor, patch, and improve after launch. Software that matters needs an owner who keeps it current."
        artifacts:
          [Monitoring and alerts, Dependency and security updates, Documentation and runbooks]

  - type: diagram
    id: quality
    tone: ink
    label: Engineering quality
    heading: Testing, security, and performance are part of the build
    intro: "Quality is a set of habits applied on every change, not a phase at the end. This is the model we work to."
    figure: quality-layers
    caption: "Conceptual diagram of an engineering assurance model: a test pyramid and the gates a change passes before release."
    points:
      - title: Tested at several levels
        body: "Many fast unit tests, fewer integration tests, and a small number of end to end tests for the paths that matter most."
      - title: Secure by design
        body: "Threat-aware design, least-privilege access, dependency scanning, and attention to the [OWASP](ref:con.owasp) Top 10 from the first iteration, not the last."
      - title: Observable in production
        body: "Logs, metrics, and alerts so problems are seen by the team before they are reported by users."

  - type: prose
    id: technology
    tone: paper
    label: Technology approach
    heading: Choosing technology on the merits
    aside:
      title: Architecture styles considered
      items:
        [Modular monolith, Microservices, Serverless, Event-driven, Multi-tenant SaaS, Headless]
    paragraphs:
      - "We are not tied to one stack. The language, framework, database, and hosting for a project are chosen for the problem, the team that will maintain it, and the long-term cost of ownership. That is a deliberate position: a framework chosen because it is fashionable becomes a liability once the people who chose it have moved on."
      - "Across the languages and frameworks we work with, common choices include [Python](ref:lang.python), [TypeScript](ref:lang.typescript), [Java](ref:lang.java), [C#](ref:lang.c-sharp), [Go](ref:lang.go), and [PHP](ref:lang.php) for back ends; [React](ref:fw.react), [Next.js](ref:fw.nextjs), [Vue](ref:fw.vue), and [Angular](ref:fw.angular) for interfaces; [PostgreSQL](ref:tech.postgresql), [MySQL](ref:tech.mysql), and [MongoDB](ref:tech.mongodb) for data; and [AWS](ref:plat.aws), [Azure](ref:plat.azure), and [Google Cloud](ref:plat.google-cloud) for hosting, with [Docker](ref:tool.docker) and [Kubernetes](ref:tool.kubernetes) where containers pay for themselves."
      - "The criteria matter more than the list. We weigh fit with the problem, maturity and community health, the reality of hiring and maintenance, security track record, integration needs, performance, and total cost over the life of the system."

  - type: diagram
    id: modernization
    tone: white
    label: Modernization
    heading: Replacing legacy software without stopping the business
    intro: "Old software is rarely rewritten in one step. The safer path is to wrap it, replace it module by module, and retire it only when nothing depends on it."
    figure: modernization-path
    caption: "Conceptual diagram of a staged modernization, often called the strangler pattern."
    points:
      - title: Assess before touching
        body: "Map what the system does, what depends on it, and where the data lives. Surprises found here are cheap; surprises found in production are not."
      - title: Keep the business running
        body: "A new layer in front lets old and new run side by side, so users never face a cutover weekend."
      - title: Move the data carefully
        body: "Data migration is planned, rehearsed, and verified, with a way back if a check fails."

  - type: prose
    id: connected
    tone: paper
    label: Beyond the application
    heading: Software that connects to AI, automation, and the cloud
    paragraphs:
      - "A modern business application rarely stands alone. It exchanges data with a CRM or accounting system, takes payments, sends notifications, and increasingly includes AI features such as search over your documents, drafting, classification, or an assistant that can act inside the system."
      - "Because we also work on [AI and machine learning](ref:svc.ai), [automation and workflows](ref:svc.automation), [API and systems integration](ref:svc.api-integration), and [cloud and DevOps](ref:svc.cloud), we design those pieces with the application instead of bolting them on afterwards. Authentication, permissions, data models, and hosting are decided once, so an AI feature respects the same access rules as the rest of the product."
      - "That is the practical meaning of designing software, AI, automation, integration, and cloud as one system. It is also why security and observability belong in the first architecture discussion rather than in a later hardening phase."

