        entityIds: [svc.automation]
      - title: Related technologies
        entityIds: [tech.zapier, tech.make, tech.n8n, plat.notion, plat.mondaycom]
      - title: Related services
        entityIds: [svc.software-development, svc.api-integration]
      - title: Solutions
        entityIds: [sol.internal-business-software, sol.workflow-automation]
      - title: Systems we build
        entityIds:
          [
            workarea.internal-business-tools,
            workarea.workflow-automation,
            workarea.operations-platforms,
          ]
      - title: Where it applies
        entityIds: [ind.construction, ind.media, ind.nonprofits]

  - type: cta
    id: contact-cta
    heading: Tell us which spreadsheet your team depends on
    body: "Describe it and who uses it. We will say how it would look in Airtable, what it would cost to run, and when you would need something more."
    primary: { label: Discuss your Airtable project, href: "/contact/?service=automation" }
