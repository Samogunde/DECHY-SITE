  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why restaurants are taking ordering back
    paragraphs:
      - Delivery platforms brought restaurants new customers, then took up to a third of every
        order. Many owners now pay more in commission than in rent. The customers who order every
        week are often regulars who would happily order direct if it were just as easy.
      - A direct ordering site and app give those regulars an easy reason to switch. You set the
        prices, keep the data, and reward loyalty with your own offers instead of paying a platform
        for the privilege.
      - Inside the restaurant, the same system routes orders to the kitchen in sequence, keeps menus
        and stock in step across every channel, and shows you which dishes and sites earn the most.
      - We design for the busiest hour of the week. Ordering stays fast under load, the kitchen sees
        a calm queue, and staff never retype an order from one screen to another.
  - type: index
