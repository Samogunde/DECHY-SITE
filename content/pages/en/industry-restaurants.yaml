    label: What we build
    heading: Restaurant software we build
    intro: Each tool is useful on day one, and together they give you one picture of every guest and
      every site.
    items:
      - title: Direct ordering
        body: Delivery and collection ordering on your own site, with your prices and no per-order
          commission.
      - title: Ordering app with loyalty
        body: A branded app where regulars reorder favorites in two taps and collect rewards.
      - title: Table booking
        body: Online booking with deposits for busy nights and automatic reminders that cut no-shows.
      - title: Kitchen display
        body: Orders from every channel shown in sequence, with timers and clear status for the pass.
      - title: Menu management
        body: Change a price or mark a dish sold out once, and every channel updates.
      - title: Multi-site reporting
        body: Sales, margins, and top dishes by site and hour, without exporting spreadsheets.
