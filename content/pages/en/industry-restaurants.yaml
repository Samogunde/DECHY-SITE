  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about restaurant software
    items:
      - q: How much does a restaurant ordering system cost?
        a:
          A direct ordering website usually costs $2,500 to $6,000 and launches in 1 to 2 weeks. A branded
          app with loyalty usually costs $10,000 to $24,000.
      - q: Will customers really order direct?
        a:
          Regulars will, when ordering is just as easy and they get a reward for it. Most restaurants move
          a good share of repeat orders within months.
      - q: Can you connect to our till?
        a:
          Usually, yes. We send orders to your point-of-sale system or to a kitchen display, so staff never
          retype them.
      - q: Can we keep using delivery platforms?
        a: Yes. Many restaurants keep platforms for new customers and use direct ordering for regulars.
      - q: Do you build for restaurant groups?
        a: Yes. Groups get one platform for every site, with central menus and reports for each location.
      - q: Who handles delivery?
        a:
          Your own drivers, or an on-demand courier booked automatically for each order. You choose per
          site.
