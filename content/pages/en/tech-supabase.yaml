  - type: prose
    id: what
    tone: white
    label: What it means
    heading: A hosted back end on a database you can take with you
    paragraphs:
      - "Supabase offers what a hosted back end offers: accounts, storage, live updates, and functions. The difference is the center. Underneath is [PostgreSQL](ref:tech.postgresql), a database that thousands of other tools and teams already know."
      - That choice has practical effects. Data is held in tables with relationships, so orders, customers, and invoices join cleanly. Reports can be written in ordinary SQL. And if the product outgrows the service, the database can move to another host without a rewrite, because it is the same database.
      - Access control is also done in the database. Rules, called row-level policies, say which rows each person may see or change, so a mistake in the app is less likely to expose someone else's data.
  - type: index
    id: uses
    tone: white
    columns: 2
    label: Typical uses
    heading: Where Supabase fits well
    items:
      - title: A software-as-a-service product
        body: Customer accounts, subscriptions, and per-customer data, kept apart by access rules.
      - title: An internal tool or portal
        body: Staff or customers see their own records, with the same data available to reports.
      - title: A prototype that may become the product
        body: Built quickly, on a database that can carry the real product later.
      - title: A move off a back end that has become limiting
        body: Data brought into a relational database, so reporting and relationships become straightforward.
  - type: process
    id: build
    tone: paper
    label: How we build it
    heading: A Supabase project from first design to launch
    steps:
      - title: Model the data
        body: We design the tables and relationships around what the product must do and report.
        artifacts:
          - Data model
      - title: Write the access rules
        body: Row-level policies decide who sees what. We test them as carefully as any feature.
        artifacts:
          - Access policies
          - Policy tests
      - title: Build the product on top
        body: Screens and server functions use the platform's services instead of re-creating them.
        artifacts:
          - Working product
      - title: Prepare to grow
        body: Backups, environments, and monitoring are set up, and the exit plan is written down.
        artifacts:
          - Environments
          - Runbook
  - type: table
    id: options
    tone: paper
    label: Options
    heading: Supabase compared with the alternatives
    caption: Supabase compared with other ways to give an app a back end
    columns:
      - Option
      - Suits
      - Trade-off
    rows:
      - - Supabase
        - Relational data, reporting needs, fast delivery, and a wish to keep the exit open.
        - A younger service, with fewer built-in extras than the largest platforms.
      - - "[Firebase](ref:plat.firebase)"
        - Very simple live data, mobile-first apps, and the fastest first version.
        - A proprietary data model that is harder to leave and to report on.
      - - Custom back end
        - Complex rules, unusual hosting or compliance needs, and large scale.
        - More to build and operate, so a later first release.
      - - "[Next.js](ref:fw.nextjs) with your own database"
        - Web products where one team controls the whole stack.
        - You assemble sign-in, storage, and live data yourself.
  - type: columns
    id: dechy
    tone: white
    label: What DECHY can do
    heading: Working with Supabase
    columns:
      - title: Build
        items:
          - New products on [Next.js](ref:fw.nextjs) or [React](ref:fw.react) with Supabase behind them.
          - Mobile apps that use the same back end.
      - title: Secure
        items:
          - Row-level access rules, tested.
          - Sign-in with email, social accounts, or your own identity provider.
      - title: Migrate
        items:
          - Moving a product from Firebase or another back end into a relational database.
          - Checks that every record arrived and relationships held.
      - title: Look after
        items:
          - Backups, upgrades, and performance reviews.
          - Self-hosting when you need it on your own infrastructure.
  - type: technical
    id: technology
    tone: paper
    label: Technical depth
    heading: For technical readers
    intro: Most visitors can skip this section. It notes how we build on Supabase.
    panels:
      - title: Database
        items:
          - Schema changes are written as versioned migrations and applied the same way in every environment.
          - Indexes are added for the queries the product actually runs, and checked with query plans.
          - Business rules that must always hold are enforced by constraints in the database.
      - title: Security
        items:
          - Row-level security is switched on for every table that holds user data.
          - The public key is safe to ship to the browser only because the policies protect the data; the service key never leaves the server.
          - Sign-in sessions are short-lived and refreshed securely.
      - title: Server logic
        paragraphs:
          - Work that must not run in the browser, such as payments or sending email, runs in server functions that check the caller before acting.
      - title: Portability
        paragraphs:
          - Because the core is PostgreSQL, a dump and restore moves the data to any other PostgreSQL host. We keep application logic in our own code so that moving is a task, not a rewrite.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about Supabase
    items:
      - q: Is Supabase production ready?
        a: "Many products run on it. As with any hosted platform, readiness depends on the set-up: access rules, backups, monitoring, and a plan for growth."
      - q: Can we host it ourselves?
        a: Yes. The platform can be run on your own infrastructure, and the database itself can be moved to any PostgreSQL host.
      - q: Supabase or Firebase?
        a: Supabase suits structured data and reporting and keeps the exit open. Firebase suits very simple, live data. We compare them against your product.
      - q: Can we move to Supabase from Firebase?
        a: Yes. We redesign the data as tables, move it in stages, and run both until the new back end has been checked.
