comprehension:
  what: Supabase is a ready-made back end built around a standard PostgreSQL database, with sign-in, file storage, and live updates included.
  problem: Teams want the speed of a hosted back end but not the lock-in of a proprietary database, and they need relational data and reporting.
  audience: Product teams building web or mobile apps with structured data, and teams looking for an alternative to Firebase.
  choose: Choose Supabase for a quick start on a real relational database that you can host elsewhere later. Choose Firebase for the simplest live data, or a custom back end for unusual needs.
  next: Tell us about the product and its data. We will say whether Supabase fits and outline the set-up.
