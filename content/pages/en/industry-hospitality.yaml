  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why hotels invest in their own booking and guest tools
    paragraphs:
      - Guests often find a hotel on a travel agency site and then book there, because the hotel's
        own booking flow is slower or more confusing. The commission on that booking can wipe out
        the margin on the room.
      - A fast, clear direct booking flow changes the habit. When guests see the same price, a small
        perk, and a booking that takes a minute, many book direct. Every one of those bookings is a
        guest you can talk to before and after the stay.
      - During the stay, a guest app or web check-in removes queues at the desk, handles requests,
        and offers upgrades at the moment guests are most likely to say yes.
      - We build around the property management system you already run, so rates, rooms, and guest
        details stay in one place and staff are not asked to learn a second system.
  - type: index
    id: needs
