  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about hotel software
    items:
      - q: How much does a hotel booking website cost?
        a:
          A hotel website with a direct booking flow usually costs $4,000 to $10,000 and launches in 2 to 3
          weeks.
      - q: Can you connect to our property management system?
        a: Usually, yes. We connect through its interfaces so rooms, rates, and guests stay in sync.
      - q: Will guests really book direct?
        a:
          Many will, when the flow is fast and the price is the same or better. A small direct-booking perk
          helps.
      - q: Do we need an app or is a web app enough?
        a:
          Most hotels start with a web app guests open from a link, which needs no download. Groups with
          loyal guests often add a native app.
      - q: Can you handle events and meeting rooms?
        a:
          Yes. We build booking for meeting rooms, weddings, and events with packages, deposits, and
          contracts.
      - q: Do you work with hotel groups?
        a: Yes. Groups get one platform across properties, with central rates, offers, and reporting.
