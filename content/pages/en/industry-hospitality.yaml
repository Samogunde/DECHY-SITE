    label: What we build
    heading: Hospitality software we build
    intro: Every tool connects to your property system, so rooms, rates, and guests stay in one place.
    items:
      - title: Direct booking website
        body: Fast room search, clear prices, and a booking flow guests finish on their phone.
      - title: Online check-in
        body: Details, payment, and arrival time collected before the guest reaches the desk.
      - title: Upsells and extras
        body: Room upgrades, breakfasts, late checkout, and experiences offered at the right moment.
      - title: Guest app or web app
        body: Requests, messages, dining, and local guides in one place during the stay.
      - title: Venue and event booking
        body: Meeting rooms, weddings, and events with packages, deposits, and contracts.
      - title: Guest feedback and reviews
        body: Feedback collected after the stay and happy guests guided to public reviews.
