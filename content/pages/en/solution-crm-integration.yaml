comprehension:
  what: CRM integration connects your customer relationship management (CRM) system, where customer records live, to the other tools that create or need those records.
  problem: The customer record in the CRM disagrees with billing, the website, and support, so staff re-type details, chase the latest version, and trust none of them.
  audience: Sales, service, and operations leaders whose teams work across a CRM and several other tools, and owners who want one reliable view of each customer.
  choose: Decide which system owns each piece of data first. Then connect the systems so that each fact is entered once and flows to where it is needed.
  next: Tell us which tools hold customer data today and where the records disagree. We will map the flows and outline the first connection.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Solution
    headline: CRM integration
    lead: A customer relationship management system, or CRM, is meant to be the one place that knows each customer. In practice the website, billing, support, and marketing tools each hold their own version. We connect them so that every fact is entered once and appears everywhere it is needed.
    support: This page explains how CRM connections are designed, the patterns we use, and the decisions that matter more than the technology.
    ctas:
      - label: Talk to us about your CRM
        href: /contact/?service=api-integration
      - label: How data should flow
        href: "#patterns"
    spec:
