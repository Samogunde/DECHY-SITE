        body: Orders, stock, shipping, and prices stay in step between your shop and the systems behind it.
      - title: Company software and accounting
        ref: cap.erp-integration
        body: Operations software and finance systems share the same numbers, so reports agree.
      - title: Older systems and new tools
        ref: cap.legacy-system-integration
