  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about connecting systems
    items:
      - q: Can any two systems be connected?
        a: Most can. Modern tools usually offer a way to connect. Older systems may need a different
          approach. We check what each tool allows before promising anything, and we tell you
          honestly when a connection is not worth building.
      - q: Is our information safe when it moves between systems?
        a:
          It can be. We use secure connections, limit each link to the permissions it needs, protect access
          keys, and keep a record of what moves. Sensitive information gets extra care, including
          whether it should move at all.
      - q: What if one of the systems changes or goes down?
        a:
          Dependable connections expect this. They retry, keep a queue of waiting work, and alert a person
          if a problem lasts. We also watch for changes in the tools we connect.
      - q: How long does an integration take?
        a:
          A single integration between two systems usually takes about a week and costs {{fact:price.api-integration-single-integration}}.
          Connecting several systems takes 2 to 4 weeks and costs {{fact:price.api-integration-multi-system-integration}}. Larger
          integration platforms take 6 to 10 weeks.
      - q: Do we need integration or automation?
        a:
          Often both. Integration moves information between systems. [Automation](ref:svc.automation) uses
          those connections to run a process, with rules and approvals. We help you decide where
          each fits.
      - q: Can you connect our older software?
        a:
          Usually, yes, though the method varies. It may be a database connection, a file exchange, or a
          new layer placed in front. It is also a good first step toward modernizing, one piece at a
          time.
