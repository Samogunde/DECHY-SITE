  - type: prose
    id: problem
    tone: white
    label: The problem
    heading: Why your systems stop talking to each other
    paragraphs:
      - Businesses buy tools one at a time. A website here, a customer database there, an accounting package, a payment service, a stock system. Each purchase makes sense. Nobody plans how they will share information, so people become the connection.
      - That shows up as double entry, reports that disagree, orders that wait for someone to key them in, and customers who get asked for the same details twice. It is slow, and every re-typed detail is a chance for a mistake.
      - The fix is rarely a new system. It is usually a set of dependable connections between the systems you already trust.
