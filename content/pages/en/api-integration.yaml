comprehension:
  what: Integration connects separate business systems, such as your website, customer records, payments, and accounting, so information moves between them automatically.
  problem: When systems do not share information, people type the same details more than once, numbers disagree between reports, and things get missed.
  audience: Teams that use several tools for one process, and owners who suspect they pay people to copy information between screens.
  choose: Connect systems when your tools are fine but separate. Choose the simplest connection that is reliable, and replace a tool only when it cannot be connected.
  next: List the tools involved and what you wish moved between them automatically. We will say what is possible and how to do it safely.
