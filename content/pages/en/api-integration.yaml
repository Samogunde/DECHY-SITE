    points: []
  - type: definition
    id: what-is
    tone: white
    label: Our approach
    heading: Connecting the systems you already run
    answer: We make separate systems share information and work as one. Most tools offer an API, a
      defined way for one program to request or send information to another, and we build the
      connections on top of it, then watch them so they keep working.
    paragraphs:
      - Most modern tools offer an API. Connecting two tools means using their APIs to send the
        right information, in the right format, at the right moment, with the right permissions.
      - Good integration is more than a link. It also decides what happens when something fails, how
        to avoid duplicates, who is allowed to see what, and how to know it is still working.
  - type: index
    id: connections
    tone: paper
    columns: 2
    label: Common connections
    heading: The connections we build most often
    items:
      - title: Website and customer records
        ref: cap.crm-integration
        body:
          Inquiries and orders flow into your customer system as soon as they happen, with nothing lost
