  - type: table
    id: patterns
    tone: white
    label: Ways to connect
    heading: Three ways to connect systems
    intro: There is more than one way to join systems. The right one depends on how many systems are involved and how much they change.
    caption: Comparison of three ways to connect systems
    columns:
      - Way to connect
      - How it works
      - Good when
      - Watch out for
    rows:
      - - Direct link
        - Two systems talk to each other straight away.
        - You are connecting two tools, and the connection is simple.
        - Many direct links become hard to manage as you add tools.
      - - Central hub
        - Every system connects to one middle layer, which passes information on.
        - You have several systems, and want one place to see and control the flow.
        - The hub becomes important, so it needs care and monitoring.
      - - Event-based
        - Systems announce what happened, and others react when they hear it.
        - Things change often, and many parts need to know quickly.
        - It is harder to follow, so good records are essential.
  - type: diagram
    id: one-connection
    tone: paper
    label: How it works
    heading: What happens inside one connection
    intro: Behind every dependable link between two systems is the same short series of steps.
    spec:
      kind: flow
      steps:
        - title: Something changes
          text: A customer is added, or an order is paid.
        - title: A message is sent
          text: The first system announces the change.
        - title: The details are checked
          text: Required fields, formats, and duplicates are verified.
        - title: The other system is updated
          text: The record is created or changed.
        - title: Success is confirmed or retried
          text: If it fails, the system tries again and alerts someone.
    purpose: sequence
    takeaway: A dependable connection checks the information, confirms the result, and retries or alerts if anything fails.
    caption: This diagram traces the five steps inside one connection between two systems, from the change that starts it to the confirmation or retry at the end.
  - type: callout
    id: when-not
    tone: white
    variant: limits
    title: When connecting is not the answer
    paragraphs:
      - Some tools cannot be connected well, or are so limited that every fix is a workaround. In that case, replacing the tool is cheaper than building around it.
    items:
      - The tool has no way for other systems to reach it.
      - The connection would cost more than the tool.
      - The tool is about to be retired.
      - The real problem is an unclear process, not missing links.
  - type: technical
    id: technology
    tone: paper
    label: Technology
    heading: For technical readers
    intro: Most visitors can skip this section. It explains how we build connections.
    panels:
      - title: Styles of API
        paragraphs:
          - We work with [REST](ref:tech.rest) APIs, [GraphQL](ref:tech.graphql), [webhooks](ref:tech.webhooks) for real-time notices, and older formats such as SOAP when a system needs them. For business tools we use their official APIs, including [Salesforce](ref:int.salesforce-api), [HubSpot](ref:int.hubspot-api), [Shopify](ref:int.shopify-api), [Microsoft Graph](ref:int.microsoft-graph), and the [Google APIs](ref:int.google-apis).
      - title: Payments
        paragraphs:
          - For payments we integrate providers such as [Stripe](ref:int.stripe), [PayPal](ref:int.paypal), [Paystack](ref:int.paystack), [Flutterwave](ref:int.flutterwave), and [Adyen](ref:int.adyen), taking care with payment status, refunds, and records that must match.
      - title: Safe sign-in between systems
        paragraphs:
          - We use standard sign-in methods such as [OAuth 2](ref:con.oauth2) and [OpenID Connect](ref:tech.openid-connect), keep access keys in a secure store, and grant each connection only the permissions it needs.
      - title: Reliability
        items:
          - Retries with increasing waits, and queues for work that cannot be processed right away.
          - Duplicate protection, so a message handled twice does not create two records.
          - Rate-limit awareness, so we do not overload a partner's system.
          - Logs, metrics, and alerts for every connection.
          - An [API gateway](ref:tech.api-gateway) or event-based design when the number of systems grows.
