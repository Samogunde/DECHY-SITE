  - type: definition
    id: what-is
    tone: white
    label: What it is
    heading: What integration and an API actually are
    answer: Integration is making separate software systems share information and work together. An API is a defined way for one program to ask another for information or to send it some, much like a waiter carrying orders between a table and the kitchen.
    paragraphs:
      - Most modern tools offer an API. Connecting two tools means using their APIs to send the right information, in the right format, at the right moment, with the right permissions.
      - Good integration is more than a link. It also decides what happens when something fails, how to avoid duplicates, who is allowed to see what, and how to know it is still working.
  - type: index
    id: connections
    tone: paper
    columns: 2
    label: Common connections
    heading: The connections we build most often
    items:
      - title: Website and customer records
        ref: cap.crm-integration
        body: Enquiries and orders flow into your customer system as soon as they happen, with nothing lost in an inbox.
      - title: Payments and accounting
