  - type: faq
    id: faq
    tone: white
    label: Cost questions
    heading: The cost questions we hear most
    items:
      - q: How much does custom software cost?
        a: "Most custom software we build costs $15,000 to $100,000. A focused internal tool starts around $15,000; enterprise systems and modernization start around $100,000 and are delivered in stages."
      - q: How much does a website cost?
        a: "A landing page costs $2,000 to $4,000, a business website $3,000 to $7,000, and a larger content site $5,000 to $10,000. Web apps with accounts and payments cost $5,000 to $50,000 or more."
      - q: How much does a mobile app cost?
        a: "A first version of an app costs $10,000 to $20,000. Business apps cost $20,000 to $35,000, marketplace apps $30,000 to $50,000, and complex apps from $50,000."
      - q: Why do quotes for the same project vary so much?
        a: "Usually because they cover different work. Check that every quote includes design, testing, data migration, launch, and support before you compare totals."
      - q: Do you charge fixed prices or by the hour?
        a: "Defined projects get a fixed price in writing. Open-ended work, such as ongoing improvements or a dedicated team, is billed monthly at rates agreed before it starts."
      - q: What does software cost to run after launch?
        a: "Plan for hosting, updates, and improvements. Our care plans start at $300 a month for websites and $1,200 a month for apps in daily use."

