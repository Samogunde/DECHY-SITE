    label: Cost guides
    heading: Every cost guide, in one place
    intro: "Each guide shows typical ranges, a breakdown table, what is included, what changes the price, a timeline, and a worked example."

  - type: faq
    id: faq
    tone: white
    label: Cost questions
    heading: The cost questions we hear most
    items:
      - q: How much does custom software cost?
        a: "Most custom software we build costs {{fact:price.summary-custom-software}}. A focused internal tool can start from {{fact:price.summary-custom-software-start}}; enterprise systems and modernization start from {{fact:price.software-development-enterprise-system-or-modernization-from}} and are delivered in stages."
      - q: How much does a website cost?
        a: "Most business websites cost {{fact:price.summary-website}}, and a landing page starts from {{fact:price.summary-website-start}}. A larger content site costs {{fact:price.web-development-content-or-cms-website}}. Most web apps cost {{fact:price.summary-web-app}}; advanced web apps with many roles and integrations cost more."
      - q: How much does a mobile app cost?
        a: "Most business apps cost {{fact:price.summary-mobile-app}}. A first version to test an idea can start from {{fact:price.summary-mobile-app-start}}, and marketplace apps cost {{fact:price.mobile-app-development-marketplace-or-on-demand-app}}."
      - q: Why do quotes for the same project vary so much?
        a: "Usually because they cover different work. Check that every quote includes design, testing, data migration, launch, and support before you compare totals."
      - q: Do you charge fixed prices or by the hour?
        a: "Defined projects get a fixed price in writing. Open-ended work, such as ongoing improvements or a dedicated team, is billed monthly at rates agreed before it starts."
      - q: How do invoices and payments work?
        a: "The payment schedule is set out in your written quote before any work starts, so you know what is due and when. For a question about an invoice or a payment, email {{email:billing}}."
      - q: What does software cost to run after launch?
        a: "Plan for hosting, updates, and improvements. Our care plans start from {{fact:price.care-essential-from}} a month for websites and {{fact:price.care-growth-from}} a month for apps in daily use."
  - type: cta
    id: contact-cta
    heading: Get a fixed quote for your project
    body: "Tell us what you are building. We reply with a written plan, a fixed price, and a timeline, free."
    primary: { label: Get a quote, href: "/contact/" }
