  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about field service software
    items:
      - q: How much does field service software cost?
        a:
          A technician app with dispatch and invoicing usually costs $12,000 to $30,000 and takes 4 to 8
          weeks.
      - q: Why not buy an off-the-shelf tool?
        a:
          Many companies should, and we will say so. We build when your trade, pricing, or workflow does
          not fit the packaged tools.
      - q: Can customers book online?
        a: Yes. Customers choose a service and a real slot, and dispatch sees the job instantly.
      - q: Can technicians take payments?
        a: Yes. Technicians take card payments on site, and the invoice is marked paid automatically.
      - q: Does it work for franchise networks?
        a: Yes. Each franchise runs its own jobs, and the owners see performance across the whole network.
      - q: Can customers track the technician on the way?
        a:
          Yes. Customers get a text when the technician is on the way, with an arrival estimate, which cuts
          calls and missed appointments.
