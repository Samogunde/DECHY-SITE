  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why field service businesses outgrow the whiteboard
    paragraphs:
      - A small team can run on phone calls and a whiteboard. Past a handful of vans it breaks. Jobs
        are double-booked, technicians drive across town twice, and invoices wait until someone
        types up the paper sheets on Friday.
      - The fix is one flow from call to cash. Customers book a slot that really exists, dispatch
        assigns by skill and location, and the technician closes the job with photos, a signature,
        and a payment on site.
      - We build that flow around how your trade works, and connect it to the accounts you already
        keep. Your team spends its day on jobs and customers instead of chasing paper, phone calls,
        and unpaid invoices.
      - "Owners finally see the numbers that matter: jobs per technician, first-time fix rate,
        average invoice, and how many customers come back. These figures show where to hire, what to
        charge, and which jobs to chase."
  - type: index
    id: needs
    tone: paper
    columns: 2
    label: What we build
    heading: Field service software we build
    intro:
      Use one piece or the whole flow. Each part updates the same job record, so the office, the
      technician, and the customer always see the same status.
    items:
      - title: Online booking
        body: Customers choose a service and a real time slot, with the price shown up front.
      - title: Dispatch board
        body: Drag-and-drop scheduling by skill, location, and availability, with live job status.
      - title: Technician app
        body: Job details, history, checklists, photos, and signatures, working offline.
      - title: Quotes and upsells
        body: Good, better, best options sent on site and approved on the customer's phone.
      - title: Invoicing and payments
        body: Invoices raised when the job closes and paid by card before the van leaves.
      - title: Service plans
        body: Recurring maintenance visits scheduled and billed automatically.
