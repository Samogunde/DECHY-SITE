          ]
      - title: Related services
        entityIds: [svc.ui-ux, svc.software-development]
      - title: Solutions
        entityIds: [sol.customer-experience-systems, sol.booking-platforms]
      - title: Systems we build
        entityIds: [workarea.mobile-apps, workarea.operations-platforms]
      - title: Where it applies
        entityIds: [ind.logistics, ind.finance, ind.retail]

  - type: cta
    id: contact-cta
    heading: Tell us about the app and your users
    body: "Describe what the app does and where your users are. We will say whether native Android is justified and how to handle the range of devices."
    primary:
      { label: Discuss your Kotlin project, href: "/contact/?service=mobile-app-development" }
