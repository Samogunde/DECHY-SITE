sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Service
    headline: Automation, Workflows & AI Solutions
    lead: At DECHY, we take repetitive work off your team. We map how work really flows, automate the steps that deserve it, and connect the tools involved, so approvals, updates, and reports happen on their own.
    ctas:
      - label: Discuss your automation project
        href: /contact/?service=automation
      - label: See what to automate first
        href: "#first"
    visualTitle: A request moving through its steps
    figureCaption: This sketch shows a conceptual workflow board with one request moving through four steps, each with an owner and a status label. It illustrates a type of system we build and is not a client's workflow.
    figure: workflow-ui
    purpose: workflow
    takeaway: An automated process shows each step, who owns it, and where the request stands, so nothing waits unseen.
  - type: prose
    id: what-is
    tone: white
    label: What it is
    heading: Why so much work is still done by hand
    paragraphs:
      - In most organizations, work moves between people and tools by copy, paste, and email. A request arrives in one place. Someone re-types it into another. A reminder lives in a person's head. Each step is small. Together they eat hours every week and cause errors.
      - Automation means using software to carry out those repeating steps by following rules you set. A workflow is the path a piece of work takes, from the first request to the finished result. Automating a workflow means the work moves along by itself and people step in only where judgment is needed.
      - Automation is not one product. It can be a simple link between two tools, a process with approvals and reminders, or a system that runs a whole department's routine. It is also not the same as AI. Most automation follows clear rules. AI is added only where a step needs reading, language, or judgment.
  - type: diagram
    id: anatomy
    tone: paper
    label: How it works
    heading: The five parts of every reliable automation
    intro: Whatever tool is used, a dependable automation has the same five parts. The last one matters most, and it is the one people forget.
    spec:
      kind: flow
      steps:
        - title: Something happens
          text: A form is sent, an email arrives, or a set time is reached. This starts the work.
        - title: Rules decide
          text: Simple checks decide where the work goes and what happens next.
        - title: Information moves
          text: Details are copied into the right tools, with no re-typing.
        - title: People step in when needed
          text: Approvals and unusual cases go to a person, with all the details in front of them.
        - title: It is recorded and watched
          text: A log, automatic retries, and alerts when something fails.
    purpose: workflow
    takeaway: A trustworthy automation starts on a trigger, follows rules, hands off to people when needed, and has a safety net for failures.
    caption: This diagram walks through the five parts of an automated workflow, from the event that starts it to the record and alerts that keep it safe.
    points:
      - title: A trigger starts the work
        body: Nobody has to remember to begin. The event itself starts the process.
      - title: People stay where judgment matters
        body: We design approval steps so a person sees what they need and decides quickly.
      - title: Failures are expected
        body: Connections drop and information arrives incomplete. A good automation retries, records what happened, and tells a person.
  - type: diagram
    id: request-flow-map
    tone: white
    label: Before and after
    heading: One purchase request, by hand and automated
    intro: Automation removes the waiting and re-typing between steps and leaves the decisions to people.
    spec:
      kind: before-after
