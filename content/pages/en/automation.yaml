comprehension:
  what: "We take repetitive work off your team: software moves information between systems, sends reminders, routes approvals, and updates reports without manual steps."
  problem: People spend hours copying data, chasing approvals, and fixing small mistakes. Work waits on whoever remembers to do the next step.
