          - title: The manager approves in one click
          - title: The accounting record is created for you
      hubLabel: Connected automatically
    purpose: before-after
    takeaway: Automation removes the waiting and re-typing between steps, and leaves people to make the decisions.
    visualTitle: One purchase request, by hand and automated
    caption: This diagram contrasts one purchase request handled by hand with the same request automated, so you can see where the waiting and re-typing disappear.
    points: []
  - type: index
    id: first
    tone: white
    columns: 2
    label: Where to start
    heading: Good first tasks to automate
    intro: The best first automations are frequent, follow clear rules, and are tedious by hand. These are the ones we see most often.
    items:
      - title: Moving information between tools
        ref: cap.data-automation
        body: A new order, inquiry, or booking appears in one tool and needs to appear in two more. Automation copies it, every time, without mistakes.
      - title: Approvals and sign-offs
        ref: cap.approval-workflows
        body: Requests go to the right person, with reminders, and the decision is recorded. Nobody has to chase.
      - title: Reports and updates
        ref: cap.financial-reporting-automation
        body: Weekly numbers collected from several tools and sent to the people who need them, on time.
      - title: Customer follow-up
        ref: cap.email-automation
        body: Confirmation, reminders, and next steps go out when they should, in your own words.
      - title: Onboarding new customers and staff
        ref: cap.customer-onboarding-automation
        body: Accounts, welcome messages, and checklists are created in one go instead of across a dozen manual tasks.
      - title: Invoices, payments, and paperwork
        ref: cap.document-automation
        body: Documents are created, filed, and matched with payments without someone retyping the details.
  - type: table
    id: tools
    tone: paper
    label: Choosing a tool
    heading: Which automation tool fits?
    intro: There are many good tools. The right one depends on how complex the work is, how much you want to own, and what you already use.
    caption: Comparison of common automation tools
    columns:
      - Tool
      - Good for
      - Keep in mind
      - Often chosen when
    rows:
      - - "[Zapier](ref:tech.zapier)"
        - Quick connections between popular apps, with little setup.
        - Costs rise as the number of tasks grows, and complex logic gets awkward.
        - A simple, well-defined link is needed fast.
      - - "[Make](ref:tech.make)"
        - Visual, multi-step workflows with branching and more control than simple links.
        - It takes more care to design and maintain.
        - The process has several steps and conditions.
      - - "[n8n](ref:tech.n8n)"
        - Flexible workflows you can host yourself, with room for custom code.
        - You, or we, need to look after where it runs.
        - You want control over where information goes, or very custom logic.
      - - "[Microsoft Power Automate](ref:tech.microsoft-power-automate)"
        - "Automation inside the Microsoft 365 world: Outlook, Teams, SharePoint, and Excel."
        - It is strongest within Microsoft tools.
        - Your team already lives in Microsoft 365.
      - - "[Airtable](ref:plat.airtable) automations"
        - A shared database with built-in automation, good for teams that run on structured records.
        - It suits workflows built around the records stored in it.
        - Your process centers on a table of projects, requests, or customers.
      - - Custom software
        - High volume, special security needs, or logic that tools cannot express.
        - More effort to build and a long-term duty to maintain it.
        - Ready-made tools stop being enough.
    note: Tools change their features and prices often. We confirm current limits and costs during planning.
  - type: columns
    id: teams
    tone: white
    label: Across the business
    heading: Where automation shows up in a business
    intro: The same ideas apply in every department. Here is what that looks like.
    columns:
      - title: Sales and customers
        items:
          - New inquiries are logged and assigned automatically.
          - Follow-up emails go out on schedule.
          - Quotes and contracts are created from a template.
      - title: Finance
        items:
          - Invoices are created and sent from approved work.
          - Payments are matched to records.
          - Month-end reports build themselves.
      - title: People and HR
        items:
          - New-starter tasks and accounts are created in one go.
          - Leave and expense requests go to the right approver.
          - Reminders for reviews and renewals.
      - title: Operations and support
        items:
          - Orders and tickets are routed to the right team.
          - Customers get status updates without asking.
          - Stock and delivery changes update every tool.
  - type: callout
    id: not-ai
    tone: paper
    variant: note
    title: Not every automation needs AI
    paragraphs:
      - Many workflows need clear rules, dependable connections, and good monitoring far more than they need AI. Rules are cheaper, faster, and easier to explain.
      - "We add [AI](ref:svc.ai) where a step really needs it: reading an unstructured email, summarizing a long document, or deciding which category a request belongs to. Even then, a person can review the result."
    items:
      - Use rules when the decision can be written as if-this-then-that.
      - Use AI when the input is messy text, images, or speech.
      - Use a person when the cost of a wrong answer is high.
  - type: process
    id: project
    tone: white
    label: How we do it
    heading: From idea to a running automation
    intro: We start with how work really flows, because automating a confusing process only makes the confusion faster.
    steps:
      - title: Map how the work flows
        body: We follow a real example from start to finish and note every step, handoff, and delay.
        artifacts:
          - Process map
          - List of pain points
      - title: Choose what to automate
        body: We pick the steps that are frequent, rule-based, and worth the effort, and leave the rest.
        artifacts:
          - Short list with expected time saved
          - Tool recommendation
      - title: Build and test
        body: We build the workflow and test it with real cases, including unusual ones.
        artifacts:
          - Working automation
          - Test results
      - title: Switch on with a safety net
        body: We go live with alerts, a record of every run, and a clear way to pause it.
        artifacts:
          - Live automation
          - Alerts and logs
          - Hand-over notes
      - title: Improve it
        body: We watch how it performs, fix rough edges, and extend it to the next process.
        artifacts:
          - Review of results
          - Next candidates
  - type: callout
    id: when-not
    tone: paper
    variant: limits
    title: When not to automate yet
    paragraphs:
      - Automation locks in a process. If the process is unclear or changes every week, automating it creates problems.
    items:
      - Nobody agrees how the work should be done.
      - The task happens rarely, so the effort will not pay back.
      - Every case is different and needs a person's judgment.
      - The tools involved are about to be replaced.
  - type: technical
    id: technology
    tone: white
    label: Technology
    heading: How automations are built
    intro: "What we settle early: triggers and connections, handling errors, keeping credentials and information safe, and where automations run, so nothing surprises your team later."
    panels:
      - title: Triggers and connections
        paragraphs:
          - Most automations start from a webhook (a message one system sends when something happens) or from a schedule. They then talk to other tools through an API (a way for programs to share information). When a tool offers no connection, we can use browser-based or file-based methods, or recommend a different approach.
      - title: Handling errors
        items:
          - Automatic retries with increasing waits.
          - A queue for work that cannot be processed right away.
          - Alerts to a named person when manual action is needed.
          - Each run logged, so any result can be traced.
      - title: Keeping credentials and information safe
        paragraphs:
          - Passwords and access keys are stored in a secure store, never inside the workflow itself. Each connection gets only the permissions it needs.
      - title: Where automations run
        paragraphs:
          - Some run in a vendor's cloud, such as Zapier or Make. Others run on infrastructure we set up for you, using tools like n8n. Larger systems may be custom software. We recommend what suits your volume, security needs, and budget.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about automation
    items:
      - q: What should we automate first?
        a: Start with a task that happens often, follows clear rules, and annoys people. Copying data between tools and chasing approvals are common first choices. We will help you rank your options by time saved and risk.
      - q: Will automation replace jobs?
        a: Our aim is to remove repetitive work so people can spend time on work that needs judgment and care. In practice, teams usually keep their roles and gain time for the work that matters.
      - q: What happens when an automation breaks?
        a: Well-built automations expect failures. They retry, keep a record, and alert a named person. We design the safety net as carefully as the workflow itself.
      - q: Do we have to change our tools?
        a: Usually not. Most automation works with the tools you already use. If a tool cannot connect, we will say so and suggest options.
      - q: How is this different from integration?
        a: Integration connects systems so information moves between them. Automation uses those connections to run a whole process, with rules and approvals. They often go together. See [integration](ref:svc.api-integration).
      - q: Can you use AI inside an automation?
        a: Yes, where it helps. For example, AI can read an incoming email and decide which team should handle it. We keep people in the loop for decisions that matter.
