title: "Accessibility Statement | DECHY"
description: "How the DECHY website aims to be usable by everyone: the standard we work to, what we check, known limits, and how to tell us about a barrier."
breadcrumbLabel: Accessibility
h1: Accessibility statement
lead: "How this website aims to be usable by everyone. Last updated 5 October 2026."
intent:
