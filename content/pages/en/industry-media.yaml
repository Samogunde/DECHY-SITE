  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about media and publishing platforms
    items:
      - q: How much does a publishing platform cost?
        a:
          A rebuilt publishing site usually costs $6,000 to $15,000. Adding subscriptions and a paywall
          usually costs $8,000 to $20,000.
      - q: Can you migrate our archive?
        a: Yes. We move articles, images, authors, and URLs, with redirects so search rankings carry over.
      - q: Will the site stay up when a story goes viral?
        a: Yes. Pages are cached at the edge and tested for high traffic before launch.
      - q: Can readers pay for podcasts or video?
        a: Yes. Members-only episodes and videos are unlocked by the same subscription as articles.
      - q: Do you build newsletters?
        a: Yes. Sign-ups, segments, and automated editions connect to your stories and subscriber accounts.
      - q: Can we keep WordPress?
        a:
          Often, yes. We can use WordPress as the editorial system with a faster front end in front of it.
          Readers manage their own subscription and newsletter preferences from one account.
  - type: index
    id: needs
    tone: paper
    columns: 2
    label: What we build
    heading: Media and publishing software we build
    intro: Each piece shares one reader account, so subscriptions, newsletters, and content work together.
    items:
      - title: Publishing website
        body: Fast article pages, section fronts, and search that rank well and stay up under spikes.
      - title: Headless editorial system
        body: Write once and publish to web, apps, and newsletters, with roles and scheduling.
      - title: Subscriptions and paywalls
        body: Metered or hard paywalls, plans, gifts, and offers tested against conversion.
      - title: Newsletters
        body: Sign-up, segments, and automated editions from your published stories.
      - title: Podcast and video hubs
        body: Players, episode pages, feeds, and members-only content.
      - title: Audience dashboards
        body: Which stories bring subscribers, and which readers are at risk of leaving.
  - type: technical
    id: technology
    tone: paper
    label: Technical depth
    heading: Technical notes for media platforms
    intro: What your product and engineering leads will ask about content systems, caching, and payments.
    panels:
      - title: Content and caching
        items:
          - We use headless content systems such as Sanity, Strapi, or WordPress with a modern front
            end.
          - Pages are cached at the network edge so traffic spikes do not slow the site.
      - title: Subscriptions and access
        items:
          - Subscriptions run through Stripe or your existing provider, with accounts shared across
            web and apps.
          - Paywall rules are configurable by section, story, and reader.
