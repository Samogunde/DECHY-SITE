comprehension:
  what: "We organize what your organization knows, such as policies, guides, and articles, so people and AI assistants can find the right answer quickly."
  problem: Knowledge is scattered across documents, chats, and people's heads, so answers are hard to find and are often out of date.
  audience: Teams that answer the same questions repeatedly, and organizations publishing a lot of content or guidance.
  choose: Organize around the questions people ask, name an owner for each topic, and set a review date for every page.
  next: List the questions your team or customers ask most. We will show how to organize the answers so they stay findable and current.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Work Area
    headline: Knowledge and Content Systems
    lead: "We build knowledge and content systems that keep what your organization knows organized, searchable, and current. Staff find the right answer quickly, and AI assistants can use the same source safely, with every answer traceable to its document."
    ctas:
      - label: Discuss your knowledge systems
        href: /contact/?service=software-development
      - label: See how it is organized
        href: "#structure"
    spec:
      kind: layers
      layerLabel: Layers of a knowledge system
      layers:
        - title: Questions people ask
          text: The starting point, in their own words.
        - title: Search and navigation
          text: Finding the answer fast.
        - title: Organized content
          text: Pages with one topic, one owner, one review date.
        - title: Sources
          text: Documents, policies, and expert knowledge.
    purpose: system
    takeaway: A knowledge system starts from the questions people ask, supported by search, organized pages, and trusted sources.
    visualTitle: The layers of a knowledge system
    figureCaption: This diagram shows four layers of a knowledge system, from the questions people ask at the top to the trusted sources at the base.
  - type: definition
    id: what-is
    tone: white
    label: In practice
    heading: Answers that stay findable and true
    answer: We organize the answers your organization needs so they can be found, are owned by named people, and are reviewed regularly so they stay correct.
    paragraphs:
      - Most organizations have the knowledge. They lack the structure. Answers sit in old emails and in files named final-v3, and the person who knows retires or moves on.
      - A good system also prepares your content for AI assistants. They answer better, and more safely, when drawing from clear, current, well-labeled pages than from a heap of documents.
  - type: diagram
    id: structure
    tone: paper
    label: How it is organized
    heading: How knowledge is organized
    intro: Each page has one job, one owner, and one review date.
    spec:
      kind: flow
      steps:
        - title: Collect
          text: Gather what exists, and find what is missing.
        - title: Organize
          text: Group by the questions people ask.
        - title: Write
          text: One topic per page, in plain words.
        - title: Publish
          text: With search, labels, and links.
        - title: Review
          text: Owners check each page on schedule.
    purpose: process
    takeaway: Knowledge is collected, organized by question, written one topic per page, published with search, and reviewed on a schedule.
    caption: This diagram shows five steps in building a knowledge system, from collecting what exists to reviewing each page on a schedule.
  - type: process
    id: process
    tone: white
    label: How we work
    heading: How a knowledge project runs
    steps:
      - title: Find the top questions
        body: We listen to support, sales, and staff to learn what people ask most.
        artifacts:
          - Question list
      - title: Design the structure
        body: We organize topics and agree who owns each.
        artifacts:
          - Structure
          - Owners
      - title: Build the system
        body: We set up the pages, search, and review reminders.
        artifacts:
          - Working system
          - Review schedule
      - title: Hand over and keep fresh
        body: We train owners and measure which answers are used and which are missing.
        artifacts:
          - Training
          - Usage reports
  - type: table
    id: ai
    tone: paper
    label: With AI
    heading: How AI assistants use a knowledge system
    caption: Ways AI assistants can use a knowledge system and what keeps them accurate
    columns:
      - Use
      - What happens
      - What keeps it accurate
    rows:
      - - Answering staff questions
        - The assistant finds relevant pages and summarizes them.
        - It shows its sources, and staff can check.
      - - Helping customers
        - The assistant answers common questions from public pages.
        - It is limited to approved content, and hands off when unsure.
      - - Drafting replies
        - It drafts from past answers for a person to review.
        - A person approves every reply.
  - type: callout
    id: scenario
    tone: white
    variant: illustrative
    title: One current page for every procedure
    paragraphs:
      - A typical case is a team whose procedures are spread across shared folders, with several versions of each. New staff ask colleagues, and answers differ.
      - A knowledge system could hold one current page per procedure, with an owner and a review date, and search that finds it. An assistant could answer questions from those pages and show where the answer came from.
  - type: technical
    id: technology
    tone: paper
    label: Technology
    heading: Under the hood
    intro: How content is prepared for search and AI.
    panels:
      - title: Structure
        paragraphs:
          - Content is stored in a content management system with consistent fields, so it can be shown on a site, searched, and supplied to other tools.
      - title: Search and AI
        items:
          - Full-text search tuned to the words people use.
          - "[Retrieval-augmented generation](ref:cap.retrieval-augmented-generation), which lets an AI assistant draw on your pages and cite them."
          - Permissions, so private content is never shown to the wrong person.
  - type: related
    id: related
    tone: white
    label: Related
    heading: Knowledge across DECHY
    groups:
      - title: The services behind this
        entityIds:
          - svc.software-development
          - svc.ai
      - title: Related solutions
        entityIds:
          - sol.ai-knowledge-systems
      - title: Related work areas
        entityIds:
          - workarea.ai-solutions
          - workarea.seo-search-visibility
          - workarea.business-web-platforms
  - type: cta
    id: contact-cta
    heading: Tell us the questions you answer most
    body: List the questions your team or customers ask most often. We will show how to organize the answers so they stay findable and current.
    primary:
      label: Discuss your knowledge systems
      href: /contact/?service=software-development
