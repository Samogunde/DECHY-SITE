  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about recruitment software
    items:
      - q: How much does an applicant tracking system cost?
        a:
          A custom applicant tracking system usually costs $16,000 to $36,000 and takes 5 to 8 weeks. A
          full platform with portals and AI costs more.
      - q: Can you connect to the job boards we use?
        a:
          Usually, yes. We post roles and import applications through job board interfaces where they offer
          them.
      - q: Will AI decide who gets hired?
        a: No. AI helps summarize and match, but recruiters and hiring managers make every decision.
      - q: Can clients see shortlists online?
        a: Yes. Clients get a portal for shortlists, feedback, and interview booking.
      - q: Can it handle temporary staff and timesheets?
        a: Yes. Workers submit hours, clients approve them, and pay and invoices are created automatically.
      - q: How do you protect candidate data?
        a:
          Access is role-based, data is encrypted, and retention rules delete records when they are no
          longer needed.
