title: "Privacy Policy | DECHY"
description: "How DECHY handles personal information from this website: forms, the newsletter, the assistant, analytics, cookies, service providers, and your rights."
breadcrumbLabel: Privacy policy
h1: Privacy policy
lead: "How this website handles personal information. Last updated 24 October 2026."
intent:
  primary: read the website privacy policy
indexing: index
claims: [company.name]
datePublished: "2026-10-04"
