comprehension:
  what: "We design and build apps for phones and tablets, from the first idea through the app stores
    and ongoing updates."
  problem:
    Teams are unsure which approach to choose, how long it takes, what the app stores require,
    and how to keep an app working as phones and systems change.
  audience: Businesses launching a first app, and teams whose current app is slow, outdated, or hard
    to maintain.
  choose:
    "Choose by audience and needs: a native app for the deepest phone features, a cross-platform
    app to cover both major phones at once, or a web app when an app store is not needed."
  next: Tell us who the app is for and what it must do. We will recommend an approach and a low-cost
    way to test the idea first.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Service
    headline: Mobile apps for iOS and Android, [[designed, built, and looked after by one team]]
    lead:
      We design, build, and launch mobile apps for iPhone and Android, then keep them fast and up to
      date. You get an app people keep on their home screen, connected to your website, customer
      records, and payments.
    ctas:
      - label: Discuss your app
        href: /contact/?service=mobile-app-development
      - label: Native or cross-platform?
        href: "#approach"
    visualTitle: What the app in someone's hand looks like
    figureCaption:
      This sketch shows a conceptual phone screen with a list of three jobs, a status label
      on each, one primary button, and a tab bar. It illustrates a type of interface we design and
      is not a client's app.
    figure: mobile-app-ui
    purpose: system
    takeaway: A good app screen shows what needs doing now, how urgent it is, and the one thing to do next.
  - type: prose
    id: problem
    tone: white
    label: The choice
    heading: Apps that earn a place on your customer's phone
    paragraphs:
      - People carry their phones everywhere, so an app can feel like the obvious answer. Sometimes
        it is. An app can send notifications, work without a connection, use the camera or location,
        and sit on the home screen.
      - But an app is also a product to look after. It must be updated whenever phones change,
        reviewed by the app stores, and supported on many devices. A well-built mobile website, or
        an installable web app, is sometimes enough.
      - We help you decide honestly. If an app is right, we help you start small, learn from real
        users, and grow from there.
  - type: chooser
    id: approach
    tone: paper
    label: Choosing an approach
    heading: Native, cross-platform, or web app?
    intro: There are three main ways to build for phones. They trade off depth, cost, and reach.
    question: What matters most for your app?
    options:
      - label: Native app
        when:
          You need the best speed and the deepest use of phone features, or you are building only for
          iPhone or only for Android.
        get:
          The smoothest feel and full access to the phone. Typically built with [Swift](ref:tech.swift)
          for iPhone and [Kotlin](ref:tech.kotlin) for Android.
        watch: Two apps to build and maintain if you need both phones, so it costs more.
        cta:
          label: Discuss a native app
          href: /contact/?service=mobile-app-development
      - label: Cross-platform app
        when: You want one app on both iPhone and Android, with a shared team and a shared plan.
        get:
          One build for both phones, quicker and cheaper to start. We use [Flutter](ref:tech.flutter) and
          [React Native](ref:tech.react-native).
        watch: A few very specialist features may need extra native work.
        cta:
          label: Plan a cross-platform app
          href: /contact/?service=mobile-app-development
      - label: Web app that installs
        when: You do not need the app stores, or want to test an idea quickly, and the features are modest.
        get: A website that can be added to the home screen, built once for every device.
        watch: Less access to phone features, and less presence in the app stores.
        cta:
          label: Explore a web app
          href: /contact/?service=mobile-app-development
  - type: diagram
    id: inside
    tone: white
    label: How it works
    heading: What is inside a mobile app
    intro: An app is more than the screens. Most of the useful work happens behind the scenes.
    spec:
      kind: layers
      layerLabel: Parts of an app
      supportLabel: What supports it
      layers:
        - title: The app on the phone
          text: Screens, buttons, and everything the person touches.
          support:
            - title: Notifications
              text: Messages that reach the phone's lock screen.
        - title: The system behind the app
          text: Accounts, rules, and the information the app shows.
          support:
            - title: Sign-in
              text: Safe login, including fingerprint or face.
        - title: Your other tools
          text: Payments, customer records, email, and maps.
          support:
            - title: Usage and crash reports
              text: Show what people use and what breaks.
    purpose: architecture
    takeaway: Most of an app lives behind the screens, in the system that stores information, signs
      people in, and talks to your other tools.
    caption: This diagram shows a mobile app as three layers, from the screens on the phone to the
      system behind it and your other tools, with what supports each.
    points:
      - title: Plan for both sides
        body: The phone app and the system behind it need to be designed together.
      - title: Keep information safe
        body: Sign-in and permissions protect what the app shows and stores.
      - title: Learn from use
        body: Reports on usage and crashes guide what to improve next.
  - type: index
    id: kinds
    tone: paper
    columns: 2
    label: What we build
    heading: Apps we build
    items:
      - title: Customer apps
        ref: cap.mobile-product-development
        body: Apps for ordering, booking, tracking, or loyalty that make doing business with you easy.
      - title: Staff and field apps
        ref: cap.ios-app-development
        body: "Apps that let teams work away from a desk: inspections, deliveries, and job updates."
      - title: A first version to test an idea
        ref: cap.mobile-mvp-development
        body:
          A small first version, often called an MVP (minimum viable product), to learn what people
          really use before you invest more.
      - title: Apps for Android
        ref: cap.android-app-development
        body: Apps designed for the range of Android phones and tablets.
      - title: Apps on both phones at once
        ref: cap.cross-platform-app-development
        body: One shared build that runs on iPhone and Android.
      - title: Rescue and modernization
        ref: cap.mobile-app-modernization
        body: Bringing an old, slow, or abandoned app up to date, or replacing it in stages.
  - type: columns
    id: after
    tone: white
    label: After launch
    heading: Keeping an app healthy
    intro:
      Launch day is the start. Phones and operating systems change every year, and an app that is not
      kept up to date eventually stops working well. We plan for updates from the start and agree who
      looks after the app once it is live.
    columns:
      - title: Keeping up with phones
        items:
          - Apple and Google release new phone software every year.
          - We test and update so your app keeps working.
      - title: Fixing and improving
        items:
          - Crash reports show what breaks.
          - Usage data shows what people actually do.
      - title: Store rules
        items:
          - Both stores have review rules that change.
          - We prepare each release so it passes.
      - title: Support
        items:
          - A clear way for people to report problems.
          - Agreed response times for urgent fixes.
  - type: process
    id: process
    tone: paper
    label: How a project runs
    heading: From first idea to the app stores and beyond
    intro:
      An app is never finished at launch. It moves from scope to design, build, test, and release,
      then keeps changing as phones and customers do.
    steps:
      - title: Find the first version
        body: We decide the few things the first release must do well, and what can wait.
        artifacts:
          - Scope of the first version
          - Success measures
      - title: Design
        body: We design screens and flows, and test them with real people on a clickable model.
        artifacts:
          - Clickable design
          - Feedback from test users
      - title: Build in steps
        body: We build in short rounds, so you can try working versions early.
        artifacts:
          - Working app each round
          - Connection to your systems
      - title: Test on real phones
        body: We test on a range of devices, including older ones, and check speed, safety, and
          accessibility.
        artifacts:
          - Device test results
          - Security checks
      - title: Release and learn
        body: We prepare the store listings, release, and watch how people use it.
        artifacts:
          - Store release
          - Usage and crash reports
      - title: Keep improving
        body: We ship fixes and new features, and keep the app working as phones and store rules change.
        artifacts:
          - Regular updates
          - Support with agreed response times
  - type: callout
    id: when-not
    tone: white
    variant: limits
    title: How we pick the right approach
    paragraphs:
      - We start from how often your customers will use it. An app wins when people return often or
        need the phone's camera, location, or notifications. For one-off use, a fast web app gives
        the same result for less.
      - We recommend the format that fits your customers and budget, then build it properly.
    items:
      - Your visitors will rarely come back.
      - A mobile website would do the same job.
      - You have no one to look after the app after launch.
  - type: technical
    id: technology
    tone: paper
    label: Technology
    heading: The technology behind our apps
    intro: "Our engineering choices on native and cross-platform apps and the systems behind them,
      written for the people who will own the app after launch."
    panels:
      - title: Native
        paragraphs:
          - "For iPhone: [Swift](ref:tech.swift) with [SwiftUI](ref:tech.swiftui). For Android:
            [Kotlin](ref:tech.kotlin) with [Jetpack Compose](ref:tech.jetpack-compose). Native gives
            the best access to each platform's features."
      - title: Cross-platform
        paragraphs:
          - "[Flutter](ref:tech.flutter) (written in [Dart](ref:lang.dart)) and [React
            Native](ref:tech.react-native) let one team build for both phones. We also use [Kotlin
            Multiplatform](ref:tech.kotlin-multiplatform) to share logic, and
            [Ionic](ref:tech.ionic) or [.NET MAUI](ref:tech.dotnet-maui) when they fit your team."
      - title: Behind the app
        items:
          - A secure back end, built with the tools in our software service, or a ready-made
            platform such as [Firebase](ref:plat.firebase).
          - Sign-in, notifications, and offline use designed from the start.
          - Automated tests and a release pipeline for each store.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about mobile apps
    items:
      - q: How much does an app cost?
        a: "Most business apps cost {{fact:price.summary-mobile-app}}, including accounts, notifications, and payments. A first version to test an idea can start from {{fact:price.summary-mobile-app-start}}, and marketplace or complex apps cost {{fact:price.mobile-app-development-marketplace-or-on-demand-app-from}} or more. Every quote is fixed in writing and covers design, testing on real devices, and app store release."
      - q: How long does it take?
        a:
          Most apps take 2 to 8 weeks. A first version usually reaches the app stores in 2 to 4 weeks, and
          larger apps in 6 to 8 weeks. App store review adds a few days, which we plan into the
          launch date.
      - q: Do we need separate apps for iPhone and Android?
        a:
          Not always. A cross-platform app can cover both with one build. We recommend native apps when you
          need the deepest phone features.
      - q: Who owns the app?
        a:
          Ownership and licensing are agreed in writing before work starts. We aim for you to hold the code
          and the store accounts, so you are never stuck.
      - q: Can you fix or update our existing app?
        a: Yes. We review what exists, find what is wrong, and either repair it or replace it in stages.
      - q: Will the app work with our other systems?
        a: Yes. We connect apps to your website, customer records, and payments. See our
          [integration](ref:svc.api-integration) service.
