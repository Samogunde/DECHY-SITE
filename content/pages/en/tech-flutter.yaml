          - title: Features arrive together
          - title: Designs stay consistent
      hubLabel: One codebase
    purpose: before-after
    takeaway: Flutter replaces two native apps with one codebase, so features arrive on both platforms together and the design stays consistent.
    visualTitle: Two native apps compared with one Flutter app
    figureCaption: This diagram contrasts separate iPhone and Android apps on different schedules with one Flutter app whose features arrive on both platforms together.
  - type: definition
    id: what
    tone: white
    label: What it means
    heading: One codebase, drawn by Flutter
    answer: Flutter is an open-source toolkit from Google for building apps from a single codebase, written in the Dart language. Instead of using each phone's built-in screen parts, Flutter draws its own, so the app looks and behaves the same on every device.
    paragraphs:
      - That is the main difference from other cross-platform options. You get a consistent, designed interface and fast development, at the cost of an app that does not automatically take on each platform's native look.
      - Flutter can reach the phone's own features, such as the camera and notifications, through ready-made packages or small pieces of native code.
  - type: columns
    id: dechy
    tone: paper
    label: What DECHY can do
    heading: Working with Flutter
    columns:
      - title: Build
        items:
          - Apps for iPhone and Android from one codebase.
          - A shared design system and component library.
      - title: Connect
        items:
          - Back ends, sign-in, and payments.
          - Push notifications and offline storage.
      - title: Release
        items:
          - App store listings and review handling.
          - Automated builds and testing.
      - title: Maintain
        items:
          - Updates for new phone and Flutter versions.
          - Crash reporting and improvements.
  - type: diagram
    id: app-screen
    tone: white
    label: What it looks like
    heading: One codebase, one screen design, two phones
    intro: Cross-platform work succeeds when one screen design serves both platforms.
    figure: mobile-app-ui
    purpose: system
    takeaway: A cross-platform app shares one screen design across iPhone and Android.
    caption: This sketch shows a conceptual phone screen with a job list, status labels, and a tab bar. It is an illustration and not a client's app.
    points: []
  - type: chooser
    id: choice
    tone: paper
    label: Where it fits
    heading: Flutter, React Native, or native?
    intro: These are the three routes we compare most often.
    question: What matters most for this app?
    options:
      - label: A designed, consistent interface on both platforms
        when: Brand and interface design are central, and you want them identical everywhere.
        get: Flutter, which draws everything itself and gives close control over every pixel.
        watch: The app will not automatically follow each platform's usual look, which some users notice.
        cta:
          label: Plan a Flutter app
          href: /contact/?service=mobile-app-development
      - label: A team that already knows web technologies
        when: Your developers work in JavaScript or TypeScript and [React](ref:fw.react).
        get: "[React Native](ref:tech.react-native), which reuses those skills and some code."
        watch: Its native feel depends on how each screen is built.
        cta:
          label: Compare with React Native
          href: /contact/?service=mobile-app-development
      - label: Deep use of the phone's features
        when: Heavy graphics, advanced camera work, or the newest platform features.
        get: Native code in [Swift](ref:tech.swift) and [Kotlin](ref:tech.kotlin), for full access and the best fit with each platform.
        watch: Two codebases and a larger budget.
        cta:
          label: Plan a native app
          href: /contact/?service=mobile-app-development
  - type: table
    id: options
    tone: white
    label: Alternatives
    heading: Flutter compared with the alternatives
    caption: Flutter compared with other ways of building a mobile app
    columns:
      - Option
      - Suits
      - Trade-off
    rows:
      - - Flutter
        - Designed, consistent apps for both platforms from one team.
        - A younger ecosystem, and a look that is Flutter's own.
      - - "[React Native](ref:tech.react-native)"
        - Teams with web skills, and apps that should feel native.
        - More dependence on native modules for some features.
      - - Native ([Swift](ref:tech.swift) and [Kotlin](ref:tech.kotlin))
        - Apps needing the deepest platform access and best fit.
        - Two codebases and two teams.
      - - Progressive web app
        - Simple tools used occasionally, with no store listing needed.
        - Limited access to phone features.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about Flutter
    items:
      - q: Is Flutter as good as a native app?
        a: For most business apps, users will not notice a difference. For apps needing the deepest platform features or the very best fit with each system, native may be better.
      - q: Can Flutter also build a website?
        a: It can, but we usually recommend building the website with web tools, since Flutter for the web suits some applications more than public sites.
      - q: Is it expensive to maintain?
        a: One codebase is cheaper than two, but any app needs updates for new phone releases and dependency changes. We plan for this from the start.
      - q: Can you take over an existing Flutter app?
        a: Yes. We review structure, dependencies, and tests first, then tell you what to improve.
  - type: technical
    id: technology
    tone: paper
    label: Technical depth
    heading: How we build with Flutter
    intro: "What we settle early on Flutter work: structure, platform features, and quality, so nothing surprises your team later."
    panels:
      - title: Structure
        paragraphs:
          - We separate interface, business logic, and data access, choose one state management approach and use it consistently, and keep widgets small and testable.
      - title: Platform features
        items:
          - Maintained packages for common features, and platform channels for native code where none exists.
          - Secure storage for tokens, and careful handling of permissions.
          - Offline-first design for field and travel use, with sync rules for conflicts.
      - title: Quality
        items:
          - Widget, unit, and integration tests, run in a pipeline on every change.
          - Testing on a range of real devices, since emulators miss differences.
