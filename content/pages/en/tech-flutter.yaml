  - type: hero
    id: hero
    variant: service
    eyebrow: Mobile toolkit
    headline: Flutter app development
    lead: Flutter lets one team build one app that runs on iPhone and Android, with an interface that looks the same on both. We use it for products where reaching both platforms quickly matters, and we use native code where an app needs it.
    ctas:
      - label: Discuss a Flutter app
