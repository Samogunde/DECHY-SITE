comprehension:
  what: Flutter is Google's toolkit for building apps for iPhone, Android, and the web from a single codebase, with its own drawing engine for a consistent look everywhere.
  problem: Building two separate native apps doubles the cost and keeps the two versions out of step.
  audience: Teams launching a mobile product on both major platforms, and owners of a small team who need to reach everyone without two builds.
  choose: Choose Flutter when you want one team and one codebase to ship to both platforms with a designed, consistent interface.
  next: Describe the app and who will use it. We will say whether Flutter is the right route, and what would still need native code.
