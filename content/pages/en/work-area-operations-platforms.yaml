          - workarea.custom-software-systems
  - type: cta
    id: contact-cta
    heading: Tell us how a job moves through your business
    body: Describe how a job or order moves from start to finish. We will show where information is lost and what a platform would join.
    primary:
      label: Discuss your operations platform
      href: /contact/?service=software-development
