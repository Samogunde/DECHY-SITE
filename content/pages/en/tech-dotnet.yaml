  - type: hero
    id: hero
    variant: service
    eyebrow: Platform
    headline: .NET development
    lead: .NET is the platform behind a great deal of business software, especially in organizations that run on Microsoft tools. We build new applications on it and bring older ones up to date.
    ctas:
      - label: Discuss a .NET system
        href: /contact/?service=software-development
      - label: Modernizing an old system
