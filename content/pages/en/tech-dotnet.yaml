      layerLabel: The .NET platform
      supportLabel: What sits beside it
    purpose: system
    takeaway: The .NET platform stacks a language, a runtime, shared libraries, and your applications, so a team builds on proven parts.
    visualTitle: What the .NET platform is made of
    figureCaption: This diagram shows the .NET platform as four layers, from the C# language at the base to the applications on top, with the supporting parts beside each.
  - type: prose
    id: what
    tone: white
    label: What it means
    heading: Microsoft's platform for business software
    paragraphs:
      - .NET started on Windows and for years was tied to it. Today it is open source and runs on Windows, Linux, and in containers, so it is a normal choice for cloud systems as well as for the Windows servers of the past.
      - The practical question is rarely whether .NET is good. It is whether a given system is in good shape, and whether the next change is cheaper on the platform you have or on a new one.
  - type: callout
    id: generations
    tone: white
    variant: note
    title: Two generations of .NET
    paragraphs:
      - Older systems were written for .NET Framework, which only runs on Windows and is now maintained rather than developed. Current work uses modern .NET, which runs on Windows, Linux, and in containers.
      - The distinction decides what a project involves. A system on the current platform is upgraded. A system on the older one is first moved across, in stages, and then upgraded.
    items:
      - Most older business systems are on .NET Framework
      - The platform fits closely with Microsoft sign-in, databases, and hosting
      - This is why .NET is common in finance, healthcare, and large organizations
  - type: table
    id: options
    tone: paper
    label: Options
    heading: How .NET compares
    caption: .NET compared with the common alternatives for business applications
    columns:
      - Option
      - Suits
      - Trade-off
    rows:
      - - .NET
        - Organizations on Microsoft tools, long-lived internal systems, and projects that need strong structure and tooling.
        - Best value when the surrounding estate is Microsoft too.
      - - "[Java](ref:lang.java)"
        - Large enterprise systems on a mixed or non-Microsoft estate.
        - Comparable strength; the choice often follows the skills you can hire.
      - - "[Node.js](ref:tech.nodejs)"
        - Connected, interactive products and teams that write JavaScript.
        - Less structure by default, so discipline matters on large codebases.
      - - "[Python](ref:lang.python)"
        - Data work and AI features behind an application.
        - Not the usual choice for the application core in a Microsoft estate.
  - type: process
    id: path
    tone: white
    label: Modernizing
    heading: Moving an older .NET system forward
    intro: A rewrite is rarely the right first step. We move in stages so the business keeps running.
    steps:
      - title: Inventory what exists
        body: We list the projects, the framework version, the servers, the database, and the people who understand each part.
        artifacts:
          - System inventory
          - Dependency report
      - title: Find the real risks
        body: Unsupported components, unpatched servers, and code nobody dares touch come first.
        artifacts:
          - Risk list
      - title: Choose the route
        body: Keep, upgrade in place, move piece by piece to modern .NET, or replace. We cost each in plain terms.
        artifacts:
          - Options with rough cost
      - title: Move one slice at a time
        body: The new and old parts run side by side while each slice is tested and switched over.
        artifacts:
          - Working slice
          - Switch-over plan
  - type: columns
    id: dechy
    tone: paper
    label: What DECHY can do
    heading: Working with .NET
    columns:
      - title: Build
        items:
          - New web applications, services, and internal tools.
          - Back ends for web and mobile products.
      - title: Modernize
        items:
          - Moving .NET Framework systems to current .NET.
          - Adding tests and breaking up code that is hard to change.
      - title: Connect
        items:
          - Links to your existing databases, identity, and business systems.
          - Services that expose your data safely to other tools.
      - title: Move to the cloud
        items:
          - Hosting on [Azure](ref:plat.azure) or another cloud.
          - Containers and automated deployment for repeatable releases.
  - type: technical
    id: technology
    tone: white
    label: Technical depth
    heading: How we build with .NET
    intro: How we approach .NET work.
    panels:
      - title: Versions and support
        paragraphs:
          - We build on a supported long-term release of modern .NET and plan upgrades before support ends. For older work we map which projects can move directly and which need their Windows-only parts replaced first.
      - title: Structure
        items:
          - C# code organized into small, testable parts, with business rules kept apart from screens and storage.
          - Data access through a mapping layer, with the database schema under version control.
          - Configuration and secrets outside the code.
      - title: Identity and security
        items:
          - Sign-in through your existing identity provider where one exists.
          - Role-based access, input validation, and dependency checks on every build.
      - title: Delivery
        paragraphs:
          - Services are packaged as [Docker](ref:tool.docker) containers or deployed to managed hosting through an automated pipeline, so each release is built and tested the same way.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about .NET
    items:
      - q: Is .NET still a good choice?
        a: Yes. It is actively developed, runs on more than Windows, and is widely used for business systems. For a Microsoft-based organization it is often the lowest-risk choice.
      - q: Do we have to rewrite our old .NET Framework application?
        a: Not necessarily. We assess what can be upgraded in place, what can move piece by piece, and what is cheaper to replace. A staged move is usually safer than a rewrite.
      - q: Can .NET run outside Windows?
        a: Yes. Modern .NET runs on Linux and in containers, which often lowers hosting cost compared with Windows servers.
      - q: What about C#?
        a: C# is the main language used on .NET. See [C#](ref:lang.c-sharp) for the language itself; this page covers the platform.
