comprehension:
  what: .NET is Microsoft's platform for building business software. Programs are usually written in C# and can run on Windows, Linux, and the cloud.
  problem: Many organizations depend on older .NET systems that are hard to change, tied to old servers, or understood by one person, and they need a safe way forward.
  audience: Organizations that run on Microsoft tools, and teams that maintain or extend a .NET application.
  choose: Choose .NET when your people, identity, and hosting are already Microsoft-based. Modernize an old .NET system in stages rather than rewriting it in one go.
  next: Tell us what the .NET system does and what worries you about it. We will review it and recommend whether to extend, modernize, or replace it.
