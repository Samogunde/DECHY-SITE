  - type: diagram
    id: connected-systems
    tone: ink
    label: AI, automation, and integration
    heading: Where AI and automation fit
    intro: "AI and automation are major parts of what we do, and they work best inside the system rather than beside it, connected to the software, data, and permissions around them. The diagram shows one illustrative pattern."
    figure: connected-flow
    purpose: workflow
    takeaway: "Each step hands its result to the next automatically, on a shared foundation, with people checking the decisions that matter."
    visualTitle: "One enquiry followed through six connected steps"
    caption: "This diagram follows one customer enquiry through six connected steps, with the shared foundation and the safety checks underneath. It is an illustration of a pattern we can design and build, not a specific delivered system."
    points:
      - title: Automation is not always AI
        body: "Many workflows need clear rules, reliable integrations, and monitoring more than a model. We add AI where judgment, language, or unstructured documents justify the extra care."
      - title: Integration is the foundation
        body: "Every step depends on stable APIs, clean data, and authentication. Getting that layer right keeps an automation or an AI feature running long after launch."
      - title: People stay in the loop
        body: "Where decisions matter, we design in review, approvals, and audit logs, so the system is explainable and your team stays in control."

