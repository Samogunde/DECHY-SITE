  - type: faq
    id: questions
    tone: paper
    label: Common questions
    heading: What people ask before they start
    items:
      - q: How much does a website, app, or software project cost?
        a: It depends on scope, the number of features and integrations, and support after launch. We confirm a written price range after a short first conversation, before any commitment, so you can plan.
      - q: How long does a project take?
        a: A focused website usually takes a few weeks. A web app, mobile app, or custom system usually takes a few months, delivered in stages so you see working software early. We agree the timeline with the scope.
      - q: Who owns the code and the designs?
        a: That is agreed in writing before work starts. We aim for you to own your code and data and to receive the documentation needed to maintain them.
      - q: Can you work with the systems we already have?
        a: "Yes. A large share of useful work is improving what already exists: connecting tools, automating manual steps, modernizing old software, and fixing performance."
      - q: Do you work with clients in other countries and time zones?
        a: Yes. We are a global company and work with clients remotely, across time zones, with shared tools and written decisions.
      - q: What happens after launch?
        a: We can look after what we built, fix problems, and help it improve. Support is agreed in advance, so you know who to ask and how quickly we respond.
      - q: How do we start?
        a: Tell us what you want to build, connect, or fix through the [contact page](/contact/). You do not need a finished brief, a budget, or technical vocabulary.

