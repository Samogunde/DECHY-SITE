        title: AI and machine learning
        body: Assistants that answer from your own documents, document processing, and AI agents, with people checking the decisions that matter.
        href: /ai/
      - icon: workflow
        title: Automation and workflows
        body: Approvals, data entry, reports, and follow-up that run on their own, with a record of what happened.
        href: /automation/
      - icon: plug
        title: API and systems integration
        body: Your website, customer records, payments, and internal tools sharing information instead of being copied by hand.
        href: /api-integration/
      - icon: cloud
        title: Cloud and DevOps
        body: Hosting, release pipelines, monitoring, and backups, so updates reach users safely and the system stays up.
