  - type: index
    id: work
    tone: white
    label: Selected work and capability
    heading: The kinds of systems DECHY builds and connects
    intro: "Work at DECHY ranges from focused tools to platforms that span several systems. These are the main kinds of system, each a practice area in its own right."
    items:
      - title: Custom business applications and portals
        body: "Internal tools, customer and employee portals, and management systems built around a specific process."
      - title: SaaS platforms and marketplaces
        body: "Multi-tenant products with billing, permissions, and operations designed for growth."
      - title: Websites, web applications, and online stores
        body: "Fast, accessible, search-ready sites and commerce platforms, with the integrations behind them."
      - title: Mobile applications
        body: "iOS, Android, and cross-platform apps with secure APIs, notifications, and release routines."
      - title: AI assistants, retrieval systems, and agents
        body: "Applications that answer from your knowledge, act inside your tools, and are evaluated before and after launch."
      - title: Workflow and business process automation
        body: "CRM, sales, finance, support, and operations workflows on platforms such as Airtable, Zapier, Make, and n8n."
      - title: API and systems integration
        body: "Reliable data flow between CRM, ERP, payments, commerce, and legacy systems."
      - title: Cloud, DevOps, and security programs
        body: "Migration, delivery pipelines, observability, identity, and assessments."
      - title: Data platforms and dashboards
        body: "Pipelines, warehouses, and reporting that replace manual spreadsheets."
      - title: Design systems, brand, and growth programs
        body: "Product design, brand identity, SEO, and marketing systems connected to measurement."

  - type: columns
    id: why
    tone: paper
    label: Why DECHY
    heading: How DECHY approaches the work
    intro: "These are working principles, not slogans. They explain how engagements are planned and what to expect from them."
    columns:
      - title: Systems thinking
        items:
          - "Every engagement considers the surrounding systems, data, and people, not only the deliverable."
          - "Disciplines are planned together, so authentication, data, and infrastructure are decided once."
      - title: Honest recommendations
        items:
          - "Build, buy, or integrate is decided on the merits, including advising against a build."
          - "AI and automation are proposed where they help and left out where they do not."
      - title: Engineering discipline
        items:
          - "Testing, security, and performance are part of delivery, not extras."
          - "Decisions and architecture are documented so the system can outlive the project."
      - title: Clear communication
        items:
          - "Plain language, visible progress, and no jargon for its own sake."
          - "Remote-first collaboration across time zones, with shared tools and written decisions."

  - type: faq
    id: questions
    tone: white
    label: Common questions
    heading: Short answers about DECHY
    items:
      - q: What does DECHY do?
        a: "DECHY is a global technology company covering software, web, and mobile development; AI and machine learning; automation and workflows; cloud and DevOps; cybersecurity; data and analytics; API and systems integration; ecommerce; UI/UX and product design; branding; SEO, AEO, and GEO; digital marketing; and technology consulting. Projects often combine several of these."
      - q: Is DECHY a web agency, an AI agency, or a software company?
        a: "None of those alone. Web, AI, and automation are major parts of the work, but DECHY is a broader technology company. What sets the approach apart is designing software, AI, automation, integration, and cloud as one system rather than as separate projects."
      - q: Who does DECHY work with?
        a: "Startups, small and medium-sized businesses, enterprises, agencies, organizations, professionals, and teams, across a wide range of industries and business types."
      - q: Does DECHY work internationally?
        a: "Yes. DECHY is a global company and works with clients remotely, across time zones and markets, with engagements planned around clear communication, documentation, and shared tooling."
      - q: How does an engagement start?
        a: "With a conversation about the outcome you want and the systems you already have. From there DECHY recommends an approach, which may be to build, to buy and configure, or to integrate what exists, and agrees a scope before work begins. You can start through the [contact page](/contact/)."
      - q: Does DECHY only build new systems?
        a: "No. A large share of useful work is improving what already exists: modernizing legacy software, integrating tools, automating manual steps, tightening security, and fixing performance."

