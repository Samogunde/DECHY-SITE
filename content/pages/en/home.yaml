  - type: index
    id: problems
    tone: white
    numbered: true
    label: Problems we solve
    columns: 2
    photo:
      asset: asset.photo-consulting-process-mapping-review
      layout: split
      position: 50% 52%
    heading: What usually brings people to us
    intro: Projects usually begin with a problem, not a technology. These are the ones we see most.
    items:
      - title: An idea that needs to become a product
        body: A web app, mobile app, or platform that has to work for real users, not only in a demo. We shape the first version and build it to grow.
      - title: Manual work that should not be manual
        body: Re-keying data, chasing approvals by email, assembling reports by hand. We automate the repetition and keep a record of what happened.
      - title: Disconnected systems
        body: A CRM (where you keep track of customers), accounting, ecommerce, and support tools that each hold part of the truth. We connect them so data flows once.
      - title: Outdated software
        body: Systems that are slow to change or no longer supported. We replace or wrap them in stages, so the business keeps running.
      - title: A website that does not bring in work
        body: Slow pages, unclear messages, and forms that lose people. We fix what visitors feel and what search engines read.
      - title: AI that never reaches daily use
        body: Pilots with no route into the work. We connect assistants to your data and permissions, with human review built in.

  - type: promise
    id: promise
    tone: ink
    label: Our promise
    heading: We will tell you what not to build.
    body: Before any commitment, we recommend the smallest first step that proves the idea, and we say plainly when something should be bought, connected, or left alone.
    items:
      - title: Advice before commitment
        body: A short discovery or a review of what you have, and a recommendation you can take anywhere.
      - title: Scope, timeline, and price range agreed
        body: You know what you are getting and roughly what it costs before work starts.
      - title: No surprises
        body: Changes to scope are discussed and agreed before work continues, and bad news is reported when it is known.

  - type: pricing
    id: pricing
    draft: true
    tone: paper
    label: Pricing
    heading: What projects typically cost
    intro: Every project is quoted in writing after a short discovery. These ranges show where most projects land, so you can plan before you talk to us.
    plans:
      - name: Website
        range: "$3,000 to $15,000"
        timeline: 2 to 6 weeks
        summary: A business website or landing pages your team can edit.
        includes:
          - Design and content structure
          - Responsive build and editing tools
          - Speed, accessibility, and search setup
      - name: Web application
        range: "$15,000 to $60,000"
        timeline: 6 to 14 weeks
        summary: A web app with accounts, dashboards, and the logic behind them.
        featured: true
        includes:
          - Product design and prototypes
          - Front end, back end, and database
          - Integrations, testing, and hosting
      - name: Mobile app
        range: "$20,000 to $80,000"
        timeline: 8 to 16 weeks
        summary: An iPhone and Android app with its back end.
        includes:
          - App design and prototypes
          - Cross-platform or native build
          - App store release and back end
      - name: Custom software
        range: "$25,000 to $120,000+"
        timeline: 3 to 6 months
        summary: A system built around how your organization works.
        includes:
          - Discovery and architecture
          - Build in stages with regular releases
          - Data migration and team training
    factors:
      title: What moves the price
      items:
        - The number of screens, features, and user roles
        - Integrations with other systems and data migration
        - Design depth and content
        - AI features and automation
        - Security, compliance, and hosting needs
        - Support after launch
    note: Not sure which fits? Tell us what you need and we will send a range for your project after a short call.
    cta:
      label: Get a project estimate
      href: /contact/

