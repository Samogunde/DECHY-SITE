  - type: prose
    id: connected
    tone: paper
    label: The idea behind DECHY
    heading: Technology works better when it is designed together
    paragraphs:
      - "Most organizations do not have a technology problem in one place. They have a website that does not talk to the CRM, a spreadsheet that feeds three reports, an automation nobody monitors, and an AI pilot with no route into daily work. Each tool was a reasonable purchase. Together they are a system nobody designed."
      - "DECHY works across the full range of technology disciplines, from software and web development to AI, automation, integration, cloud, security, data, design, and search visibility. That breadth matters for one practical reason: the hardest problems sit between disciplines. A good workflow automation depends on clean data and reliable APIs. A good AI feature depends on the application around it, the permissions behind it, and the infrastructure under it."
      - "So engagements start from the outcome and the workflow, not from a product category. Sometimes the right answer is a custom application. Sometimes it is connecting tools the organization already owns. Sometimes it is recommending that something should not be built at all."
      - "That is the idea behind the line at the top of this page: software, AI, automation, integration, and cloud, designed to work as one system, inside a wider practice that also covers design, security, data, growth, and strategy."

  - type: index
    id: who
    tone: white
    label: Who DECHY helps
    heading: Teams of every size, in every industry
    intro: "DECHY is a global company and works with clients remotely, across time zones and markets."
    items:
      - title: Startups
        ref: bt.startups
        body: "From a first product to the platform behind a growing company: architecture that survives the first hundred customers, and an honest view of what to build now and what to defer."
      - title: Small and medium-sized businesses
        ref: bt.smes
        body: "Practical systems that replace spreadsheets and manual handoffs: portals, automations, integrations, and websites that fit the way the business already works."
      - title: Enterprises
        ref: bt.enterprises
        body: "Integration across existing systems, modernization of aging software, cloud migration, security reviews, and AI introduced with governance rather than around it."
      - title: Agencies
        ref: bt.agencies
        body: "A technical partner for web, software, automation, or integration work that sits beyond what an agency delivers in house."
      - title: Professionals and teams
        body: "Independent professionals, practices, and internal teams that need a dependable site, a better booking or client workflow, or a tool built around their process."
      - title: Organizations in every sector
        body: "Nonprofits, public bodies, and organizations in regulated industries, where privacy, accessibility, and auditability shape the design from the start."

  - type: index
    id: problems
    tone: paper
    numbered: true
    label: Problems DECHY solves
    heading: The situations that bring people to us
    intro: "Projects usually begin with a problem, not a technology. These are the most common ones."
    items:
      - title: Manual work that should not be manual
        body: "Re-keying data between systems, chasing approvals by email, assembling reports by hand. Automation and integration remove the repetition and keep a record of what happened."
      - title: Disconnected systems
        body: "A CRM, accounting, ecommerce, support, and internal tools that each hold part of the truth. Integration gives them one shared flow of data instead of exports and copy-paste."
      - title: Outdated software
        body: "Systems that are slow to change, hard to hire for, or no longer supported. Modernization replaces or wraps them in stages, so the business keeps running."
      - title: Poor customer experiences
        body: "Clumsy portals, slow sites, and forms that lose people. Better product design, performance, and accessibility fix what visitors actually feel."
      - title: Fragmented data
        body: "Numbers that differ from report to report. Clean pipelines, a shared data model, and dashboards people trust."
      - title: Inefficient workflows
        body: "Processes that depend on one person's memory. Map the workflow first, then automate the parts that deserve it."
      - title: AI that never reaches daily use
        body: "Pilots with no route into the work. Retrieval, assistants, and agents connected to your data and permissions, with evaluation and human review built in."
      - title: Integration challenges
        body: "Undocumented APIs, payment flows that fail quietly, legacy systems with no interface. Integration engineering with monitoring and error handling."
      - title: Growth and search visibility
        body: "A good business that people cannot find, in search or in AI answers. Technical SEO, structured content, and measurement."

