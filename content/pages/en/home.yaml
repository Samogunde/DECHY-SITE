  - type: prose
    id: connected
    tone: paper
    label: How we think
    heading: Technology works better when it is designed together
    paragraphs:
      - "Most organizations do not have a technology problem in one place. They have a website that does not talk to the CRM (the system where you keep track of customers and sales). They have a spreadsheet that feeds three reports, an automation nobody monitors, and an AI pilot with no route into daily work. Each tool was a reasonable purchase. Together they are a system nobody designed."
      - "At DECHY, we work across the full range of technology: software and web development, AI, automation, integration, cloud, security, data, design, and search visibility. The breadth matters for a practical reason. The hardest problems sit between disciplines. A good automation depends on clean data and reliable APIs (the connections that let software share information). A good AI feature depends on the application around it, the permissions behind it, and the infrastructure under it."
      - "So we start from the outcome and the workflow, not from a product category. Sometimes the right answer is a custom application. Sometimes it is connecting the tools you already own. Sometimes it is telling you that something should not be built at all."
      - "That is what the line at the top of this page means: software, AI, automation, integration, and cloud, designed to work as one system, inside a wider practice that also covers design, security, data, growth, and strategy."

  - type: index
    id: who
    tone: white
    label: Who we help
    photo: { asset: asset.photo-who-port-operations, layout: rail, position: "38% 50%" }
    heading: Teams of every size, in every industry
    intro: "We are a global company and work with clients remotely, across time zones and markets."
    items:
      - title: Startups
        ref: bt.startups
        body: "From a first product to the platform behind a growing company. We design architecture that survives the first hundred customers and give you an honest view of what to build now and what to defer."
      - title: Small and medium-sized businesses
        ref: bt.smes
        body: "Practical systems that replace spreadsheets and manual handoffs: portals, automations, integrations, and websites that fit the way your business already works."
      - title: Enterprises
        ref: bt.enterprises
        body: "Integration across existing systems, modernization of aging software, cloud migration, security reviews, and AI introduced with governance rather than around it. We work alongside your internal teams."
      - title: Agencies
        ref: bt.agencies
        body: "A technical partner for web, software, automation, or integration work that sits beyond what your agency delivers in house."
      - title: Professionals and teams
        body: "Independent professionals, practices, and internal teams that need a dependable site, a better booking or client workflow, or a tool built around their process."
      - title: Organizations in every sector
        body: "Nonprofits, public bodies, and organizations in regulated industries, where privacy, accessibility, and auditability shape the design from the start."

  - type: index
    id: problems
    tone: paper
    numbered: true
    label: Problems we solve
    columns: 2
    photo: { asset: asset.photo-problems-warehouse-aisle, layout: band, position: "50% 52%" }
    heading: What usually brings people to us
    intro: "Projects usually begin with a problem, not a technology. These are the ones we see most."
    items:
      - title: Manual work that should not be manual
        body: "Re-keying data between systems, chasing approvals by email, assembling reports by hand. We automate the repetition and keep a record of what happened."
      - title: Disconnected systems
        body: "A CRM, accounting, ecommerce, support, and internal tools that each hold part of the truth. We connect them so data flows once instead of through exports and copy-paste."
      - title: Outdated software
        body: "Systems that are slow to change, hard to hire for, or no longer supported. We replace or wrap them in stages, so the business keeps running."
      - title: Poor customer experiences
        body: "Clumsy portals, slow sites, and forms that lose people. We fix what visitors actually feel: design, performance, and accessibility."
      - title: Fragmented data
        body: "Numbers that differ from report to report. We build clean pipelines, a shared data model, and dashboards people trust."
      - title: Inefficient workflows
        body: "Processes that depend on one person's memory. We map the workflow first, then automate the parts that deserve it."
      - title: AI that never reaches daily use
        body: "Pilots with no route into the work. We connect assistants and agents to your data and permissions, with evaluation and human review built in."
      - title: Integration challenges
        body: "Undocumented APIs, payment flows that fail quietly, legacy systems with no interface. We build integrations with monitoring and error handling."
      - title: Growth and search visibility
        body: "A good business that people cannot find, in search or in AI answers. We work on technical SEO (making a site easy for search engines to read), clear content, and measurement."

