  - type: lead-services
    id: services
    tone: paper
    label: What we build
    heading: Software, websites, and apps, designed and built end to end
    intro: Most projects start with one of these three. Each is a full practice, from first idea and design to launch, hosting, and support.
    items:
      - title: Custom software
        kicker: Software development
        body: Business software built around the way you actually work, so your team stops fighting spreadsheets and disconnected tools.
        href: /software-development/
        action: Explore custom software
        figure: portal-wireframe
        includes:
          - Internal tools and admin systems
          - Customer and staff portals
          - Subscription software (SaaS) products
          - Connections to the tools you already use
      - title: Websites and web apps
        kicker: Web development
        body: Fast, accessible websites that win customers, and web applications your customers or staff log in to every day.
        href: /web-development/
        action: Explore web development
        figure: site-builder
        includes:
          - Business websites and landing pages
          - Web apps with accounts and dashboards
          - Content your team can edit
          - Built to load fast and be found in search
      - title: Mobile apps
        kicker: Mobile app development
        body: iPhone and Android apps for customers, staff, and field teams, from first prototype to the app stores and every update after.
        href: /mobile-app-development/
        action: Explore mobile apps
        figure: mobile-app-ui
        includes:
          - iPhone and Android apps
          - One shared codebase or fully native
          - App store release and updates
          - Secure back end and notifications

