  - type: index
    id: work
    tone: white
    label: What we build
    photo: { asset: asset.photo-work-app-dashboard, layout: split, position: "50% 50%" }
    heading: The kinds of systems we build and connect
    intro: "Our work ranges from focused tools to platforms that span several systems. These are the main kinds of system, each a practice area in its own right."
    items:
      - title: Custom business applications and portals
        body: "Internal tools, customer and employee portals, and management systems built around a specific process."
      - title: SaaS platforms and marketplaces
        body: "Multi-tenant products with billing, permissions, and operations designed for growth."
      - title: Websites, web applications, and online stores
        body: "Fast, accessible, search-ready sites and commerce platforms, with the integrations behind them."
      - title: Mobile applications
        body: "iOS, Android, and cross-platform apps with secure APIs, notifications, and release routines."
      - title: AI assistants, retrieval systems, and agents
        body: "Applications that answer from your knowledge, act inside your tools, and are evaluated before and after launch."
      - title: Workflow and business process automation
        body: "CRM, sales, finance, support, and operations workflows on platforms such as Airtable, Zapier, Make, and n8n."
      - title: API and systems integration
        body: "Reliable data flow between your customer system, your accounting and operations software (ERP), payments, online shop, and older systems."
      - title: Cloud, DevOps, and security programs
        body: "Migration, delivery pipelines, observability, identity, and assessments."
      - title: Data platforms and dashboards
        body: "Pipelines, warehouses, and reporting that replace manual spreadsheets."
      - title: Design systems, brand, and growth programs
        body: "Product design, brand identity, SEO, and marketing systems connected to measurement."

  - type: columns
    id: why
    tone: paper
    label: How we work
    heading: How we approach the work
    intro: "These are working principles, not slogans. They describe how we plan engagements and what you can expect from us."
    columns:
      - title: Systems thinking
        items:
          - "We consider the surrounding systems, data, and people, not only the deliverable."
          - "We plan disciplines together, so authentication, data, and infrastructure are decided once."
      - title: Honest recommendations
        items:
          - "We decide build, buy, or integrate on the merits, including advising against a build."
          - "We propose AI and automation where they help and leave them out where they do not."
      - title: Engineering discipline
        items:
          - "Testing, security, and performance are part of delivery, not extras."
          - "We document decisions and architecture so the system can outlive the project."
      - title: Clear communication
        items:
          - "Plain language, visible progress, and no jargon for its own sake."
          - "We work remotely across time zones, with shared tools and written decisions."

  - type: faq
    id: questions
    tone: white
    label: Common questions
    heading: Short answers about DECHY
    items:
      - q: What does DECHY do?
        a: "DECHY is a global technology company. We build software, websites, and mobile apps. We add AI, automate repetitive work, and connect systems so they share information. We also handle cloud hosting, security, and data. On the design and growth side, we work on product design, branding, search visibility, and digital marketing. We also advise on technology decisions. Many projects combine several of these."
      - q: Is DECHY a web agency, an AI agency, or a software company?
        a: "None of those alone. Web, AI, and automation are major parts of our work, but DECHY is a broader technology company. What sets our approach apart is designing software, AI, automation, integration, and cloud as one system rather than as separate projects."
      - q: Who does DECHY work with?
        a: "Startups, small and medium-sized businesses, enterprises, agencies, organizations, professionals, and teams, across a wide range of industries and business types."
      - q: Does DECHY work internationally?
        a: "Yes. We are a global company and work with clients remotely, across time zones and markets, with engagements planned around clear communication, documentation, and shared tooling."
      - q: How does an engagement start?
        a: "With a conversation about the outcome you want and the systems you already have. From there we recommend an approach, which may be to build, to buy and configure, or to integrate what exists, and we agree a scope before work begins. You can start through the [contact page](/contact/)."
      - q: Does DECHY only build new systems?
        a: "No. A large share of useful work is improving what already exists: modernizing legacy software, integrating tools, automating manual steps, tightening security, and fixing performance."

