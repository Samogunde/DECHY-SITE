  - type: diagram
    id: connected-systems
    tone: ink
    label: AI, automation, and integration
    heading: Where AI and automation fit
    intro: "AI and automation are major capabilities, and they work best inside the system rather than beside it, connected to the software, data, and permissions around them. The diagram shows one illustrative pattern."
    figure: connected-flow
    caption: "Illustrative architecture for lead handling. It describes a pattern DECHY can design and build, not a specific delivered system."
    points:
      - title: Automation is not always AI
        body: "Many workflows need clear rules, reliable integrations, and monitoring more than a model. AI is added where judgment, language, or unstructured documents justify the extra care."
      - title: Integration is the foundation
        body: "Every step depends on stable APIs, clean data, and authentication. Getting that layer right keeps an automation or an AI feature running long after launch."
      - title: People stay in the loop
        body: "Where decisions matter, the design includes review, approvals, and audit logs, so the system is explainable and the team stays in control."

