comprehension:
  what: PayPal integration connects your store or application to PayPal, so customers can pay with a PayPal account or card, and payments, refunds, and disputes flow back into your own records.
  problem: Many customers expect a PayPal option, but a rushed set-up loses orders, mismatches payments with accounts, and leaves refunds and disputes to be handled by hand.
  audience: Online stores, subscription businesses, marketplaces, and service providers that sell to consumers or small businesses.
  choose: Offer PayPal alongside card payments when your customers expect it, and connect it so payments, refunds, and disputes reconcile automatically. Choose a single provider only when your audience allows.
  next: Tell us what you sell and how orders are recorded. We will outline the integration and how payments will reach your accounts.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Payment integration
    headline: PayPal integration
    lead: PayPal is a payment option many customers trust, and offering it can mean fewer abandoned checkouts among customers who prefer it. We integrate PayPal into stores and applications, so that every payment, refund, and dispute is recorded where your team looks.
    ctas:
      - label: Discuss your PayPal project
        href: /contact/?service=api-integration
      - label: How a payment flows
        href: "#what"
    spec:
      kind: flow
      steps:
        - title: Customer chooses PayPal
          text: At checkout, a PayPal button starts the payment.
        - title: PayPal approves
          text: The customer signs in and approves the amount.
        - title: Your system confirms
          text: The store checks the approval and captures the payment.
        - title: Order is recorded
          text: The order, payment, and customer are saved together.
        - title: Accounts reconcile
          text: Payments, fees, and refunds match the accounting records.
    purpose: workflow
    takeaway: A PayPal payment passes from the customer's approval to your system's confirmation, the order record, and finally the accounts.
    visualTitle: A PayPal payment from click to ledger
    figureCaption: This diagram follows a PayPal payment in five steps, from the customer choosing PayPal and approving the amount to the order record and the reconciliation with the accounts.
  - type: prose
    id: what
    tone: white
    label: What it means
    heading: Taking the payment is the easy half
    paragraphs:
      - Adding a PayPal button takes an afternoon. Running PayPal well takes more. A payment can be approved but not captured, captured but not matched to an order, refunded in part, or disputed weeks later. Each case should leave a clear mark in your records without anyone re-typing it.
      - "The integration is therefore mostly about the unglamorous parts: confirming each payment before an order is released, handling the customer who closes the window midway, recording fees, and keeping refunds and disputes visible to the people who handle them."
      - Done properly, finance trusts the numbers, support can see what happened to an order, and customers are never charged without receiving what they paid for.
  - type: table
    id: options
    tone: paper
    label: Options
    heading: Ways to offer PayPal
    caption: Common ways to offer PayPal, what each suits, and what to watch for
    columns:
      - Approach
      - Suits
      - Watch for
    rows:
      - - A ready-made plugin or app
        - Standard stores on platforms such as [Shopify](ref:plat.shopify) or [WooCommerce](ref:plat.woocommerce).
        - Check how it records fees, refunds, and disputes.
      - - A direct integration
        - Custom applications, marketplaces, and unusual order flows.
        - More to build, with full control of the flow and the records.
      - - PayPal beside card payments
        - Most consumer stores, where customers pick their preferred method.
        - Two providers mean two sets of reports to reconcile.
      - - Recurring and payout use
        - Subscriptions, and paying sellers or contractors.
        - Rules and limits differ by country, so check each market.
  - type: columns
    id: dechy
    tone: white
    label: What DECHY can do
    heading: Working with PayPal
    columns:
      - title: Integrate
        items:
          - PayPal checkout in stores and applications.
          - Recurring billing and payouts where they apply.
      - title: Record
        items:
          - Orders, payments, fees, and refunds in your system.
          - Dispute alerts routed to the right person.
      - title: Reconcile
        items:
          - Matching payments to accounting records.
          - Reports that show what was paid and what was kept as fees.
      - title: Combine
        items:
          - PayPal alongside [Stripe](ref:int.stripe) or other providers.
          - A single view of payments across methods.
  - type: callout
    id: wrong
    tone: paper
    variant: note
    title: Where PayPal integrations usually go wrong
    paragraphs:
      - Most faults appear after launch, in cases that were not tested. These are the ones we design for first.
    items:
      - A customer approves the payment but closes the window before the order is saved
      - A webhook is missed, so a paid order stays marked as unpaid
      - A partial refund is made in PayPal but never reaches the accounts
      - A dispute arrives weeks later and nobody sees it
      - Test and live settings get mixed up between environments
  - type: technical
    id: technology
    tone: paper
    label: Technical depth
    heading: How we build with PayPal
    intro: How we build payment integrations.
    panels:
      - title: Order and capture
        items:
          - The order is created on the server, the customer approves it, and the server captures it only after checking the amount and currency.
          - Each request carries an idempotency key, so a retry cannot charge twice.
      - title: Notifications
        items:
          - Webhooks, which are automatic messages PayPal sends about payment events, are verified and queued, so a missed message cannot leave an order unpaid.
          - Refunds and disputes arrive as events and update the order, the customer record, and the accounts.
          - Declined cards, abandoned checkouts, and refunds that arrive days later are tested on purpose, not left to chance.
      - title: Security
        paragraphs:
          - Card and account details never touch your servers, since PayPal hosts the sensitive parts. Keys are stored as secrets, and test and live environments are kept apart.
      - title: Testing
        paragraphs:
          - "We test the full range of cases in the sandbox: approval, cancellation, failure, partial refund, and dispute, before live traffic. See our wider [integration](ref:svc.api-integration) work."
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about PayPal integration
    items:
      - q: Should we offer PayPal as well as cards?
        a: If your customers use it, yes. Many shoppers choose PayPal for convenience or protection, and offering it can avoid lost orders. Check your audience and fees.
      - q: How are refunds and disputes handled?
        a: Both arrive as events and update the order record and the accounts. A dispute also alerts the person who handles it, with the order and customer details attached.
      - q: Can PayPal handle subscriptions?
        a: Yes, for many cases. Rules differ by country and by product, so we check your model first.
      - q: What about the fees?
        a: PayPal charges fees on payments, which differ by market. We record them against each payment, so margins are clear and reconciliation is exact.
