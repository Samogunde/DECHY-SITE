  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about AI projects
    items:
      - q: Do we need a lot of data to use AI?
        a:
          Not always. Assistants that answer from your documents need good documents, not huge amounts of
          data. Prediction models do need enough past records to learn from. We check this in the
          first step, before anyone builds anything.
      - q: Is our information safe if we use AI?
        a:
          It can be, if the system is designed for it. We decide what the AI may see, where information is
          processed, who may use it, and what is recorded. For sensitive information we choose
          providers and settings that fit your rules, and we say clearly when a use is not
          appropriate.
      - q: Will AI replace our staff?
        a: Our approach is to take over repetitive work and support people, with a person reviewing
          decisions that matter. The goal is to give your team time for work that needs judgment.
      - q: Can AI make mistakes?
        a:
          Yes. AI can be wrong or sound confident when it is not. That is why we test on real examples,
          show sources, keep people in the loop, and monitor quality after launch.
      - q: How long does an AI project take?
        a:
          A focused AI assistant or document tool usually goes live in 1 to 4 weeks. AI agents connected to
          your systems take 4 to 6 weeks, and custom models or platforms 2 to 3 months. Typical
          costs range from $5,000 to $150,000 or more depending on scope.
      - q: How is AI different from automation?
        a:
          "Automation follows fixed rules to do repetitive work. AI handles work that needs reading,
          language, or judgment. Many projects use both: automation moves the work along, and AI
          handles the steps that need understanding. See our [automation](ref:svc.automation)
          service."
