comprehension:
  what: "We put artificial intelligence (software that can read, write, search, and predict) to work
    inside your real tools and processes: assistants, document handling, search, and predictions,
    built with the checks that keep them dependable."
  problem: Many teams have tried AI tools but cannot get them into daily work. They are unsure which
    kind of AI fits, what it will cost, and how to keep it safe.
  audience: Leaders and teams who want AI to do one specific job, such as answering questions,
    handling routine requests, reading documents, or spotting patterns.
  choose: Start from the job you want done, not from the technology. The right kind of AI depends on
    whether you need answers, actions, document reading, or predictions.
  next:
    Tell us the job you want AI to do and what information is involved. We will say which approach
    fits, and whether AI is the right tool at all.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Service
    headline: AI solutions that save time and answer customers
    lead: "We build AI that does real work for your business: assistants that answer from your own
      documents, tools that read and sort paperwork, agents that handle routine tasks, and
      predictions that support decisions. You get measurable time saved, with people in control."
    ctas:
      - label: Discuss your AI project
        href: /contact/?service=ai
      - label: See more kinds of AI
        href: "#kinds"
    visualTitle: An assistant that shows its sources and hands over
    figureCaption:
      This sketch shows a conceptual chat with a customer question, an answer that cites
      its source, and an offer to talk to a person. It illustrates a type of AI feature and is not a
      client's product.
    figure: assistant-ui
    purpose: system
    takeaway:
      A dependable AI assistant answers from approved content, shows its source, and offers a
      hand-over to a person.
  - type: definition
    id: what-is
    tone: white
    label: Our approach
    heading: AI that pays for itself
    answer:
      "We use artificial intelligence (AI) for work that normally needs human judgment: reading
      documents, drafting replies, finding the right answer, or spotting a pattern. Machine
      learning, the part of AI that learns from examples instead of fixed rules, is one of the tools
      we reach for, never the starting point."
    paragraphs:
      - In business, AI is useful when the work involves language, documents, images, or patterns
        that are too messy for simple rules. It is less useful when a clear rule already does the
        job. A rule that says "send invoices over a set amount to a manager" does not need AI.
      - So the first question is not "how do we use AI?" It is "what job do we want done, and is AI
        the best way to do it?" We help you answer that honestly, then build the part that is worth
        building.
  - type: index
    id: kinds
    tone: paper
    columns: 2
    label: Kinds of AI
    heading: The kinds of AI work we do
    intro: Most business AI falls into a few kinds. Each one suits a different job.
    items:
      - title: Knowledge assistants
        ref: cap.ai-knowledge-systems
        body:
          An assistant that answers questions using your own handbooks, contracts, and files. Staff stop
          searching folders and get an answer with the source shown.
      - title: Support assistants and chatbots
        ref: cap.ai-chatbots
        body: A helper for your website or inbox that answers common questions at any hour. It hands
          anything difficult or sensitive to a person.
      - title: AI agents
        ref: cap.ai-agent-development
        body:
          Software that can plan steps and use other tools to finish a task, such as checking an order,
          updating a record, and sending a reply.
      - title: Document processing
        ref: cap.document-intelligence
        body:
          Tools that read invoices, forms, contracts, and scans, pull out the details that matter, and
          send them where they belong.
      - title: Predictions and recommendations
        ref: cap.predictive-analytics
        body:
          Models that learn from past records to forecast demand, flag risks, or suggest what a customer
          may want next.
      - title: Image, video, and speech AI
        ref: cap.computer-vision
        body:
          "Software that understands pictures, video, or spoken words: reading labels, checking quality,
          or turning calls into notes."
  - type: diagram
    id: assistant-view-map
    tone: white
    label: Choosing
    heading: Which kind of AI fits which job
    intro: Start from the job you want done. The right kind of AI follows from it.
    spec:
      kind: decision
      question: What do you want AI to do for you?
      branches:
        - when: Answer questions from our own documents
          choose: A knowledge assistant
          text: Finds the right passage in your files and answers in plain language.
        - when: Handle routine customer messages
          choose: A support assistant
          text: Replies to common questions and passes hard ones to a person.
        - when: Carry out a task from start to finish
          choose: An AI agent
          text: Plans the steps and uses your tools to complete them.
        - when: Read invoices, forms, or contracts
          choose: Document processing
          text: Pulls out the key details and files them correctly.
        - when: Predict what is likely to happen
          choose: A prediction model
          text: Learns from past records to forecast or recommend.
    purpose: decision
    takeaway: The right kind of AI depends on the job you want done, so start with the job.
    visualTitle: Which kind of AI fits which job
    caption:
      This diagram shows five common jobs people want AI to do and the kind of AI that fits each
      one, so you can start from your goal.
    points: []
  - type: diagram
    id: how-assistant-works
    tone: white
    label: How it works
    heading: How an assistant answers from your own documents
    intro: Many useful business assistants work the same way. They look up the right pages first and
      only then write an answer. This keeps the answer tied to your real information.
    spec:
      kind: flow
      steps:
        - title: Your documents are prepared
          text: Files are read and organized so they can be searched by meaning.
        - title: Someone asks a question
          text: In a chat window, an app, or an inbox.
        - title: The right passages are found
          text: The system looks up the pages most likely to contain the answer.
        - title: The AI writes an answer
          text: It uses only those passages, not its general memory.
        - title: The sources are shown
          text: A person can open the original and check.
    purpose: process
    takeaway: A good assistant looks up your documents first, answers from them, and shows where the
      answer came from.
    caption: This diagram follows one question through a knowledge assistant, from your prepared
      documents to an answer with its sources shown.
    points:
      - title: It uses your information
        body: The answer comes from your approved documents, not from the AI guessing.
      - title: It shows its sources
        body: People can check the original page, which builds trust and catches mistakes.
      - title: It knows when to stop
        body: If the documents do not contain the answer, a well-built assistant says so instead of
          inventing one.
  - type: chooser
    id: route
    tone: paper
    label: Choosing a route
    heading: Which route fits you?
    intro: There are three ways to bring AI into a business. They differ in cost, control, and effort.
    question: How much do you need the AI to fit your own systems and information?
    options:
      - label: Use a ready-made AI tool
        when:
          Your need is general, such as drafting emails or summarizing meetings, and it does not touch
          sensitive or specialist information.
        get: A quick start and low cost, with the tool's features as they are.
        watch:
          You have limited control over where your information goes, and the tool will not know your
          processes.
        cta:
          label: Talk about your options
          href: /contact/?service=ai
      - label: Connect an AI model to your systems
        when: You want AI to work with your own documents, records, or software, but the job is well
          defined.
        get:
          An assistant or helper wired to your information, with your rules, permissions, and a record of
          what it did.
        watch: It needs clean, organized information and someone to check quality over time.
        cta:
          label: Plan a connected AI helper
          href: /contact/?service=ai
      - label: Build a custom AI application
        when:
          AI is central to your product or process, or you need behavior and controls no ready-made tool
          offers.
        get:
          A system designed around your job, with testing, monitoring, and clear human oversight built
          in.
        watch: It is the largest investment. Start with a small, measurable version before committing.
        cta:
          label: Scope a custom AI project
          href: /contact/?service=ai
  - type: callout
    id: when-not
    tone: white
    variant: limits
    title: How we pick the right approach
    paragraphs:
      - "We use AI where it adds the most value: reading unstructured documents, answering
        questions, and making suggestions. Where a simple rule or a connection between systems does
        the job, we use that instead, because it is cheaper to run."
      - You get the most reliable solution for the job, measured against real results.
    items:
      - The task follows clear, fixed rules.
      - A wrong answer would be costly and no person will check it.
      - You do not yet have the information the AI would need.
      - Nobody can say what a good result looks like, so it cannot be measured.
  - type: columns
    id: safe
    tone: paper
    label: Safe and useful
    heading: Making AI safe, accurate, and under control
    intro: A useful AI system is one people can trust. These are the four things we design for.
    columns:
      - title: Your information
        items:
          - We decide what the AI may see, and who may see its answers.
          - Sensitive information stays within your rules for privacy and access.
      - title: Accuracy
        items:
          - We test the system on real examples before it goes live.
          - We keep measuring quality afterward, because models and information change.
      - title: People in control
        items:
          - A person reviews decisions that matter.
          - Every action is recorded, so you can see what happened and why.
      - title: Cost and change
        items:
          - We estimate running costs before you commit.
          - We plan for change, so a better model can be swapped in without a rebuild.
  - type: process
    id: project
    tone: white
    label: How a project runs
    heading: How an AI project runs
    intro: We start small, measure early, and grow only what works.
    steps:
      - title: Pick one job
        body:
          We choose a single, specific job with a clear measure of success, such as time saved or
          questions answered correctly.
        artifacts:
          - One-page goal
          - How success will be measured
      - title: Check the information
        body: We look at the documents or records the AI would use, and fix gaps before building.
        artifacts:
          - Information review
          - List of what the AI may use
      - title: Build a small version
        body: We build a working version for a few people, using real examples.
        artifacts:
          - Working prototype
          - Test results
      - title: Measure honestly
        body: We compare results with the goal, including where it fails, and decide whether to continue.
        artifacts:
          - Quality report
          - Go or stop recommendation
      - title: Release with safeguards
        body: We roll it out with review steps, limits, and monitoring in place.
        artifacts:
          - Live system
          - Monitoring and alerts
      - title: Improve and look after it
        body:
          We keep checking quality and cost, and update the system as your needs and the technology
          change.
        artifacts:
          - Regular quality checks
          - Updates and fixes
  - type: technical
    id: technology
    tone: paper
    label: Technology
    heading: The models and tools we build with
    intro:
      "For your developers and IT lead: our choices on models and providers, giving a model your
      information, orchestration and tools, and evaluation and monitoring, and the reasoning behind
      each."
    panels:
      - title: Models and providers
        paragraphs:
          - We work with leading AI model providers, including [OpenAI](ref:prov.openai), [Anthropic
            Claude](ref:prov.anthropic-claude), and [Google Gemini](ref:prov.google-gemini), and
            with open models such as [Meta Llama](ref:prov.meta-llama) and
            [Mistral](ref:prov.mistral). The right model depends on the task, the cost, the speed
            needed, and where your information may be processed.
      - title: Giving a model your information
        paragraphs:
          - The assistant pattern shown above is often called RAG (retrieval-augmented generation).
            Documents are split into passages and turned into numbers that capture meaning. These
            are stored in a [vector database](ref:tech.vector-databases) such as
            [Pinecone](ref:tech.pinecone), [Qdrant](ref:tech.qdrant), or
            [Weaviate](ref:tech.weaviate). At question time the closest passages are retrieved and
            passed to the model.
      - title: Orchestration and tools
        paragraphs:
          - Frameworks such as [LangChain](ref:fw.langchain) and [LlamaIndex](ref:fw.llamaindex)
            help connect models, search, and tools. For agents, we define exactly which tools an
            agent may use, with limits and approval steps.
      - title: Evaluation and monitoring
        items:
          - A test set of real questions with approved answers.
          - Automatic checks for accuracy, unsafe output, and cost per answer.
          - Logs of inputs, sources, and outputs, with sensitive details protected.
          - Alerts when quality drops or costs rise.
  - type: index
    id: work
    tone: white
    label: What it looks like
    heading: See the AI systems we build
    intro:
      "These pages describe the systems in more detail: how they are put together and what choices
