comprehension:
  what: "We make software and websites easy to understand and pleasant to use: we research users,
    design the UI (user interface) and the UX (user experience), test them, and hand them to
    builders."
  problem: People cannot find things, abandon forms, or need training for tools that should be
    obvious. Teams argue about design because nothing has been tested.
  audience: Teams building a product or site, and organizations whose screens confuse customers or staff.
  choose: "Choose by what you have: research when you do not know what people need, design when you
    know but cannot show it, and testing when something exists but does not work well."
  next:
    Show us the screen or journey that causes trouble, or the product you want to create. We will
    suggest where design effort pays off most.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Service
    headline: UI/UX and product design [[people understand at a glance]]
    lead:
      We design websites, apps, and software that feel obvious to use. You get research with real
      users, clickable prototypes, and finished screens that developers can build exactly, so your
      product looks good and works the first time.
    ctas:
      - label: Discuss your design project
        href: /contact/?service=ui-ux
      - label: See what you receive
        href: "#deliverables"
    visualTitle: A dashboard designed to be read at a glance
    figureCaption: This sketch shows a conceptual dashboard with three summary tiles, a bar chart
      without figures, and a short list of items that need attention. It illustrates our design
      approach and is not a client screen.
    figure: dashboard-ui
    purpose: system
    takeaway:
      A well-designed dashboard puts the summary first, the trend next, and the items that need
      attention last.
  - type: prose
    id: why
    tone: white
    label: Why it matters
    heading: Design is how the product feels to use
    paragraphs:
      - When software is hard to use, people give up, make mistakes, or phone for help. Staff need
        training for tools that should be obvious. Customers leave at the checkout. These are design
        problems, even when they look like technical ones.
      - Design is not decoration. It is deciding what to show first, how to word a button, how many
        steps a task needs, and what to do when something goes wrong.
      - We keep it practical. We design for the real people who will use the product, test with
        them, and measure whether the change helped.
  - type: diagram
    id: form
    tone: paper
    label: An example
    heading: What a design change looks like
    intro: "Here is one common fix: a form people abandon, made clearer without changing what it asks."
    spec:
      kind: before-after
      before:
        title: A form people abandon
        text: Everything at once, with little help.
        nodes:
          - title: Fifteen fields on one screen
          - title: Labels that use internal words
          - title: Errors shown only at the end
      after:
        title: A form people finish
        text: Short steps, plain words, help in context.
        nodes:
          - title: Three short steps
          - title: Labels in the customer's own words
          - title: Errors shown next to the field
      hubLabel: Easier to finish
    purpose: before-after
    takeaway:
      Small design changes, such as shorter steps, plain words, and help where it is needed, can
      turn an abandoned form into a finished one.
    caption: This diagram contrasts a long, confusing form with the same form redesigned into short
      steps with plain labels and helpful errors.
  - type: diagram
    id: screen-design-map
    tone: white
    label: The process
    heading: From learning about users to a design ready to build
    intro:
      Good design tests ideas with real people early, when changes are cheap, and only then hands
      them to the builders.
    spec:
      kind: flow
      steps:
        - title: Learn from users
          text: Talk to people and watch how they work.
        - title: Explore ideas
          text: Sketch several ways to solve the problem.
        - title: Prototype
          text: Make a clickable model that feels real.
        - title: Test with people
          text: Watch real users try it, and fix what confuses them.
        - title: Hand over
          text: Give builders everything they need.
    purpose: process
    takeaway: Good design tests ideas with real people early, when changes are cheap, and only then
      hands them to builders.
    visualTitle: From learning about users to a design ready to build
    caption:
      This diagram follows a design project through five steps, from learning about users to a
      tested design handed to the builders.
    points: []
  - type: table
    id: terms
    tone: white
    label: Terms explained
    heading: "UI, UX, and product design: what is the difference?"
    caption: Comparison of UI design, UX design, and product design
    columns:
      - Term
      - What it is about
      - Example question
    rows:
      - - UX design
        - "How it feels to get something done: the steps, the order, and the effort."
        - Can someone book an appointment without help?
      - - UI design
        - "What people see and touch: layout, color, type, buttons, and icons."
        - Is the main button obvious, and is the text readable?
      - - Product design
        - "The bigger picture: what the product should do, for whom, and why, across all its
          screens."
        - Which problem should the product solve first?
