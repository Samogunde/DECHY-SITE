  - type: diagram
    id: system
    tone: white
    label: Design systems
    heading: What a design system is
    intro:
      A design system is a shared kit. It saves time and keeps a product looking and behaving the
      same everywhere.
    spec:
      kind: layers
      layers:
        - title: Principles
          text: How the product should feel and behave.
        - title: Colors, type, and spacing
          text: The basic choices every screen uses.
        - title: Components
          text: Ready-made buttons, forms, menus, and tables.
        - title: Page patterns
          text: Tested layouts for common screens, such as sign-in or checkout.
    purpose: system
    takeaway:
      A design system stacks shared principles, basics, parts, and patterns, so each new screen
      is quicker to make and consistent.
    caption:
      This diagram shows a design system as four layers, from principles at the top to ready-made
      page patterns, each built on the one above.
  - type: process
    id: process
    tone: paper
    label: How a project runs
    heading: How a design project runs
    steps:
      - title: Understand the goal and the people
        body: We agree what success means and who the product is for.
        artifacts:
          - Goals
          - User profiles
      - title: Research
        body: We talk to users, watch how they work, and study what the data shows.
        artifacts:
          - Research findings
          - Main problems to solve
      - title: Explore and prototype
        body: We sketch options, choose a direction with you, and build a clickable model.
        artifacts:
          - Options
          - Clickable prototype
      - title: Test and refine
        body: We test with real users, fix the problems, and test again.
        artifacts:
          - Test results
          - Improved design
      - title: Hand over
        body: We prepare designs, specs, and parts for builders, and stay involved while it is built.
        artifacts:
          - Final designs
          - Design system
          - Notes for builders
  - type: columns
    id: principles
    tone: white
    label: Good design
    heading: Four things we check on every screen
    columns:
      - title: Clear
        items:
          - People know where they are and what to do next.
          - Words are plain, and labels match what people expect.
      - title: Efficient
        items:
          - The common task takes the fewest steps.
          - Nothing is asked for twice.
      - title: Forgiving
        items:
          - Mistakes are easy to undo.
          - Error messages say what happened and how to fix it.
      - title: Accessible
        items:
          - Works with a keyboard and a screen reader.
          - Text is readable, with enough contrast.
  - type: callout
    id: limits
    tone: paper
    variant: note
    title: Test with real people, not opinions
    paragraphs:
      - Design debates often come down to taste. A short test with a handful of real users usually
        settles it, and finds problems nobody expected.
      - We build testing into the process. Even a few sessions can show what to fix first.
  - type: technical
    id: technology
    tone: white
    label: Technology
    heading: The design tools we use
    intro:
      "What we settle early: design and prototyping tools, accessibility, and from design to code,
      so nothing surprises your team later."
    panels:
      - title: Design and prototyping tools
        paragraphs:
          - We design and prototype in [Figma](ref:tool.figma), and work with other tools such as
            [Adobe XD](ref:tool.adobe-xd), [Illustrator](ref:tool.illustrator), and
            [Photoshop](ref:tool.photoshop) when a project needs them.
      - title: Accessibility
        paragraphs:
          - We design to the Web Content Accessibility Guidelines (WCAG), the widely used standard
            for making websites usable by everyone, and test with keyboards and screen readers.
      - title: From design to code
        items:
          - Components in the design system match components in code.
          - Design tokens (shared values for color, type, and spacing) keep the two in step.
          - Designers and developers review work together.
  - type: prose
    id: practice
    tone: paper
    label: In practice
    heading: What testing with real people looks like
    paragraphs:
      - A usability test is simpler than it sounds. A person who resembles your customer is asked to
        complete a realistic task, such as booking an appointment, while we watch quietly and note
        where they hesitate, click the wrong thing, or ask a question.
      - Five or six sessions usually reveal the main problems, which is a small investment compared
        with building the wrong thing and having to redo it, because the same difficulties appear
        again and again. We then fix those, and test again with fresh people to confirm that the
        changes helped.
      - "The results are shown in plain terms: short clips, quotes, and a ranked list of what to
        change first. That keeps discussions focused on what people did, and not on what anyone
        prefers. We also note what worked well, so good parts of the design are kept as the product
        changes."
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about design
    items:
      - q: Do we need research before design?
        a:
          Not always. If you already know your users well, we can move straight to design and test. If you
          are unsure what people need, a short round of research saves much more than it costs.
      - q: How many people do you need to test with?
        a:
          A handful of the right people often reveals most of the major problems. We test in rounds, fixing
          issues between them.
      - q: Can you redesign something that already exists?
        a:
          Yes. We start by finding where people struggle, then improve those parts first instead of redoing
          everything.
      - q: Will the design be ready for developers?
        a:
          Yes. We hand over designs, specifications, and a component kit, and stay involved while it is
          built. Our [software](ref:svc.software-development) and [web](ref:svc.web-development)
          teams can build it.
      - q: Do you design for mobile?
        a: Yes. We design for phones first and widen from there. See our [mobile
          app](ref:svc.mobile-app-development) service.
      - q: How is design different from branding?
        a:
          Design makes a product easy to use. [Branding](ref:svc.branding) shapes how an organization looks
          and is remembered. They work best together.
