      - title: Alternatives
        entityIds: [plat.shopify, plat.webflow]
      - title: Solutions
        entityIds: [sol.crm-integration, sol.business-process-automation]
      - title: Systems we build
        entityIds:
          [workarea.ecommerce-platforms, workarea.commerce-systems, workarea.business-web-platforms]
      - title: Where it applies
        entityIds: [ind.retail, ind.manufacturing, ind.logistics]

  - type: cta
    id: contact-cta
    heading: Tell us what you sell and how you want to run the store
    body: "Describe your products, how you ship, and how you want to run the store. We will compare WooCommerce with the alternatives and outline a build."
    primary: { label: Discuss your WooCommerce project, href: "/contact/?service=ecommerce" }
