id: page.industries
kind: hub
locale: en
path: /industries/
title: "Industries We Build Software For | DECHY Tech"
description: "Software, apps, and websites for 30 industries, from healthcare and fintech to retail, logistics, legal, and government, built by DECHY."
breadcrumbLabel: Industries
intent:
  primary: industry software solutions
  secondary:
    - software development by industry
    - technology services for specific industries
indexing: index
claims: [company.name, company.descriptor]
datePublished: "2026-10-06"
dateModified: "2026-10-06"
schemaTypes: [WebPage, CollectionPage, FAQPage]
comprehension:
  what: "We apply our services to the systems each industry runs, and adapt to what is different about each one."
  problem: "Every industry has its own records, rules, and rhythms, and a supplier that ignores them builds software that does not fit."
  audience: "Leaders choosing a technology partner who want to see that the work will fit the way their industry operates."
  choose: "Pick the industry closest to yours to see the systems it usually needs, then follow the links to the services and solutions behind them."
  next: "Choose your industry below, or tell us about yours if it is not listed."

sections:
  - type: hero
    id: hero
    variant: hub
    eyebrow: Industries
    headline: Technology that fits [[how your industry works]]
    lead: "We build the same kinds of system for many fields, but no two fields use them the same way. These pages explain what is different in each, which systems teams in that field ask for most, and what to take care over."
    support: "DECHY is a global company and works with clients remotely, in any of these fields and in others."
    ctas:
      - { label: Tell us about your industry, href: "/contact/" }
      - { label: See the industries, href: "#industries" }
    spec:
      kind: layers
      layers:
        - title: Your industry
          text: "Its records, rules, and rhythms."
          support:
            - title: Records and data
            - title: Rules and risks
        - title: Systems you need
          text: "Portals, workflows, connections, and reports."
          support:
            - title: What we build
        - title: Solutions
          text: "The answers to common problems."
          support:
            - title: Problems and fixes
        - title: Services and technologies
          text: "The work and the tools behind it."
          support:
            - title: What we do and build with
      layerLabel: From industry to technology
      supportLabel: What sits beside it
    purpose: relationship
    takeaway: "Each industry page starts from how the field works, then leads to the systems, solutions, services, and technologies that fit it."
    visualTitle: "How an industry page leads to the work"
    figureCaption: "This diagram shows four layers from your industry at the top to systems, solutions, and finally the services and technologies behind them."

  - type: entities
    id: industries
    tone: white
    label: The industries
    heading: Thirty industries, in seven groups
    intro: "Each industry page shows the systems that sector asks for, typical project costs and timelines, and how we deliver them."
    style: lists
    groups:
      - title: Health and wellness
        entityIds: [ind.healthcare, ind.fitness, ind.beauty]
      - title: Money
        entityIds: [ind.finance, ind.fintech, ind.banking, ind.insurance]
      - title: Property and building
        entityIds: [ind.real-estate, ind.construction, ind.energy, ind.field-services]
      - title: Commerce and consumer
        entityIds:
          [
            ind.retail,
            ind.restaurants,
            ind.hospitality,
            ind.travel,
            ind.marketplaces,
            ind.automotive,
          ]
      - title: Operations and supply
        entityIds: [ind.logistics, ind.transportation, ind.manufacturing, ind.agriculture]
      - title: People and knowledge
        entityIds:
          [
            ind.education,
            ind.recruitment,
            ind.legal,
            ind.professional-services,
            ind.media,
            ind.nonprofits,
            ind.government,
          ]
      - title: Technology
        entityIds: [ind.saas, ind.telecommunications]

  - type: table
    id: same
    tone: paper
    label: What stays the same
    heading: What changes between industries, and what does not
    caption: What stays the same and what changes when DECHY works in a different industry
    columns: [What stays the same, What changes]
    rows:
      - - "The kinds of system we build, such as portals, workflows, and connections."
        - "Which of them matter most, and what the data inside them means."
      - - "How we work: understand the process, build in small steps, test, hand over."
        - "Who must be involved, and how carefully each step is checked."
      - - "Our engineering standards for security and quality."
        - "The rules, risks, and records that apply to the information."
      - - "The same services and technologies."
        - "The order in which they are used, and what a good first project is."

  - type: callout
    id: other
    tone: white
    variant: note
    title: If your industry is not listed
    paragraphs:
      - "These thirty cover the fields we are asked about most. The same services apply in many more. Tell us how your field works and we will show you what we would build first."
    items:
      - "A short description of your organization and its systems is enough to start"
      - "We will say plainly when a field has rules that need a specialist adviser"

  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about industries
    items:
      - q: Do you only work in these thirty industries?
        a: "No. These are the fields we are asked about most. The same services and technologies apply in many others, and we welcome conversations about them."
      - q: Do you have an office near us?
        a: "DECHY is a global company and works remotely with clients worldwide, so location is not a limit on who we can work with."
      - q: How do you learn the rules of our industry?
        a: "We ask you. You know which rules apply and which records matter. We build to the requirements you give us and suggest you confirm legal points with your own advisers."
      - q: Where do I start?
        a: "With the page for your field, then the solution that matches your most pressing problem. Or contact us with a short description and we will point you to the right place."

  - type: cta
    id: contact-cta
    heading: Tell us about your industry
    body: "Describe your organization, its systems, and what you want to improve. We will say how our work applies and what a first step could be."
    primary: { label: Talk to DECHY, href: "/contact/" }
