  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about marketplace development
    items:
      - q: How much does a marketplace app cost?
        a:
          A focused first version usually costs $20,000 to $40,000 and takes 4 to 6 weeks. On-demand apps
          with live tracking cost $30,000 to $60,000.
      - q: How do payments to sellers work?
        a:
          Buyers pay the platform, your fee is kept automatically, and sellers are paid on a schedule
          through a marketplace payment service.
      - q: Should we build web or mobile first?
        a:
          It depends on how people use your market. On-demand services usually need mobile first, while
          many product marketplaces start on the web.
      - q: Can you build both the buyer and seller apps?
        a: Yes. We build every side, plus the admin console your team uses to run the platform.
      - q: How do you build trust between strangers?
        a:
          With verified profiles, ratings, clear policies, secure payments, and live tracking where it
          matters.
      - q: Can the platform grow to new cities or categories?
        a: Yes. We design it so new areas and categories are settings, not rebuilds.
