    heading: Marketplace software we build
    intro:
      "We build every side of the platform: the buyer app, the seller tools, and the admin console
      your team runs it from."
    items:
      - title: Buyer web and mobile apps
        body: Search, filters, booking or checkout, tracking, and reviews.
      - title: Seller or provider tools
        body: Listings, availability, orders, earnings, and payouts in one place.
      - title: Matching and dispatch
        body: The nearest or best provider offered each job, with accept and decline.
      - title: Marketplace payments
        body: Split payments, platform fees, refunds, and scheduled payouts.
      - title: Trust and safety
        body: Identity checks, ratings, reporting, and moderation tools.
      - title: Admin console
        body: Users, listings, disputes, payouts, and growth metrics for your team.
