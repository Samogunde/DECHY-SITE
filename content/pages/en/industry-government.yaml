  - type: prose
    id: different
    tone: white
    label: What is different
    heading: What good public sector services need
    paragraphs:
      - Public services serve everyone, including people with disabilities, limited digital skills,
        or poor connections. A service that only works for confident users is not finished.
        Accessibility and plain language come first, not last.
      - Behind the form, staff need case management that routes work, tracks deadlines, and connects
        to the records systems already in place. Too often a shiny form ends in an inbox where
        someone retypes everything.
      - We build services end to end, from the citizen's first question to the decision and the
        follow-up, and we measure completion rates, time to decision, and calls avoided.
      - Security, privacy, and procurement rules shape the work. We document decisions, test
        thoroughly, and hand over everything so your team owns the service long after launch.
      - We work in short, visible stages. Each release is shown to the service team and to real
        users before it goes live, so there are no surprises at launch and no long gap between
        investment and benefit.
