  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about public sector software
    items:
      - q: How much does a digital public service cost?
        a:
          One accessible online form with payment usually costs $6,000 to $15,000. Case management and
          portals cost more and are delivered in stages.
      - q: Do you meet accessibility standards?
        a: Yes. We build to the WCAG guidelines and test with screen readers, keyboards, and real users.
      - q: Can you connect to our existing records systems?
        a: Usually, yes, through their interfaces or a controlled adapter, so staff keep their tools.
      - q: Will we own the code?
        a: Yes. You own what we build, with documentation so your team or another supplier can run it.
      - q: Can you work within our procurement process?
        a: Yes. We provide the documentation, pricing, and evidence procurement teams ask for.
      - q: Do you support services after launch?
        a: Yes. We offer support and improvement plans, or a full handover to your own team.
