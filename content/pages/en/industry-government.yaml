    tone: white
    label: How we deliver
    heading: How we deliver public sector services
    intro: A first accessible online service usually goes live within four weeks, with research and
      testing included.
    steps:
      - title: Research with real users
        body: We test the current service with citizens and staff, including people with access needs.
        artifacts:
          - User research
          - Accessibility findings
      - title: Prototype and test
        body: We prototype the new service and test it until people complete it unaided.
        artifacts:
          - Tested prototype
          - Content design
      - title: Build and integrate
        body: We build the service and connect it to the records systems staff use.
        artifacts:
