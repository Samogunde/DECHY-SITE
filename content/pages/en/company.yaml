id: page.company
kind: company
locale: en
path: /company/
title: "About Us: Global Software and Technology Company | DECHY"
description: "About DECHY, a global technology and software company: who we help, how we think, how
  we work, and how to start a project with us."
breadcrumbLabel: About us
intent:
  primary: about dechy
  secondary:
    - dechy technology company
    - who is dechy
indexing: index
claims:
  [
    company.name,
    company.descriptor,
    company.statement,
    company.founded,
    company.scope,
    company.positioning,
    company.breadth,
  ]
datePublished: "2026-10-05"
dateModified: "2026-10-05"
schemaTypes: [WebPage, AboutPage, FAQPage]
comprehension:
  what: "DECHY is a global company for technology, software, AI, and digital solutions, operating
    since 2010 and working with clients remotely."
  problem:
    "When you choose a technology partner you want to know who they are, what they do, how they
    think, and how they would work with you."
  audience: "Buyers and partners checking who DECHY is before they get in touch."
  choose: "Read how we work and who we work with, then judge the approach against your own needs and
    your questions."
  next: "If the approach sounds right, tell us what you are trying to do and we will say honestly
    whether we are a good fit."

sections:
  - type: hero
    id: hero
    variant: hub
    eyebrow: About us
    headline: About DECHY
    lead: "DECHY is a global company for Technology, Software, AI & Digital Solutions. We help
      organizations build, connect, automate, and scale, working with clients remotely, around the
      world."
    photo:
      asset: asset.photo-dechy-office-reception
      layout: aside
      position: 50% 50%
    ctas:
      - { label: Talk to us, href: "/contact/" }
      - { label: How we work, href: "/company/how-we-work/" }
    spec:
      kind: hub
      center:
        title: DECHY
        text: Technology, Software, AI & Digital Solutions.
      spokes:
        - title: Build
          text: Software, websites, apps, and stores.
        - title: Connect
          text: Integration between your tools.
        - title: Automate
          text: Less manual work, more reliable processes.
        - title: Run
          text: Cloud, security, and data.
        - title: Design
          text: Interfaces, brands, and clear messages.
        - title: Decide
          text: Advice before you spend.
    purpose: relationship
    takeaway:
      "DECHY covers building, connecting, automating, running, designing, and deciding, so these
      parts can work as one system."
    visualTitle: "What DECHY does, in six verbs"
    figureCaption: "This diagram shows DECHY at the center with six areas of work around it: build,
      connect, automate, run, design, and decide."

  - type: proof-strip
    id: proof
    tone: ink

  - type: definition
    id: what-is
    photo:
      { asset: asset.photo-team-planning-whiteboard-office, layout: split, position: "50% 45%" }
    tone: paper
    label: Who we are
    heading: A technology company that works as one team
    answer:
      "{{fact:company.positioning}} We work with clients around the world, in person and remotely,
      across many time zones."
    paragraphs:
      - "{{fact:company.breadth}}"
      - "We keep this breadth deliberately. Most real problems cross several kinds of work: a
        website needs design, a system needs security, an automation needs integration. Having these
        under one roof means fewer hand-offs and fewer gaps between them."
      - "Every project gets one team from the first workshop to long-term support: strategy, design,
        engineering, and delivery working side by side."

  - type: stats
    id: facts
    tone: ink
    label: DECHY facts
    heading: The facts, in one place
    intro: "DECHY is a global company for Technology, Software, AI & Digital Solutions. We work with
      clients worldwide, remotely."
    items:
      - value: "{{fact:company.founded}}"
        label: Operating since
      - value: "{{fact:company.clients}}"
        label: Clients helped
      - value: "15"
        label: Services, one team
      - value: "50+"
        label: Technologies we build with

  - type: certification-strip
    id: certifications
    tone: ink
    label: Certified team
    heading: Skills proven by the people who set the standard
    intro: "Our team's certifications come from the companies whose platforms we build on, so you know the skills are proven, not just claimed."
    limit: 8

  - type: statement
    id: since-2010
    tone: white
    label: About DECHY
    factId: company.statement

  - type: gallery
    id: inside
    tone: ink
    label: Inside DECHY
    heading: Where we plan, build, and review your software
    intro:
      Our engineers, designers, and project leads work side by side, so decisions are made in one
      room instead of across five email threads.
    items:
      - photo:
          {
            asset: asset.photo-dechy-software-engineers-workspace,
            layout: split,
            position: 50% 50%,
          }
      - photo:
          { asset: asset.photo-dechy-boardroom-client-workshops, layout: split, position: 50% 50% }
      - photo:
          {
            asset: asset.photo-dechy-meeting-room-project-reviews,
            layout: split,
            position: 50% 50%,
          }

  - type: columns
    id: principles
    tone: white
    label: How we think
    heading: Four ideas behind our work
    columns:
      - title: Start from the problem
        items:
          - "We ask what you are trying to achieve before we suggest a tool."
          - "We say when a smaller step, or no technology, would do."
      - title: Say it plainly
        items:
          - "We explain options and costs in everyday words."
          - "We explain technical terms the first time we use them."
      - title: Build to last
        items:
          - "Tested, documented, and maintainable by other teams."
          - "Your code and data belong to you."
      - title: Be honest about limits
        items:
          - "We do not promise what nobody can promise, such as rankings or perfect security."
          - "We state what we do not know."

  - type: team
    id: team
    tone: ink
    label: Our team
    heading: The people who design, build, and support your systems
    intro: Strategy, engineering, design, and delivery in one team, so nothing gets lost between handoffs.
    members:
      - name: Peter Lawson
        role: "Managing Director"
        lead: true
        owns: "Projects that deliver what was agreed, on clear terms."
        focus:
          - "Strategy"
          - "Client partnerships"
          - "Delivery oversight"
        photo: { asset: asset.photo-team-managing-director, layout: rail, position: "50% 30%" }
      - name: Aaron Douglas
        role: "Director of Software Engineering"
        lead: true
        owns: "Software that stays fast, secure, and easy to change after launch."
        focus:
          - "Architecture"
          - "Code quality"
          - "Web and mobile"
        photo: { asset: asset.photo-team-director-of-software-engineering, layout: rail, position: "50% 30%" }
      - name: James Anderson
        role: "Director of Delivery"
        lead: true
        owns: "Projects that ship on the agreed scope, with no surprises."
        focus:
          - "Planning"
          - "Risk management"
          - "Client reporting"
        photo: { asset: asset.photo-team-director-of-delivery, layout: rail, position: "50% 30%" }
      - name: Samuel Abims
        role: "Project Consultant"
        owns: "A clear first plan and price for every new client."
        focus:
          - "Discovery"
          - "Scoping"
          - "Client contact"
        photo: { asset: asset.photo-team-project-consultant, layout: rail, position: "50% 30%" }
      - name: Luis Castellan
        role: "Mobile Product Lead"
        owns: "Field apps that let crews finish the job on the phone."
        focus:
          - "iOS and Android"
          - "Offline use"
          - "Field service"
        photo: { asset: asset.photo-team-mobile-product-lead, layout: rail, position: "50% 30%" }
      - name: Amara Linwood
        role: "Conversational AI Lead"
        owns: "Assistants that answer well and hand over to people at the right moment."
        focus:
          - "AI assistants"
          - "Handover rules"
          - "Customer support"
        photo: { asset: asset.photo-team-conversational-ai-lead, layout: rail, position: "50% 30%" }
      - name: Daniel Fairbanks
        role: "Security Consultant"
        owns: "Access that is granted and removed the same way every time."
        focus:
          - "Access control"
          - "Security reviews"
          - "Joiner checklists"
        photo: { asset: asset.photo-team-security-consultant, layout: rail, position: "50% 30%" }
      - name: Maya Thornbury
        role: "Brand Designer"
        owns: "One brand kit the whole team can use with confidence."
        focus:
          - "Brand identity"
          - "Design systems"
          - "Templates"
        photo: { asset: asset.photo-team-brand-designer, layout: rail, position: "50% 30%" }

  - type: index
    id: next
    tone: paper
    label: Where to look next
    heading: Learn more about how we work
    items:
      - title: How we work
        href: /company/how-we-work/
        body: "The stages of a project, how we communicate, and the shapes an engagement can take."
      - title: Who we work with
        href: /company/who-we-work-with/
        body: "The kinds of organization we help, and what each tends to need."
      - title: Our services
        href: /services/
        body: "All fifteen services, in five groups."
      - title: Our work
        href: /work/
        body: "The twenty-five kinds of system we build, each explained."

  - type: faq
    id: faq
    tone: white
    label: Common questions
    heading: Questions about DECHY
    items:
      - q: Where is DECHY based?
        a:
          "DECHY is a global company. Our team works from the DECHY office and remotely, and we serve
          clients worldwide, with workshops in person or by video, whichever suits you."
      - q: How long has DECHY been working?
        a:
          "We have been operating since {{fact:company.founded}}. The statement above sets out the scale in
          the words we have approved."
      - q: Do you work with small organizations?
        a:
          "Yes. We help individuals and small teams as well as larger organizations. See [who we work
          with](/company/who-we-work-with/)."
      - q: How do I start?
        a:
          "Use the contact page to describe what you want to do. We reply with an honest view of whether
          and how we can help."

  - type: cta
    id: contact-cta
    heading: Tell us what you are trying to do
    body:
      "Describe your situation in your own words. We will say honestly whether we are a good fit and
      what a first step could be."
    primary: { label: Talk to DECHY, href: "/contact/" }
