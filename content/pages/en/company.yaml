          }

  - type: columns
    id: principles
    tone: white
    label: How we think
    heading: Four ideas behind our work
    columns:
      - title: Start from the problem
        items:
          - "We ask what you are trying to achieve before we suggest a tool."
          - "We say when a smaller step, or no technology, would do."
      - title: Say it plainly
        items:
          - "We explain options and costs in everyday words."
          - "We explain technical terms the first time we use them."
      - title: Build to last
        items:
          - "Tested, documented, and maintainable by other teams."
          - "Your code and data belong to you."
      - title: Be honest about limits
        items:
          - "We do not promise what nobody can promise, such as rankings or perfect security."
          - "We state what we do not know."

  - type: team
    id: team
    draft: true
    tone: ink
    label: Our team
    heading: The people who design, build, and support your systems
    intro: Strategy, engineering, design, and delivery in one team, so nothing gets lost between handoffs.
    members:
      - name: Daniel Whitaker
        role: Founder and CEO
        bio: Founded DECHY and still joins the first call on most projects.
        focus: [Strategy, Client relationships, Growth]
      - name: Sarah Mitchell
        role: Chief Technology Officer
        bio:
          Leads architecture and engineering standards so everything we build is secure and easy to
          maintain.
        focus: [Architecture, Security, Engineering standards]
      - name: James Calloway
        role: Head of Delivery
        bio: Runs delivery, weekly demos, and the short timelines our clients count on.
        focus: [Project management, Planning, Quality]
      - name: Ethan Brooks
        role: Lead Software Engineer
        bio: Leads our web and back-end engineers across portals, SaaS products, and integrations.
        focus: [Web apps, APIs, Cloud]
      - name: Marcus Reid
        role: Mobile Lead
        bio: Leads iPhone and Android development in Flutter, React Native, Swift, and Kotlin.
        focus: [iOS, Android, Flutter]
      - name: Olivia Grant
        role: Lead Product Designer
        bio: Turns rough ideas into screens people understand, from research to design systems.
        focus: [UX research, UI design, Design systems]
      - name: Lucas Moreno
        role: AI and Automation Lead
        bio: Builds the AI assistants, agents, and automations that take repetitive work off your team.
        focus: [AI assistants, Automation, Integrations]
      - name: Ryan Foster
        role: Cloud and DevOps Lead
        bio: Keeps hosting, deployments, monitoring, and cloud costs in shape after launch.
        focus: [AWS, Azure, Monitoring]
      - name: Chloe Bennett
        role: Client Success Manager
        bio: Your contact after launch for support, training, and planning improvements.
        focus: [Support, Training, Roadmaps]
      - name: Hannah Cole
        role: Head of People
        bio: Hires and grows the team, and keeps the same people on your project from start to finish.
        focus: [Hiring, Team growth, Culture]
      - name: Adrian Cole
        role: Data and Analytics Lead
        bio: Builds the data pipelines and dashboards our clients run their businesses on.
        focus: [Dashboards, Data pipelines, Reporting]
      - name: Nora Ellison
        role: Quality Assurance Lead
        bio: Leads testing on every project; nothing ships until it passes her checklist.
        focus: [Test automation, Release checks, Accessibility]

  - type: index
    id: next
    tone: paper
    label: Where to look next
    heading: Learn more about how we work
    items:
      - title: How we work
        href: /company/how-we-work/
        body: "The stages of a project, how we communicate, and the shapes an engagement can take."
      - title: Who we work with
        href: /company/who-we-work-with/
        body: "The kinds of organization we help, and what each tends to need."
      - title: Our services
        href: /services/
        body: "All fifteen services, in five groups."
      - title: Our work
        href: /work/
        body: "The twenty-five kinds of system we build, each explained."

  - type: faq
    id: faq
    tone: white
    label: Common questions
    heading: Questions about DECHY
    items:
      - q: Where is DECHY based?
        a:
          "DECHY is a global company. Our team works from the DECHY office and remotely, and we serve
          clients worldwide, with workshops in person or by video, whichever suits you."
      - q: How long has DECHY been working?
        a:
          "We have been operating since {{fact:company.founded}}. The statement above sets out the scale in
          the words we have approved."
      - q: Do you work with small organizations?
        a:
          "Yes. We help individuals and small teams as well as larger organizations. See [who we work
          with](/company/who-we-work-with/)."
      - q: How do I start?
        a:
          "Use the contact page to describe what you want to do. We reply with an honest view of whether
          and how we can help."

  - type: cta
    id: contact-cta
    heading: Tell us what you are trying to do
    body:
      "Describe your situation in your own words. We will say honestly whether we are a good fit and
      what a first step could be."
    primary: { label: Talk to DECHY, href: "/contact/" }
