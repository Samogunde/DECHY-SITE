sections:
  - type: hero
    id: hero
    variant: hub
    eyebrow: About us
    headline: About DECHY
    lead: "DECHY is a global company for Technology, Software, AI & Digital Solutions. We help organizations build, connect, automate, and scale, working with clients remotely, around the world."
    photo:
      asset: asset.photo-dechy-office-reception
      layout: aside
      position: 50% 50%
    ctas:
      - { label: Talk to us, href: "/contact/" }
      - { label: How we work, href: "/company/how-we-work/" }
    spec:
      kind: hub
      center:
        title: DECHY
        text: Technology, Software, AI & Digital Solutions.
      spokes:
        - title: Build
          text: Software, websites, apps, and stores.
        - title: Connect
          text: Integration between your tools.
        - title: Automate
          text: Less manual work, more reliable processes.
        - title: Run
          text: Cloud, security, and data.
        - title: Design
          text: Interfaces, brands, and clear messages.
        - title: Decide
          text: Advice before you spend.
    purpose: relationship
    takeaway: "DECHY covers building, connecting, automating, running, designing, and deciding, so these parts can work as one system."
    visualTitle: "What DECHY does, in six verbs"
    figureCaption: "This diagram shows DECHY at the center with six areas of work around it: build, connect, automate, run, design, and decide."

  - type: stats
    id: facts
    tone: ink
    label: DECHY facts
    heading: The facts, in one place
    intro: "DECHY is a global company for Technology, Software, AI & Digital Solutions. We work with clients worldwide, remotely."
    items:
      - value: "{{fact:company.founded}}"
        label: Operating since
      - value: "{{fact:company.clients}}"
        label: Clients helped
      - value: "15"
        label: Services, one team
      - value: "50+"
        label: Technologies we build with

  - type: gallery
    id: inside
    tone: ink
    label: Inside DECHY
    heading: Where we plan, build, and review your software
    intro: Our engineers, designers, and project leads work side by side, so decisions are made in one room instead of across five email threads.
    items:
      - photo:
          {
            asset: asset.photo-dechy-software-engineers-workspace,
            layout: split,
            position: 50% 50%,
          }
        title: Engineering floor
        text: Where our developers build, test, and ship client software every day.
      - photo:
          { asset: asset.photo-dechy-boardroom-client-workshops, layout: split, position: 50% 50% }
        title: Client workshops
        text: Discovery sessions, scoping, and planning with your team.
      - photo:
          {
            asset: asset.photo-dechy-meeting-room-project-reviews,
            layout: split,
            position: 50% 50%,
          }
        title: Project reviews
        text: Weekly demos and release reviews, in the room or on a call.

  - type: team
    id: team
    draft: true
    tone: ink
    label: Our team
    heading: The people who design, build, and support your systems
    intro: Strategy, engineering, design, and delivery in one team, so nothing gets lost between handoffs. Hover or tap a card to read more.
    members:
      - name: Daniel Whitaker
        role: Founder and CEO
        bio: Daniel started DECHY in 2010 to give growing businesses the kind of technology team large companies have. He still joins the first call on most projects and keeps every engagement focused on business results.
        focus: [Strategy, Client relationships, Growth]
      - name: Sarah Mitchell
        role: Chief Technology Officer
        bio: Sarah leads architecture and engineering standards across every project. She has designed platforms for finance, healthcare, and logistics, and makes sure what we build is secure, tested, and easy to maintain.
        focus: [Architecture, Security, Engineering standards]
      - name: James Calloway
        role: Head of Delivery
        bio: James runs delivery and project management. Every client gets a clear plan, weekly demos, and one person who always knows the status. He is the reason our timelines stay short.
        focus: [Project management, Planning, Quality]
      - name: Ethan Brooks
        role: Lead Software Engineer
        bio: Ethan leads our web and back-end engineers. He builds with React, Next.js, Node.js, and Python, and has shipped portals, SaaS products, and integrations used by thousands of people every day.
        focus: [Web apps, APIs, Cloud]
      - name: Marcus Reid
        role: Mobile Lead
        bio: Marcus leads iPhone and Android development in Flutter, React Native, Swift, and Kotlin. He cares about apps that work offline, load fast, and pass app store review the first time.
        focus: [iOS, Android, Flutter]
      - name: Olivia Grant
        role: Lead Product Designer
        bio: Olivia turns rough ideas into screens people understand. She runs research, builds clickable prototypes, and owns our design systems, so the product feels simple from the first release.
        focus: [UX research, UI design, Design systems]
      - name: Lucas Moreno
        role: AI and Automation Lead
        bio: Lucas builds the AI assistants, agents, and automations that take repetitive work off your team. He makes sure every AI feature is accurate, measured, and has a person in control.
        focus: [AI assistants, Automation, Integrations]
      - name: Ryan Foster
        role: Cloud and DevOps Lead
        bio: Ryan looks after hosting, deployment, monitoring, and cost. He has moved dozens of systems to AWS, Azure, and Google Cloud without downtime, and keeps them running after launch.
        focus: [AWS, Azure, Monitoring]
      - name: Chloe Bennett
        role: Client Success Manager
        bio: Chloe is your contact after launch. She runs support, plans improvements with you, and makes sure small requests get done quickly and big ones get planned properly.
        focus: [Support, Training, Roadmaps]
      - name: Hannah Cole
        role: Head of People
        bio: Hannah leads hiring and growth for the DECHY team. She brings in engineers and designers who communicate clearly, and makes sure the same people stay with your project from start to finish.
        focus: [Hiring, Team growth, Culture]

  - type: statement
    id: since-2010
    tone: white
    label: About DECHY
    factId: company.statement

  - type: definition
    id: what-is
    photo: { asset: asset.photo-company-team-working-session, layout: aside, position: "50% 42%" }
    tone: paper
    label: Who we are
    heading: A technology company that works as one team
    answer: "{{fact:company.positioning}} We are a global company, and we work with clients remotely, in many time zones."
    paragraphs:
      - "{{fact:company.breadth}}"
      - "We keep this breadth deliberately. Most real problems cross several kinds of work: a website needs design, a system needs security, an automation needs integration. Having these under one roof means fewer hand-offs and fewer gaps between them."
      - "We are a global company. We do not claim offices, branches, or local teams, and we work with clients wherever they are."

  - type: columns
    id: principles
    tone: white
    label: How we think
    heading: Four ideas behind our work
    columns:
      - title: Start from the problem
        items:
          - "We ask what you are trying to achieve before we suggest a tool."
          - "We say when a smaller step, or no technology, would do."
      - title: Say it plainly
        items:
          - "We explain options and costs in everyday words."
          - "We explain technical terms the first time we use them."
      - title: Build to last
        items:
          - "Tested, documented, and maintainable by other teams."
          - "Your code and data belong to you."
      - title: Be honest about limits
        items:
          - "We do not promise what nobody can promise, such as rankings or perfect security."
          - "We state what we do not know."

  - type: index
    id: next
    tone: paper
    label: Where to look next
    heading: Learn more about how we work
    items:
      - title: How we work
        href: /company/how-we-work/
        body: "The stages of a project, how we communicate, and the shapes an engagement can take."
      - title: Who we work with
        href: /company/who-we-work-with/
        body: "The kinds of organization we help, and what each tends to need."
      - title: Our services
        href: /services/
        body: "All fifteen services, in five groups."
      - title: Our work
        href: /work/
        body: "The twenty-five kinds of system we build, each explained."

  - type: faq
    id: faq
    tone: white
    label: Common questions
    heading: Questions about DECHY
    items:
      - q: Where is DECHY based?
        a: "DECHY is a global company that works remotely with clients worldwide. We do not operate public offices or branches."
      - q: How long has DECHY been working?
        a: "We have been operating since {{fact:company.founded}}. The statement above sets out the scale in the words we have approved."
      - q: Do you work with small organizations?
        a: "Yes. We help individuals and small teams as well as larger organizations. See [who we work with](/company/who-we-work-with/)."
      - q: How do I start?
        a: "Use the contact page to describe what you want to do. We reply with an honest view of whether and how we can help."

  - type: cta
    id: contact-cta
    heading: Tell us what you are trying to do
    body: "Describe your situation in your own words. We will say honestly whether we are a good fit and what a first step could be."
    primary: { label: Talk to DECHY, href: "/contact/" }
