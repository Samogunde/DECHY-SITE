comprehension:
  what: "DECHY is a global company for technology, software, AI, and digital solutions, operating
    since 2010 and working with clients remotely."
  problem:
    "When you choose a technology partner you want to know who they are, what they do, how they
    think, and how they would work with you."
  audience: "Buyers and partners checking who DECHY is before they get in touch."
  choose: "Read how we work and who we work with, then judge the approach against your own needs and
    your questions."
  next: "If the approach sounds right, tell us what you are trying to do and we will say honestly
    whether we are a good fit."

sections:
  - type: hero
    id: hero
    variant: hub
    eyebrow: About us
    headline: About DECHY
    lead: "DECHY is a global company for Technology, Software, AI & Digital Solutions. We help
      organizations build, connect, automate, and scale, working with clients remotely, around the
      world."
    photo:
      asset: asset.photo-dechy-office-reception
      layout: aside
      position: 50% 50%
    ctas:
      - { label: Talk to us, href: "/contact/" }
      - { label: How we work, href: "/company/how-we-work/" }
    spec:
      kind: hub
      center:
        title: DECHY
        text: Technology, Software, AI & Digital Solutions.
      spokes:
        - title: Build
          text: Software, websites, apps, and stores.
        - title: Connect
          text: Integration between your tools.
        - title: Automate
          text: Less manual work, more reliable processes.
        - title: Run
          text: Cloud, security, and data.
        - title: Design
          text: Interfaces, brands, and clear messages.
        - title: Decide
          text: Advice before you spend.
    purpose: relationship
    takeaway:
      "DECHY covers building, connecting, automating, running, designing, and deciding, so these
      parts can work as one system."
    visualTitle: "What DECHY does, in six verbs"
    figureCaption: "This diagram shows DECHY at the center with six areas of work around it: build,
      connect, automate, run, design, and decide."

  - type: proof-strip
    id: proof
    tone: ink

  - type: definition
    id: what-is
    photo:
      { asset: asset.photo-team-planning-whiteboard-office, layout: split, position: "50% 45%" }
    tone: paper
    label: Who we are
    heading: A technology company that works as one team
    answer:
      "{{fact:company.positioning}} We work with clients around the world, in person and remotely,
      across many time zones."
    paragraphs:
      - "{{fact:company.breadth}}"
      - "We keep this breadth deliberately. Most real problems cross several kinds of work: a
        website needs design, a system needs security, an automation needs integration. Having these
        under one roof means fewer hand-offs and fewer gaps between them."
      - "Every project gets one team from the first workshop to long-term support: strategy, design,
        engineering, and delivery working side by side."

  - type: stats
    id: facts
    tone: ink
    label: DECHY facts
    heading: The facts, in one place
    intro: "DECHY is a global company for Technology, Software, AI & Digital Solutions. We work with
      clients worldwide, remotely."
    items:
      - value: "{{fact:company.founded}}"
        label: Operating since
      - value: "{{fact:company.clients}}"
        label: Clients helped
      - value: "15"
        label: Services, one team
      - value: "50+"
        label: Technologies we build with

  - type: certification-strip
    id: certifications
    tone: ink
    label: Certified team
    heading: Skills proven by the people who set the standard
    intro: "Our team's certifications come from the companies whose platforms we build on, so you know the skills are proven, not just claimed."
    limit: 8

  - type: statement
    id: since-2010
    tone: white
    label: About DECHY
    factId: company.statement

  - type: gallery
    id: inside
    tone: ink
    label: Inside DECHY
    heading: Where we plan, build, and review your software
    intro:
      Our engineers, designers, and project leads work side by side, so decisions are made in one
      room instead of across five email threads.
    items:
      - photo:
          {
            asset: asset.photo-dechy-software-engineers-workspace,
            layout: split,
            position: 50% 50%,
          }
      - photo:
          { asset: asset.photo-dechy-boardroom-client-workshops, layout: split, position: 50% 50% }
      - photo:
          {
            asset: asset.photo-dechy-meeting-room-project-reviews,
            layout: split,
            position: 50% 50%,
          }

  - type: columns
    id: principles
    tone: white
    label: How we think
    heading: Four ideas behind our work
    columns:
      - title: Start from the problem
        items:
          - "We ask what you are trying to achieve before we suggest a tool."
          - "We say when a smaller step, or no technology, would do."
      - title: Say it plainly
        items:
          - "We explain options and costs in everyday words."
          - "We explain technical terms the first time we use them."
      - title: Build to last
        items:
          - "Tested, documented, and maintainable by other teams."
          - "Your code and data belong to you."
      - title: Be honest about limits
        items:
          - "We do not promise what nobody can promise, such as rankings or perfect security."
          - "We state what we do not know."

  - type: team
    id: team
    draft: true
    tone: ink
    label: Our team
    heading: The people who design, build, and support your systems
    intro: Strategy, engineering, design, and delivery in one team, so nothing gets lost between handoffs.
    members:
      - name: Peter Lawson
        role: "Managing Director"
        bio: "Sets company direction and keeps delivery priorities aligned with customer needs. Focuses on clear scope, accountable decisions, and durable working relationships."
        photo: { asset: asset.photo-team-managing-director, layout: rail, position: "50% 30%" }
      - name: Aaron Douglas
        role: "Director of Software Engineering"
        bio: "Guides application architecture, code quality, and engineering decisions across software initiatives. Favors systems that are understandable, maintainable, and ready to evolve."
        photo:
          {
            asset: asset.photo-team-director-of-software-engineering,
            layout: rail,
            position: "50% 30%",
          }
      - name: Kunal Kapoor
        role: "AI & Automation Lead"
        bio: "Shapes responsible AI-assisted workflows and practical automation patterns. Connects model capabilities with review steps, exception handling, and real operational needs."
        photo: { asset: asset.photo-team-ai-automation-lead, layout: rail, position: "50% 30%" }
      - name: Toby Harrison
        role: "Cloud & DevOps Architect"
        bio: "Plans deployment environments, infrastructure patterns, and release processes. Brings reliability and operational ownership into early technical decisions."
        photo: { asset: asset.photo-team-cloud-devops-architect, layout: rail, position: "50% 30%" }
      - name: Natalie Ross
        role: "Head of Product Design"
        bio: "Leads product discovery, interaction design, and interface systems. Works to make complex products feel clear without stripping away useful detail."
        photo: { asset: asset.photo-team-head-of-product-design, layout: rail, position: "50% 30%" }
      - name: Nabil Hossain
        role: "Cybersecurity Engineering Lead"
        bio: "Focuses on identity, access boundaries, risk treatment, and secure operational design. Helps make security requirements specific enough to build and test."
        photo:
          {
            asset: asset.photo-team-cybersecurity-engineering-lead,
            layout: rail,
            position: "50% 30%",
          }
      - name: David Wood
        role: "Data & Analytics Lead"
        bio: "Connects data definitions, reporting needs, and decision workflows. Emphasizes context and interpretation rather than dashboards full of disconnected metrics."
        photo: { asset: asset.photo-team-data-analytics-lead, layout: rail, position: "50% 30%" }
      - name: James Anderson
        role: "Director of Delivery"
        bio: "Coordinates planning, dependencies, stakeholder communication, and delivery reviews. Keeps project decisions visible and milestones grounded in agreed scope."
        photo: { asset: asset.photo-team-director-of-delivery, layout: rail, position: "50% 30%" }
      - name: Jessica Flynn
        role: "Quality Engineering Manager"
        bio: "Defines quality checks across requirements, interfaces, integrations, and edge cases. Promotes repeatable testing and clear acceptance criteria."
        photo:
          { asset: asset.photo-team-quality-engineering-manager, layout: rail, position: "50% 30%" }
      - name: Owen Fletcher
        role: "Client Partnerships Director"
        bio: "Coordinates discovery conversations and keeps business priorities connected to proposed solutions. Values honest scope, useful feedback, and clear communication."
        photo:
          {
            asset: asset.photo-team-client-partnerships-director,
            layout: rail,
            position: "50% 30%",
          }
      - name: Dylan Shaw
        role: "Technical Program Manager"
        bio: "Connects business owners, designers, and technical contributors through delivery planning. Tracks risks and decisions so teams can move forward with shared context."
        photo:
          { asset: asset.photo-team-technical-program-manager, layout: rail, position: "50% 30%" }
      - name: Neil Prescott
        role: "Business Analysis Lead"
        bio: "Turns how a business really works into clear requirements before anything is built. Maps processes, data, and decisions with the people who run them, so the scope matches the need."
        photo: { asset: asset.photo-team-business-analysis-lead, layout: rail, position: "50% 30%" }
      - name: Samuel Abims
        role: "Project Consultant"
        bio: "Is often the first person new clients speak to. Listens to what a business needs, explains the options and costs in plain words, and stays the main point of contact through the project."
        photo: { asset: asset.photo-team-project-consultant, layout: rail, position: "50% 30%" }
      - name: Luis Castellan
        role: "Mobile Product Lead"
        bio: "Builds mobile apps for people who work away from a desk, such as technicians, drivers, and field crews. Makes sure they can finish a job on the phone, add photos and notes on the spot, and keep working when the signal drops."
      - name: Amara Linwood
        role: "Conversational AI Lead"
        bio: "Builds AI assistants that answer common customer questions and pass everything else to a person on your team. Sets clear rules for when a conversation is handed over, so customers never get stuck with a canned reply."
      - name: Daniel Fairbanks
        role: "Security Consultant"
        bio: "Helps clients see who can reach which systems and close the accounts that should no longer be open. Sets up joining and leaving checklists so access is added and removed the same way every time, and explains each risk in plain terms."
      - name: Maya Thornbury
        role: "Brand Designer"
        bio: "Turns scattered logos, colors, and templates into one brand kit the whole team can use. Prepares the right files for the website, documents, and social posts, with simple guidance on which to use where."

