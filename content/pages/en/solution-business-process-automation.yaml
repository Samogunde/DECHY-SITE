comprehension:
  what: Business process automation means letting software carry out the repeated steps of a process, such as collecting a request, checking it, routing it for approval, and updating records.
  problem: Work moves by email and spreadsheet, details are typed more than once, approvals stall in inboxes, and nobody can see where a request has got to.
  audience: Operations, finance, and service leaders whose teams spend hours on routine steps, and owners who feel the business is held back by manual work.
  choose: Automate the steps that follow fixed rules and repeat often. Fix an unclear process before you automate it, and keep people in the steps that need judgment.
  next: Tell us which process costs your team the most time. We will map it with you and outline what to automate first.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Solution
    headline: Business process automation
    lead: If your team spends its days re-typing details, chasing approvals, and updating the same record in three places, the process is doing work that software can do. We automate the repeated steps and leave the judgment to people.
    ctas:
      - label: Discuss a process
