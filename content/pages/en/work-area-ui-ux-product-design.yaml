comprehension:
  what: "We build the working system behind good screens: user research, prototypes, testing, and a shared kit of parts that keeps every UI (user interface) and UX (user experience) consistent."
  problem: Screens designed one at a time drift apart, new features look different from old ones, and design decisions are argued about, not tested.
  audience: Product teams whose screens have become inconsistent, and organizations about to build several related screens or apps.
  choose: Build a small design system when you have more than a handful of screens. Test with users before building.
  next: Show us a few screens that feel inconsistent or confusing. We will suggest how to bring them into one clear system.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Work Area
    headline: UI/UX and Product Design
    lead: "We design the screens people use, the UI (user interface), and how it feels to get something done on them, the UX (user experience). Our design work rests on a system: research with real users, testing before building, and a shared kit of parts so every screen stays consistent."
    ctas:
      - label: Discuss your design project
        href: /contact/?service=ui-ux
      - label: See the kit
        href: "#kit"
    spec:
      kind: hub
      center:
        title: A design system
        text: One shared kit for every screen.
      spokes:
        - title: Principles
          text: How the product should feel.
        - title: Colors and type
          text: The basic choices.
        - title: Components
          text: Buttons, forms, and menus.
        - title: Patterns
          text: Tested page layouts.
        - title: Guidance
          text: How and when to use each part.
        - title: Code
          text: Matching parts for developers.
    purpose: system
    takeaway: A design system gathers principles, colors, components, patterns, guidance, and code into one shared kit.
    visualTitle: What a design system contains
    figureCaption: "This diagram shows a design system with six parts around it: principles, colors and type, components, patterns, guidance, and matching code."
  - type: definition
    id: what-is
    tone: white
    label: In practice
    heading: A shared kit that keeps screens consistent
    answer: "We build design systems: a shared set of parts and rules for screens, with colors, type, components, layouts, and guidance on using them, so many people can make screens that look and behave alike."
    paragraphs:
      - Without one, each new screen is invented fresh. The result is a product whose buttons differ, whose forms behave differently, and whose new features feel as if they came from elsewhere.
      - With one, new screens are quicker to make and easier to learn, because people meet the same parts in the same places.
  - type: table
    id: practice
    tone: paper
    label: The practice
    heading: "Research, test, build: what each gives you"
    caption: Design activities and what each gives
    columns:
      - Activity
      - What happens
      - What you get
    rows:
      - - User research
        - We talk to and watch real users.
        - A clear list of what people need and where they struggle.
      - - Prototyping
        - We make clickable models of screens.
        - Ideas you can try before anything is built.
      - - Usability testing
        - We watch people attempt real tasks.
        - A ranked list of what to fix.
      - - Design system
        - We build the shared kit.
        - Faster, more consistent screens.
  - type: diagram
    id: kit
    tone: white
    label: How it fits
    heading: From a design to a working screen
    intro: The design system sits between designers and developers, so both build from the same parts.
    spec:
      kind: layers
      layerLabel: From principles to screens
      layers:
        - title: Principles
          text: What the product should feel like.
        - title: Basic choices
          text: Colors, type, and spacing, held as shared values.
        - title: Components
          text: Ready-made parts, designed and built once.
        - title: Screens
          text: Assembled from components, tested with users.
    purpose: architecture
    takeaway: Screens are assembled from components, which come from basic shared choices, which follow the principles.
    caption: This diagram shows four layers from principles down to finished screens, each assembled from the one above.
  - type: callout
    id: scenario
    tone: paper
    variant: illustrative
    title: Three products that finally feel alike
    paragraphs:
      - A typical case is a company with a website, a customer portal, and a staff tool, each designed by a different person. Buttons differ in all three, and users forget how to do things when they move between them.
      - A design system could unify them. Staff and customers would find the same buttons, forms, and messages everywhere, and new features would be quicker to add.
  - type: faq
    id: faq
    tone: white
    label: Common questions
    heading: Questions about design systems
    items:
      - q: Is a design system only for large products?
        a: No. A small one, with colors, type, and a dozen components, helps as soon as you have more than a handful of screens.
      - q: Who maintains it?
        a: It needs an owner. We can set it up and train your team, or continue to look after it with you.
      - q: Will it slow us down?
        a: At first it adds work. After that, new screens are quicker, because parts are ready and decisions are already made.
