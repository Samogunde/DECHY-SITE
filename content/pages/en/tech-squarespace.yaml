  - type: prose
    id: what
    tone: white
    label: What it means
    heading: Design quality as the starting point
    paragraphs:
      - Squarespace began with a belief that a website should look good by default. Its templates carry strong typography, spacing, and image handling, so even a first draft looks professional. That is why it is popular with photographers, studios, restaurants, and consultants.
      - Behind the design is a single subscription that covers hosting, security, a store, scheduling, newsletters, and member areas. There is little to assemble and nothing to patch.
      - The matching limit is flexibility. You work within the structure the templates give you. Unusual layouts and custom behavior take effort, and some things cannot be done.
  - type: chooser
    id: fit
    tone: paper
    label: Fit
    heading: Is Squarespace the right choice?
    intro: The answer depends on what the site must do, more than on how it should look.
    question: Which describes your site?
    options:
      - label: A portfolio, studio, or brand site
        when: Visual work or a clear offer is the point, and the content changes occasionally.
        get: A refined site that you can edit, with strong image handling and clean typography.
        watch: Plan the structure before the design, so pages are easy to find.
      - label: A service business with bookings
        when: Clients book calls or sessions, and you send invoices and reminders.
        get: Scheduling, payments, and email in one place.
        watch: Check that the scheduling rules match how you really work.
      - label: A small store
        when: A modest catalogue with simple shipping and tax.
        get: A tidy store with the basics handled.
        watch: Larger catalogs and complex rules strain it, so compare with [Shopify](ref:plat.shopify).
      - label: Custom logic or deep integrations
        when: Accounts, pricing rules, or data that other systems must read.
        get: An honest comparison with platforms that allow more.
        watch: Squarespace can be extended, but not without limits.
  - type: columns
    id: dechy
    tone: white
    label: What DECHY can do
    heading: Working with Squarespace
    columns:
      - title: Design and build
        items:
          - Sites shaped around your brand, not left in a default template.
          - Content structure planned before pages are built.
      - title: Improve
        items:
          - Speed, mobile layout, and search visibility.
          - Clean-up of sites that have grown messy.
      - title: Connect
        items:
          - Forms, bookings, and orders sent to your other tools.
          - Newsletters and analytics set up correctly.
      - title: Move
        items:
          - Moving content to or from Squarespace, with address redirects.
          - A plan for when the site needs a different platform.
  - type: process
    id: build
    tone: paper
    label: How we build it
    heading: A Squarespace project from first sketch to launch
    steps:
      - title: Set the structure
        body: We list the pages, what each must achieve, and how visitors will find them, before touching a template.
        artifacts:
          - Page map
      - title: Shape the design
        body: "We adapt the template to your brand: type, color, spacing, and image style, kept consistent across pages."
        artifacts:
          - Styled template
      - title: Add the features
        body: Scheduling, a store, forms, and email are configured and tested end to end, including the confirmation messages.
        artifacts:
          - Working features
          - Test log
      - title: Prepare for search and launch
        body: Titles, descriptions, image text, and redirects are set. The site is checked on phones and common browsers, then launched.
        artifacts:
          - Launch checklist
  - type: technical
    id: technology
    tone: white
    label: Technical depth
    heading: How we build with Squarespace
    intro: "The detail a technical reviewer will ask about: extending the platform, performance, search and analytics, and leaving."
    panels:
      - title: Extending the platform
        items:
          - Custom styles and small scripts can be added to refine layout and behavior, and are kept in one documented place.
          - Heavier needs are met by connecting outside services through [automation](ref:svc.automation), not by bending the template.
      - title: Performance
        items:
          - Images are sized before upload, and large galleries are loaded as people scroll.
          - Third-party scripts are limited to those that earn their cost.
      - title: Search and analytics
        items:
          - Page titles, descriptions, and headings are written per page, and structure is kept simple and consistent.
          - Analytics and tag settings are set up once and checked for consent handling.
      - title: Leaving
        paragraphs:
          - Content can be exported in a limited form, but the design cannot. A move means rebuilding the layout and carrying the content across.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about Squarespace
    items:
      - q: Is Squarespace good for search visibility?
        a: It can be. The platform handles the basics, and the results depend on structure, content, and speed, which is where the work lies.
      - q: Can Squarespace run a serious online store?
        a: A small one, yes. For larger catalogs, complex shipping, or custom rules, a store platform such as Shopify is usually a better fit.
      - q: Can we add custom features?
        a: Some, through added styles, small scripts, and connected services. Anything that needs custom logic or a database of your own points to another platform.
      - q: Squarespace or Wix?
        a: Squarespace leads on design polish and simplicity. [Wix](ref:plat.wix) offers more built-in features and flexibility in the editor. We compare them against your site.
