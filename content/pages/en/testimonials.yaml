id: page.testimonials
kind: hub
locale: en
path: /testimonials/
title: "Client Testimonials and Reviews | DECHY"
description: "What our clients say about working with DECHY on custom software, websites, mobile apps, AI, automation, cloud, and more, by service and by industry."
breadcrumbLabel: Testimonials
intent:
  primary: dechy testimonials
  secondary:
    - dechy reviews
    - software development company reviews
    - client testimonials software agency
indexing: index
claims: [company.name]
datePublished: "2026-10-21"
dateModified: "2026-10-21"
schemaTypes: [WebPage, CollectionPage, FAQPage]
comprehension:
  what: "Our clients describe, in their own words, what we built or fixed for them and what changed afterwards, across every service we offer."
  problem: "Every agency says it is good to work with. Buyers want to hear from the people who actually hired one."
  audience: "Anyone choosing a technology partner who wants to know what working with DECHY is like before the first call."
  choose: "Read the stories closest to your situation, by service or by industry, then look at the projects behind them."
  next: "When a story sounds like your situation, tell us about it. We reply with a written plan, a fixed quote, and a timeline."

# Section order, layout, and motion follow the reference testimonial page the owner chose
# (owner direction, 21 October 2026). The wording is DECHY's own.
sections:
  - type: tm-hero
    id: hero
    eyebrow: Testimonials
    headline: "Chosen by {{fact:company.clients}} clients worldwide to build, launch, and grow"
    accent: "to build, launch, and grow"
    lead: "Real words from the operations managers, founders, marketers, and product leads who hired us, and what changed for their teams afterwards."
    cta: { label: Explore client stories, href: "#outcomes" }
    photo:
      asset: asset.photo-dechy-team-meeting-software-development
      layout: split
      position: 50% 50%

  - type: tm-logos
    id: companies
    heading: Companies that trust us with real work
    intro: "Confidence starts when you see businesses like yours already working with us. These are some of the companies behind the testimonials on this page."

  - type: tm-stories
    id: stories
    heading: Hear from our clients
    intro: "Short stories from clients on what we built together and what is different for their teams now."
    slides:
      - name: Thomas Reed
        photo:
          {
            asset: asset.photo-dechy-meeting-room-project-reviews,
            layout: split,
            position: 50% 50%,
          }
      - name: Sofia Alvarez
        photo:
          {
            asset: asset.photo-dechy-software-engineers-workspace,
            layout: split,
            position: 50% 50%,
          }
      - name: Michael Chen
        photo: { asset: asset.photo-dechy-project-team-planning, layout: split, position: 50% 50% }
      - name: Liam Murphy
        photo:
          {
            asset: asset.photo-service-automation-workflow-whiteboard,
            layout: split,
            position: 50% 50%,
          }

  - type: tm-journey
    id: journey
    heading: Client journey
    intro: "A good testimonial is never one compliment. It comes from a whole working relationship, from the first uncertain call to a partnership that lasts."
    photo:
      asset: asset.photo-dechy-boardroom-client-workshops
      layout: split
      position: 50% 50%
    steps:
      - title: Before DECHY
        text: "Clients come to us with a process that keeps breaking, a product idea that needs shape, or a system their team has outgrown."
      - title: Planning
        text: "We agree the scope, priorities, timeline, and what success looks like, and put it in writing with a fixed quote before any build starts."
      - title: Design and build
        text: "Designers and engineers work in short cycles. You see working results every few weeks and tell us what to change."
      - title: Launch
        text: "We test with the people who will use it, release in stages, and train your team, with a way back ready if anything needs undoing."
      - title: Growth
        text: "After launch we watch how it is used, remove friction, and add what your team asks for next."
      - title: Ongoing support
        text: "Care plans keep everything updated, secure, and improving, with agreed response times so you always know who to ask."

  - type: tm-outcomes
    id: outcomes
    heading: "What changed, in our clients' own words"
    intro: "Short testimonials from the teams we work with, each paired with the service it is about and the client's industry."

  - type: tm-founders
    id: voices
    heading: What business leaders say
    intro: "Directors, managers, and team leads on what they brought to us and what is different for their business now."
    photo:
      asset: asset.photo-team-planning-whiteboard-office
      layout: split
      position: 50% 50%
    names:
      - Edward Clarke
      - Grace Williams
      - Hannah Foster
      - Leah Scott
      - Victoria Hayes
      - Fatima Bello

  - type: tm-cases
    id: cases
    heading: Customer success stories in depth
    intro: "Short summaries of real projects. Open a full story to see the problem, what we built, how we worked, and the results."
    slugs:
      - claimbridge-insurance-claims-platform
      - forgeplan-manufacturing-operations
      - clinora-hospital-management

  - type: tm-partner
    id: partner
    heading: Your technology partner from idea to support
    intro: "Five ways clients work with us, each designed to remove guesswork and give you confidence at every stage."
    photo:
      asset: asset.photo-team-reviewing-release-screen
      layout: split
      position: 50% 50%
    items:
      - icon: growth
        title: Rapid MVP launch
        text: "A first working version in weeks, not months, so you can test your idea with real users before you commit more budget."
      - icon: users
        title: Dedicated teams
        text: "Engineers, designers, and a delivery lead who work only on your product and stay with it from kickoff onward."
      - icon: workflow
        title: AI and automation built in
        text: "Assistants, document checks, and automated workflows designed into the system from the start, never bolted on later."
      - icon: chart
        title: Proven track record
        text: "Projects delivered for clients in more than twenty countries, across many industries and every one of our services."
      - icon: handshake
        title: End-to-end support
        text: "Planning, design, build, launch, and care after launch from one team, so nothing is lost between suppliers."

  - type: tm-services
    id: by-service
    heading: Testimonials by service
    intro: "Find what clients said about the service you need. Each card opens that service, with its testimonials, our prices, and timelines."

  - type: tm-measured
    id: measured
    heading: Trust is stronger when you can measure it
    intro: "Testimonials tell you how clients felt. These figures show the scale of the work behind them."

  - type: tm-retention
    id: retention
    heading: Why clients keep working with us
    intro: "Clients stay when working with us is clear, dependable, and useful long after the first launch. These are the reasons they give."
    photo:
      asset: asset.photo-team-support-laptop-review
      layout: split
      position: 50% 50%
    items:
      - title: Communication
        icon: megaphone
        text: "You always know what is done, what is blocked, what comes next, and how each decision affects the plan."
      - title: Transparency
        icon: search
        text: "Scope, price, and timeline are written down. Risks are raised when we see them, not after they become problems."
      - title: Speed
        icon: growth
        text: "Short cycles and quick decisions mean you see working results every few weeks, without cutting corners on quality."
      - title: Technical quality
        icon: shield
        text: "Clean, tested, documented work that your own team can understand and build on, long after we hand it over."
      - title: Long-term support
        icon: handshake
        text: "We stay after launch with updates, monitoring, and improvements, and the people who built it are the people who support it."

  - type: tm-excellence
    id: excellence
    heading: Quality is our minimum standard
    intro: "We have taken businesses from a messy spreadsheet or a whiteboard sketch to software their teams rely on every day."
    note: "Software, websites, and apps delivered for professional services, retail, healthcare, education, logistics, finance, and many more."

  - type: tm-recognized
    id: recognized
    heading: Certified where quality matters
    intro: "Our engineers, architects, and project leads hold professional certifications earned by passing the issuers' own exams."
    limit: 6

  - type: faq
    id: faq
    tone: ink
    label: Questions
    heading: Frequently asked questions
    intro: Everything you need to know before working with us.
    items:
      - q: Who are the people in these testimonials?
        a: "Clients who hired us for one of our services: operations managers, school and clinic administrators, marketing leads, product designers, and directors. Each testimonial shows the person's name, role, and company."
      - q: How do I find testimonials for my kind of project?
        a: "Use the testimonials by service row to read what clients said about the service you need. Each service page also shows its testimonials beside our prices and timelines, and each industry page shows testimonials from teams in that industry."
      - q: Where can I see the projects behind the testimonials?
        a: "Our Work page shows the projects we have delivered, with the problem, what we built, and the results. Each service and industry page also shows selected projects."
      - q: How long does a typical project take?
        a: "A first version of a focused web or mobile app usually takes 2 to 4 weeks. Larger systems are delivered in stages, and every quote includes a timeline."
      - q: Do you support what you build after launch?
        a: "Yes. Our care plans cover updates, backups, monitoring, security patches, and ongoing improvements, with agreed response times."
      - q: How do I start a project like these?
        a: "Tell us what is not working and what you want instead. We reply with a written plan, a fixed quote, and a timeline."

  - type: cta
    id: contact-cta
    style: center
    heading: Ready to be our next success story?
    body: "Tell us what you want to build or fix. We reply with a written plan, a fixed quote, and a timeline, and we start with the part that makes the biggest difference."
    primary: { label: Book a free strategy call, href: "/contact/" }
