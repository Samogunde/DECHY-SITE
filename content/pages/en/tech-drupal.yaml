          - Monitoring, backups, and performance tuning.
  - type: index
    id: uses
    tone: paper
    columns: 2
    label: Typical sites
    heading: Where Drupal is the right tool
    items:
      - title: A university or school group
        body: Course, department, and staff pages built from one structure, in more than one language.
      - title: A public body or regulated organization
        body: Strict roles, review steps, and an audit trail of who published what.
      - title: A publisher with many editors
        body: Workflows for drafting, review, and scheduled release across large teams.
      - title: A content hub feeding several channels
        body: One structured source that serves a website, an app, and partner sites.
  - type: process
    id: upgrade
    tone: white
    label: Upgrading
    heading: Moving an old Drupal site forward
    intro: Older Drupal versions no longer receive security fixes. Upgrading is a rebuild of parts, not a button, and it is best done in stages.
    steps:
      - title: Audit what is there
        body: We list the content types, custom modules, themes, and integrations, and which are still used.
        artifacts:
          - Site inventory
          - Module list
      - title: Decide what to keep
        body: Unused content and modules are dropped. Needed ones are replaced by supported equivalents or rebuilt.
        artifacts:
          - Keep
          - replace
          - or drop list
      - title: Rebuild and migrate content
        body: The structure is rebuilt on a current version, and content is moved by repeatable scripts that can be re-run and checked.
        artifacts:
          - New site
          - Migration scripts
          - Check reports
      - title: Test, switch, and watch
        body: Editors and visitors test it, addresses are redirected, and search performance is watched after the switch.
        artifacts:
          - Test results
          - Redirect map
  - type: technical
    id: technology
    tone: white
    label: Technical depth
    heading: How we build with Drupal
    intro: "For your developers and IT lead: our Drupal choices on structure, content and delivery, security and maintenance, and accessibility, and the reasoning behind each."
    panels:
      - title: Structure
        items:
          - Configuration is exported to code and versioned, so changes move through environments in a controlled way.
          - Custom functionality lives in small, documented modules built on supported interfaces, never by editing core.
      - title: Content and delivery
        items:
          - Structured content can also be served as data to other websites and apps.
          - Caching at several levels and a content delivery network keep pages quick under load.
      - title: Security and maintenance
        paragraphs:
          - Security releases are applied on a defined schedule, dependencies are managed with a package tool, and the platform runs on [PHP](ref:lang.php) with a [MySQL](ref:tech.mysql) or [PostgreSQL](ref:tech.postgresql) database.
      - title: Accessibility
        paragraphs:
          - Public bodies and universities carry high accessibility expectations. We build themes to the web accessibility guidelines and test with assistive technology.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about Drupal
    items:
      - q: Is Drupal still a good choice?
        a: For the right site, yes. It is actively developed and well suited to large, structured, governed sites. For small sites it is more platform than you need.
      - q: Is our old Drupal site safe to leave as it is?
        a: Versions that are no longer supported do not receive security fixes, which is a growing risk. We assess the site and recommend an upgrade route.
      - q: Drupal or WordPress?
        a: WordPress suits most sites and is simpler to run. Drupal suits sites with complex content models, many editors, and strict permissions. We compare them on your needs.
      - q: Can you migrate us to another platform?
        a: Yes. We move content with repeatable scripts, redirect addresses, and check that nothing is lost, whichever platform you move to.
