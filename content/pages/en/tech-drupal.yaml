comprehension:
  what: Drupal is an open-source content management system built for sites with complex content, many editors, several languages, and strict control over who can do what.
  problem: Organizations with large or regulated websites run old Drupal versions that are costly to maintain, or need a platform that can model complicated content without custom code everywhere.
  audience: Universities, public bodies, publishers, large organizations, and teams that already run Drupal or need a structured, permission-heavy content platform.
  choose: Choose Drupal for large, structured, multi-editor sites with strict permissions. Choose a lighter platform for smaller sites, and plan a staged upgrade for old Drupal systems.
  next: Tell us about the site, its editors, and any existing Drupal system. We will recommend whether to build, upgrade, or choose another platform.
