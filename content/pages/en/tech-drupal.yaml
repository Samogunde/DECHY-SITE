  - type: prose
    id: what
    tone: white
    label: What it means
    heading: A platform that models your content, not just your pages
    paragraphs:
      - Most website tools start from pages. Drupal starts from content. You define what kinds of thing the organization publishes, such as courses, events, staff, reports, and policies, and what each one contains. Pages are then assembled from that structure.
      - That investment pays when the site is large or heavily governed. A university with thousands of course pages, a public body with strict review rules, or a publisher with many editors needs one source for each fact, and a clear record of who approved it.
      - The cost is complexity. Drupal needs experienced developers, careful hosting, and regular upgrades. For a small brochure site it is more than is needed.
  - type: table
    id: options
    tone: paper
    label: Options
    heading: Drupal beside the other content platforms
    caption: Drupal compared with other content platforms by the kind of site each suits
    columns:
      - Option
      - Suits
      - Trade-off
    rows:
      - - Drupal
        - Large, structured, multilingual sites with many editors and strict permissions.
        - Needs skilled developers and regular upgrades, so it costs more to run.
      - - "[WordPress](ref:plat.wordpress)"
        - Most business sites, blogs, and stores, with the largest range of ready-made add-ons.
        - Complex content structures and permissions need more custom work.
      - - "[Webflow](ref:plat.webflow)"
        - Design-led marketing sites managed by a small team.
        - Less suited to heavy workflows or very large content models.
      - - A headless set-up
        - Content served to several websites and apps from one structured source.
        - More moving parts, and the front end must be built separately.
  - type: columns
    id: dechy
    tone: white
    label: What DECHY can do
    heading: Working with Drupal
    columns:
      - title: Build
        items:
          - Content models designed with your editors.
          - Themes that are fast, accessible, and consistent.
      - title: Upgrade
        items:
          - Version upgrades and migrations in stages.
          - Replacement of unsupported custom code.
      - title: Govern
        items:
          - Roles, permissions, and review workflows.
          - Audit trails for who changed what.
      - title: Look after
        items:
