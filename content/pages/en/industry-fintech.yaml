  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why fintech needs a different kind of engineering
    paragraphs:
      - A bug in most apps is an inconvenience. In fintech it can send money to the wrong place or
        freeze someone's salary. Your software has to be correct under load, explain every number,
        and survive a regulator asking how a balance was calculated.
      - Speed still matters, because competitors launch every month. We get you to market quickly by
        building on established payment, banking, and identity providers, and we spend our effort on
        the experience and logic that are truly yours.
      - Every money movement goes through a ledger, every rule is tested, and every change is logged.
      - We work well with small product teams. We can own the whole build, or join your engineers to
        add a product line, strengthen testing, or rebuild a weak part of the platform without
        slowing your roadmap.
