      - title: Merchant and payout tools
        body: Checkout, invoicing, split payments, and payouts for platforms that pay other people.
      - title: Back-office consoles
        body: Support, refunds, disputes, and reporting for your operations and compliance teams.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about fintech development
    items:
      - q: How much does a fintech app cost?
        a:
          A focused first product usually costs $20,000 to $48,000 and takes 6 to 10 weeks. Lending or
          investment platforms with many rules cost more.
      - q: Do you handle licensing?
        a:
          No. Licensing is a legal matter for you and your advisers. We build the product and the controls
          your compliance team needs.
      - q: Which payment and identity providers do you use?
        a:
          We choose by market and product, from providers such as Stripe, Adyen, and established identity
          check services.
      - q: Can you add features to our existing app?
        a:
          Yes. We often join fintech teams to build a new product line, improve onboarding, or strengthen
          testing.
      - q: How do you keep money movements correct?
        a:
          Every movement goes through a ledger with automated tests and daily reconciliation, so errors
          surface early.
      - q: Can you build a first version to show investors?
        a:
          Yes. We often build a focused first version on real providers, so you can demo live transactions
          and collect feedback before raising or scaling.
