  - type: prose
    id: different
    tone: white
    label: What is different
    heading: What energy companies need from software now
    paragraphs:
      - Energy is changing faster than its systems. Customers install solar, batteries, and chargers
        and expect to see their usage in an app. Networks need to balance more variable supply.
        Installers need to quote, schedule, and commission faster.
      - "Most energy companies already have billing and asset systems that work. What they lack is a
        good layer on top: portals customers like, apps crews trust, and data platforms that join
        readings, assets, and jobs."
      - That is the layer we build, connected carefully to the systems you depend on. You get modern
        customer and crew experiences without putting the systems that run supply and billing at
        risk.
      - We plan for growth from the start. Customer numbers, devices, and readings tend to multiply
        quickly, so the platforms we build handle much higher volumes than you have today without a
        rebuild.
