  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about energy software
    items:
      - q: How much does an energy customer portal cost?
        a:
          Most customer portals cost $16,000 to $40,000 and take 4 to 8 weeks, depending on billing and
          metering integration.
      - q: Can you build tools for solar and battery installers?
        a: Yes. We build quoting, scheduling, installation checklists, and customer apps for installers.
      - q: Do you work with smart meter data?
        a: Yes. We build platforms that collect, clean, and chart meter data for customers and analysts.
      - q: Can you connect to our billing system?
        a: Usually, yes, through its interfaces. We keep billing as the source of truth.
      - q: How do you keep critical systems safe?
        a:
          New tools connect through controlled interfaces with logging, and nothing changes the systems
          that run supply.
      - q: Can customers see their usage in an app?
        a:
          Yes. We build apps that show usage by day and hour, compare periods, and explain what changed,
          using the readings your meters already send.
