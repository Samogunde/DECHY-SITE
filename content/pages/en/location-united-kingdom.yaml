      - title: Decide with data
        items:
          - "[Data and analytics](/data-analytics/) dashboards."
          - "[Cybersecurity](/cybersecurity/) reviews."
  - type: index
    id: industries
    tone: white
    columns: 2
    label: Industries
    heading: Industries we write about that are active in the UK
    items:
      - title: Finance
        body: Onboarding, reporting, and connected core systems.
        href: /industries/finance/
      - title: Professional services
        body: Client portals, time, and billing.
        href: /industries/professional-services/
      - title: Retail and ecommerce
        body: Stores, stock, and customer records that agree.
        href: /industries/retail/
      - title: Real estate and property
        body: Leads, tenant portals, and maintenance requests.
        href: /industries/real-estate/
      - title: Education
        body: Learner portals and records.
        href: /industries/education/
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions from UK organizations
    items:
      - q: Do you have a UK office?
        a: No. DECHY is a global company that works remotely with clients worldwide. We arrange calls at times that suit your team.
      - q: Will our data stay in the UK?
        a: It can. We choose hosting regions to match your requirements and write down where data is stored and processed.
      - q: Can you work with public-sector buyers?
        a: Public bodies have their own procurement rules and often buy through frameworks. Tell us about the project and we will say whether and how we can take part.
      - q: Are your systems accessible?
        a: Accessibility is part of how we build and test every screen, not a later add-on.
  - type: cta
    id: contact-cta
    heading: Tell us about your project
    body: Describe what you want to build or fix, and when your team works. We will propose how an engagement would run.
    primary:
      label: Talk to DECHY
      href: /contact/
