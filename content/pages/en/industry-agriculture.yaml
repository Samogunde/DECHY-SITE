  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why farms and agribusiness are going digital
    paragraphs:
      - Farming has always been data-rich, but most of that data stayed in heads, notebooks, and
        machine memory cards. Today buyers, lenders, and regulators ask for records and proof, and
        margins reward every input used well.
      - Tractors, sensors, and weather stations already produce useful data. The gap is a place that
        brings it together with field records, so a grower can see what each field cost and earned.
      - Traceability is now a selling point. Processors and retailers want to know where produce
        came from and how it was grown, and good records answer them in minutes.
      - "We design for the field: simple apps that work offline, with large buttons, and reports
        that make sense to people who would rather be outside than at a desk."
