  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about agriculture software
    items:
      - q: How much does farm management software cost?
        a:
          A records app usually costs $10,000 to $20,000. A full agribusiness platform with traceability
          and portals costs $40,000 to $80,000 or more.
      - q: Does it work without signal?
        a: Yes. Everything works offline and syncs when the phone finds a connection.
      - q: Can you use data from our tractors and sensors?
        a: Usually, yes. We connect to the data services your machines and sensors provide.
      - q: Can you help us prove traceability to buyers?
        a: Yes. We track every batch from field to buyer and produce the reports they ask for.
      - q: Do you build for cooperatives?
        a: Yes. Cooperatives get portals for members, deliveries, quality results, and payments.
      - q: Why build instead of buying a farm app?
        a:
          Many farms should buy, and we will say so. We build when your crops, processes, or supply chain
          do not fit packaged tools. Where a packaged app fits most of your needs, we can also
          connect it to your other systems instead.
