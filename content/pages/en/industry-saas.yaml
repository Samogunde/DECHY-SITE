    heading: How we work with software teams
    intro: Most engagements ship their first change to production within the first two weeks.
    steps:
      - title: Learn the codebase
        body: We review the architecture, tests, and backlog, and agree on how we will work together.
        artifacts:
          - Codebase review
          - Working agreement
      - title: Ship something small
        body: We ship a small, real change in the first weeks to prove the setup works.
        artifacts:
          - First release
          - Pipeline check
      - title: Take on the roadmap
        body: We deliver agreed features in short cycles with demos to your product team.
        artifacts:
