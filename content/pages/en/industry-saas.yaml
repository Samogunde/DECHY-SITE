  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why software companies work with us
    paragraphs:
      - Software companies sell speed. Customers judge you by how quickly the product improves, and
        competitors are always one release away. Yet hiring good engineers takes months, and every
        new hire needs time to learn the codebase.
      - We add capacity without that delay. A small, senior team joins your process, ships against
        your roadmap, and leaves behind tested, documented code your engineers are happy to own.
      - For new products, we take you from idea to paying customers with a focused first version,
        then keep building as you learn what customers value.
      - "We are strongest on the work in-house teams find hardest to fit in: billing and plans,
        integrations with other tools, AI features, performance, and rebuilding the parts of the
        platform that slow everyone down."
      - Engagements are flexible. Some clients keep us for a single release, others for years as an
        extension of their own team.
  - type: process
