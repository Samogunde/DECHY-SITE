  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about software product development
    items:
      - q: How much does it cost to build a software product?
        a:
          A focused first version usually costs $24,000 to $48,000 and takes 6 to 10 weeks. Ongoing feature
          work is priced per release or per month.
      - q: Can you work alongside our engineers?
        a: Yes. We join your process, tools, and code reviews, and work as part of your team.
      - q: Who owns the code?
        a: You do. Everything we build is yours, documented and ready for your team to maintain.
      - q: Can you add AI to our product?
        a:
          Yes. We add assistants, smart search, summaries, and automation, measured against real customer
          use.
      - q: Can you fix a slow or fragile platform?
        a: Yes. We find the bottlenecks, then rebuild the worst parts in stages while releases continue.
      - q: How quickly can you start?
        a: Usually within two weeks of agreeing scope, with a first change in production soon after.
