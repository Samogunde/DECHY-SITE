  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about legal software
    items:
      - q: How much does legal document automation cost?
        a:
          Document automation for a set of standard documents usually costs $8,000 to $24,000 and takes 3
          to 5 weeks.
      - q: Will AI give legal advice to our clients?
        a:
          No. AI helps your lawyers summarize and draft, and a lawyer reviews everything before it reaches
          a client.
      - q: Can you connect to our practice management system?
        a: Usually, yes, through its interfaces, so matters, contacts, and time stay in one place.
      - q: Is client data safe in a portal?
        a: Yes. Data is encrypted, access is strictly controlled, and every action is logged.
      - q: Do you work with in-house legal teams?
        a:
          Yes. In-house teams use our intake, contract automation, and request tracking to handle business
          requests faster.
      - q: Can clients sign documents online?
        a:
          Yes. Clients can review and sign documents in the portal using established e-signature services.
          Signed documents are filed against the matter automatically, so nobody has to download and
          upload them again.
