  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why law firms are rethinking routine work
    paragraphs:
      - Much legal work is repeatable. Intake questions, engagement letters, standard agreements,
        and status updates follow patterns, yet they are still typed by people whose time is worth
        hundreds an hour.
      - Automating that work does not replace lawyers. It removes the parts clients do not want to
        pay for, so fixed fees become profitable and fee earners spend their day on judgement.
      - Clients expect the same convenience they get from their bank. A secure portal for documents,
        updates, and payments builds trust and cuts the calls that interrupt focused work.
      - Confidentiality shapes every decision we make. Access is strict, actions are logged, and AI
        tools are configured so client information is never used to train outside models.
      - Most firms do not need a huge program to see results. One well-chosen automation, such as
        intake for a busy practice area or templates for its most common documents, often frees
        enough time in the first quarter to fund the next step.
