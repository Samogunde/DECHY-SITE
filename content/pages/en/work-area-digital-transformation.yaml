comprehension:
  what: Digital transformation is changing how an organization works by using technology well, in phases, with each change tied to a result you can measure.
  problem: Large technology programs are costly and slow, and many end with new tools that nobody uses and no improvement in results.
  audience: Leaders planning a major change in how their organization works, and teams carrying out a multi-year technology program.
  choose: Change one area at a time, starting where the pain and the payoff are greatest, and measure each phase before the next.
  next: Tell us what you want to be different in a year. We will map a first phase and what it would involve.
sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Work Area
    headline: Digital Transformation
    lead: Digital transformation is changing how an organization works by using technology well. Done sensibly, it happens in small phases, each tied to a measured result. This page shows what such a program looks like.
    ctas:
      - label: Discuss your transformation
        href: /contact/?service=consulting
      - label: See the phases
        href: "#phases"
    spec:
      kind: funnel
      stages:
        - title: The whole organization
          text: Every process, tool, and team.
        - title: What hurts most
          text: The areas with the biggest cost or delay.
        - title: One first phase
          text: A contained change with a clear measure.
        - title: Proven results
          text: Evidence that it worked.
        - title: The next phase
          text: Chosen with what was learned.
    purpose: transformation
    takeaway: Transformation narrows from the whole organization to one contained phase, then widens as results are proven.
    visualTitle: From the whole organization to one proven phase
    figureCaption: This diagram shows a transformation narrowing from the whole organization to one first phase with a clear measure, then widening as results are proven.
  - type: definition
    id: what-is
    tone: white
    label: In practice
    heading: Changing how work gets done
    answer: We help organizations change how work gets done with technology, not just buy new tools. That covers processes, systems, information, and the habits of the people who use them.
    paragraphs:
      - "The tools are the easy part. Most programs struggle with the human side: agreeing a process, moving people to a new way of working, and finishing the job of switching off the old one."
      - That is why we plan transformation as a series of small, owned changes, each with a measure of success, instead of one large program with a distant finish.
  - type: table
    id: areas
    tone: white
    label: Where change happens
    heading: Common areas of change
    caption: Common areas of digital transformation and what they involve
    columns:
      - Area
      - What changes
      - A sign you need it
    rows:
      - - Customer experience
        - How people find, buy from, and get help from you.
        - Customers complain about effort or delays.
      - - Operations
        - How work moves between people and systems.
        - Staff re-type data and chase approvals.
      - - Information
        - How data is stored, shared, and used for decisions.
        - Reports disagree or take days.
      - - Systems
        - Which software runs the business.
        - Old software holds back change.
      - - People and habits
        - How teams work with the new tools.
        - New tools sit unused.
  - type: diagram
    id: phases
    tone: paper
    label: The phases
    heading: How a program is staged
    intro: Staging keeps risk small and lets you learn along the way.
    spec:
      kind: flow
      steps:
        - title: Assess
          text: See what you have, what it costs, and where it hurts.
        - title: Prioritize
          text: Rank changes by payoff, effort, and risk.
        - title: Change one area
          text: Build or buy, connect, and train.
        - title: Measure
          text: Compare results with the starting point.
        - title: Decide the next step
          text: Continue, adjust, or stop.
    purpose: process
    takeaway: A staged program assesses, prioritizes, changes one area, measures, and then decides what to do next.
    caption: This diagram shows five steps of a staged program, from assessing what exists to deciding the next step after measuring.
  - type: callout
    id: limits
    tone: paper
    variant: limits
    title: What this is not
    paragraphs:
      - Transformation is not buying software and hoping. Without a clear process and an owner, new tools usually reproduce old problems at greater cost.
      - We say so early, and often recommend smaller changes than clients first expect.
  - type: callout
    id: scenario
    tone: white
    variant: illustrative
    title: A staged plan that starts with one process
    paragraphs:
      - A typical case is an organization with paper forms, several spreadsheets, and a twenty-year-old system that only one person understands. Leadership wants to modernize everything.
      - A staged plan could start with the one process that wastes the most time and replace its paper forms with a tracked workflow. It would then measure the saving, and use that evidence to plan the next phase and the eventual retirement of the old system.
  - type: related
    id: related
    tone: paper
    label: Related
    heading: Transformation across DECHY
    groups:
