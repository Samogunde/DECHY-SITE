  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about insurance software
    items:
      - q: How much does claims automation cost?
        a:
          A focused claims intake and document reading project usually costs $20,000 to $48,000 and takes 6
          to 10 weeks.
      - q: Will AI make claims decisions?
        a: No. AI reads and suggests. Your handlers decide, and every suggestion is logged with its source.
      - q: Can you work with our policy administration system?
        a: Usually, yes. We connect through its interfaces or build a controlled adapter around it.
      - q: Do you build for brokers as well as insurers?
        a:
          Yes. We build broker portals, comparison tools, and the integrations brokers need with several
          insurers.
      - q: How do you protect customer data?
        a:
          Data is encrypted, access is role-based and logged, and test environments never use real customer
          records.
      - q: How long does it take to launch an online quote journey?
        a:
          A quote and buy journey for one standard product usually takes 4 to 8 weeks, including pricing
          rules, payments, and policy documents.
  - type: technical
    id: technology
    tone: paper
    label: Technical depth
    heading: Technical notes for insurance
    intro: What your IT and claims leaders will ask about legacy systems, AI, and data.
    panels:
      - title: Legacy policy systems
        items:
          - We connect to existing policy and claims systems through their interfaces or a
            controlled adapter.
          - Changes roll out product by product, so nothing has to switch over at once.
      - title: AI with oversight
        items:
          - Document AI shows where each value came from, and handlers confirm it.
          - Accuracy is measured by document type and reported every month.
  - type: process
    id: how
    tone: white
    label: How we deliver
    heading: How we automate an insurance process
    intro: We usually automate one product or one claims type first, prove the time saved, and then
      extend the same pattern across the book.
    steps:
      - title: Measure the process
        body: We time each step of the process and find where documents and handoffs slow it down.
        artifacts:
          - Process timings
          - Bottleneck list
      - title: Design the automation
        body: We decide what software decides, what AI suggests, and what a person always reviews.
        artifacts:
          - Decision map
          - Review rules
      - title: Build and test on real cases
        body: We test against past policies and claims before anything goes live.
        artifacts:
          - Tested workflow
          - Accuracy report
      - title: Go live and tune
        body: We launch for one product or region, track speed and accuracy, and adjust.
        artifacts:
          - Live process
          - Tuning log
