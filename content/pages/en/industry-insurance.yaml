  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why insurance processes are ready for automation
    paragraphs:
      - Insurance is built on documents and decisions. A claim arrives as forms, photos, invoices,
        and emails, and someone retypes the details before anyone can decide anything. Quotes wait
        on manual checks. Brokers phone for status because no portal tells them.
      - Much of this work follows clear rules and can be automated safely. AI can read documents and
        suggest the details, while handlers review and decide. Rules engines can price standard
        risks instantly and refer the unusual ones.
      - We automate the routine and keep people in charge of the judgement calls.
      - Brokers and agents benefit as much as customers. When quotes, documents, and renewals live
        in a portal, brokers stop phoning for updates and place more business with you, because you
        are simply easier to work with than the insurer next door.
