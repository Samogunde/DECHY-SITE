id: page.work-business-web-platforms
kind: work-area
locale: en
path: /work/areas/business-web-platforms/
entityId: workarea.business-web-platforms
title: "Business Web Platforms We Build | DECHY"
description: "Business web platforms go beyond a brochure site: accounts, content, bookings, and tools in one place. Learn what they contain and how they are built."
breadcrumbLabel: Business Web Platforms
parent: /work/
intent:
  primary: business web platforms
  secondary:
    - web application development
    - corporate website platform
indexing: index
claims: [company.name, company.descriptor]
datePublished: "2026-10-05"
dateModified: "2026-10-05"
schemaTypes: [WebPage, CollectionPage]
comprehension:
  what: "A business web platform is a website that does real work: it holds accounts, takes bookings or requests, manages content, and connects to your internal tools."
  problem: "A plain brochure site cannot take payments, manage customers, or keep content current, so staff handle these tasks by email and phone."
  audience: "Organizations whose website should do more than describe them, and teams that update content or serve customers online every day."
  choose: "Decide how much of your work should happen on the site, then build the smallest platform that covers it and can grow."
  next: "Tell us what visitors and staff should be able to do on your site. We will outline the parts needed and a sensible first release."

sections:
  - type: hero
    id: hero
    variant: service
    eyebrow: Work Area
    headline: Business Web Platforms
    lead: "A business web platform is a website that does work. Visitors can book, apply, pay, or sign in. Staff can manage content and requests without a developer. This page shows what such platforms contain and how we build them."
    support: "The scenario on this page is an illustration, not a client project."
    ctas:
      - { label: Talk to us about a platform, href: "/contact/?service=web-development" }
      - { label: See the difference, href: "#difference" }
    spec:
      kind: hub
      center:
        title: The platform
        text: One website, one set of accounts and content.
      spokes:
        - title: Public pages
          text: What visitors read and search.
        - title: Accounts
          text: Sign-in for customers, members, or staff.
        - title: Bookings and requests
          text: Forms that become tracked jobs.
        - title: Payments
          text: Taking money securely.
        - title: Content tools
          text: Staff update pages themselves.
        - title: Connections
          text: Links to your internal systems.
    purpose: system
    takeaway: "A business web platform is one website with public pages, accounts, requests, payments, content tools, and connections working together."
    visualTitle: "What a business web platform contains"
    figureCaption: "This diagram shows six parts of a business web platform, all connected to one shared site, accounts, and content."

  - type: definition
    id: what-is
    tone: white
    label: What it is
    heading: A website that carries the work
    answer: "A business web platform is a website built to do tasks as well as to inform. It can hold customer accounts, take bookings, process payments, and connect to your internal systems."
    paragraphs:
      - "Many organizations begin with a simple site and add tools one by one: a booking plugin here, a payment page there. The pieces rarely share information, and nobody can see the whole picture."
      - "A platform plans these parts together. A customer who books, pays, and returns sees one consistent experience, and staff see one record of what happened."

  - type: table
    id: difference
    tone: paper
    label: The difference
    heading: Brochure site or platform?
    intro: "Both are useful. The right one depends on what you want the site to do."
    caption: Comparison of a brochure website and a business web platform
    columns: [Question, Brochure site, Business platform]
    rows:
      - - What is it for?
        - "Telling people who you are and how to reach you."
        - "Letting people do things: book, pay, apply, sign in."
      - - Who updates it?
        - "Often a developer, or occasional staff."
        - "Staff, through content tools built for them."
      - - How does it connect to the business?
        - "Mostly it does not."
        - "It shares information with your internal systems."
      - - How much does it cost?
        - "Lower to build."
        - "Higher to build, with savings in staff time."

  - type: diagram
    id: journey
    tone: white
    label: A visitor's journey
    heading: How one request moves through a platform
    intro: "A good platform follows each request from the first click to the finished job."
    spec:
      kind: flow
      steps:
        - title: A visitor arrives
          text: They find a page that answers their question.
        - title: They take an action
          text: They book, apply, or request a quote.
        - title: The platform records it
          text: The request becomes a tracked item.
        - title: Staff respond
          text: The right person is alerted and acts.
        - title: The visitor is kept informed
          text: They see status and receive updates.
    purpose: workflow
    takeaway: "A platform turns a visitor's click into a tracked job that staff handle and the visitor can follow."
    caption: "This diagram follows a request through five steps, from a visitor arriving on the site to being kept informed of progress."

  - type: columns
    id: parts
    tone: paper
    label: What we build
    heading: Common parts, and what each is for
    columns:
      - title: Customer areas
        items:
          - "Secure sign-in and profiles."
          - "Order history, documents, and messages."
      - title: Staff tools
        items:
          - "Edit pages without code."
          - "See and manage requests in one list."
      - title: Business connections
        items:
          - "Send new requests to your accounting or customer records."
          - "Show live information, such as availability."
      - title: Quality
        items:
          - "Pages that load quickly on phones."
          - "Accessible to people using keyboards and screen readers."

  - type: callout
    id: scenario
    tone: white
    variant: illustrative
    title: An illustrative scenario
    paragraphs:
      - "Imagine a professional practice whose website lists services and a phone number. Appointments are made by phone, and clients email documents that staff file by hand."
      - "A platform could let clients book online, upload documents to a private area, and see the status of their matter. Staff would receive each booking as a task, with the documents attached."
      - "This is an example of the kind of platform, not a real client or result."

  - type: process
    id: process
    tone: paper
    label: How we work
    heading: How a platform is delivered
    steps:
      - title: Define what people must be able to do
        body: "We list the tasks for visitors and staff, and rank them by value."
        artifacts: [Task list, Priorities]
      - title: Design the journeys
        body: "We sketch each journey and test it with a few real users."
        artifacts: [Journey maps, Tested designs]
      - title: Build and connect
        body: "We build the site, the accounts, and the links to your systems."
        artifacts: [Working platform, Connections]
      - title: Launch and train
        body: "We move content across, check search visibility, and train your staff."
        artifacts: [Launch plan, Training notes]

  - type: related
    id: related
    tone: white
    label: Related
    heading: Platforms across DECHY
    groups:
      - title: The service behind this
        entityIds: [svc.web-development]
      - title: Related solutions
        entityIds: [sol.customer-portal-development, sol.booking-platforms, sol.saas-platforms]
      - title: Related work areas
        entityIds: [workarea.customer-portals, workarea.digital-products, workarea.commerce-systems]

  - type: cta
    id: contact-cta
    heading: Tell us what your site should do
    body: "Describe what visitors and staff should be able to do. We will outline the parts you need and a sensible first release."
    primary: { label: Talk to DECHY about a platform, href: "/contact/?service=web-development" }
