  - type: prose
    id: what
    tone: white
    label: What it means
    heading: A back end you rent instead of build
    paragraphs:
      - "Every app needs a back end: somewhere to keep accounts, store data, and send messages. Building one takes months and needs people to run it. Firebase offers the common parts as services you switch on, which is why a small team can have a working product in weeks."
      - Its database is built for live data. When one person changes something, other people's screens update without a refresh. That suits chat, collaboration, and field apps where a number on a phone must match the office.
      - The trade is control. Your data sits in a Google-defined structure, the way you query it is limited, and bills grow with how often the app reads and writes. None of this is a reason to avoid Firebase. It is a reason to design with the limits in view.
  - type: chooser
    id: choice
    tone: paper
    label: Where it fits
    heading: Is Firebase right for this product?
    intro: The answer usually depends on the shape of the data and on how fast you need a first version.
    question: What describes your product best?
    options:
      - label: A new app that must launch quickly
        when: A small team, a deadline, and data that is mostly simple records.
        get: A working product on Firebase, with sign-in, data, and notifications in place early.
        watch: Design the data for the questions you will ask later, not only for the first screen.
      - label: A live, shared experience
        when: Chat, shared lists, location tracking, or collaboration where screens must update at once.
        get: Live data that reaches every device, with little server code.
        watch: Read and write counts drive cost, so we design how often data is fetched.
      - label: Data with many relationships
        when: Orders, customers, products, and invoices that join in many ways, with reporting needs.
        get: A comparison with a relational database before you commit.
        watch: Joining and reporting across documents is awkward in Firebase.
      - label: An app already on Firebase that has outgrown it
        when: Bills have climbed, queries have become hard, or reporting cannot be done.
        get: A plan to move to a relational database in stages, with the app kept running.
        watch: Plan the data move before the app is large.
  - type: table
    id: options
    tone: white
    label: Options
    heading: Firebase compared with the alternatives
    caption: Firebase compared with other ways to give an app a back end
    columns:
      - Option
      - Suits
      - Trade-off
    rows:
      - - Firebase
        - Fast launches, mobile apps, real-time features, and products whose data is simple documents.
        - A fixed way of structuring and querying data, and costs that follow usage.
      - - "[Supabase](ref:plat.supabase)"
        - Products with relational data, and teams that want a standard database and the option to host it themselves.
        - A younger platform with a smaller set of ready-made services.
      - - Custom back end
        - Complex rules, heavy reporting, unusual data, or strict control of hosting and cost.
        - More to build and run, so slower to a first version.
      - - "[MongoDB](ref:tech.mongodb)"
        - Flexible documents with your own server code.
        - You build sign-in, storage, and live updates yourself.
  - type: columns
    id: dechy
    tone: paper
    label: What DECHY can do
    heading: Working with Firebase
    columns:
      - title: Build
        items:
          - Apps on [Flutter](ref:tech.flutter), [React Native](ref:tech.react-native), or the web with Firebase behind them.
          - Security rules that decide who can read and write what.
      - title: Design
        items:
          - Data structures built for the questions you will ask.
          - Cost estimates based on realistic read and write counts.
      - title: Connect
        items:
          - Links from Firebase to your accounting, customer records, and other systems.
          - Server functions for work the app should not do itself.
      - title: Move
        items:
          - Migration from Firebase to PostgreSQL-based systems when a product outgrows it.
          - Exporting data safely, with checks that nothing is lost.
  - type: technical
    id: technology
    tone: white
    label: Technical depth
    heading: How we build with Firebase
    intro: "The detail a technical reviewer will ask about: data model, security, cost and limits, and leaving."
    panels:
      - title: Data model
        items:
          - "Data is shaped around reads: copies are held where a screen needs them, rather than joined at read time."
          - Collections and documents are named and sized to keep queries cheap and indexes small.
          - Counters and totals are maintained by functions, not computed on the fly.
      - title: Security
        items:
          - Security rules are written and tested like code, because they are the only guard on the data.
          - Sign-in is tied to roles, and sensitive actions run in server functions.
          - Keys that identify the project are public by design, so protection comes from the rules, not from secrecy.
      - title: Cost and limits
        paragraphs:
          - Billing follows reads, writes, storage, and function use. We estimate a month of expected use, set budget alerts, and review the heaviest queries after launch.
      - title: Leaving
        paragraphs:
          - We keep business rules in code we own and avoid features that cannot be replaced, so moving to a relational database such as [PostgreSQL](ref:tech.postgresql) later is a planned task, not a rewrite.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about Firebase
    items:
      - q: Is Firebase only for prototypes?
        a: No. Many production apps run on it. It is best when the data is simple and live updates matter, and it needs care as data and traffic grow.
      - q: Will we be locked in?
        a: Some lock-in is real, since the database and rules are Google-specific. We reduce it by keeping logic in our own code and by planning an exit path from the start.
      - q: Firebase or Supabase?
        a: Firebase suits simple, live data and a quick start. Supabase suits relational data and teams that want a standard database. We compare them against your product.
      - q: How do we avoid surprise bills?
        a: By designing queries to read less, setting budgets and alerts, and reviewing usage after launch.
