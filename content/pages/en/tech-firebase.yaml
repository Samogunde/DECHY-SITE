comprehension:
  what: Firebase is a ready-made back end from Google. It gives an app sign-in, a database, file storage, hosting, and notifications without building a server.
  problem: Teams want to launch a mobile or web app quickly without building and running their own back end, but worry about cost, limits, and being locked in.
  audience: Founders and product teams building a mobile or web app, and owners of apps already running on Firebase.
  choose: Choose Firebase to reach a working product fast and for real-time features. Choose a conventional back end when your data is highly relational or you need to control costs and hosting.
  next: Tell us what the app does and how it will grow. We will say whether Firebase fits and how to set it up so you can leave later if you need to.
