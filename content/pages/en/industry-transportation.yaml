  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why transport operators move off phones and spreadsheets
    paragraphs:
      - Transport runs on thin margins. Every empty mile, missed slot, and wasted hour on the phone
        eats profit. Yet many operators still plan in spreadsheets, dispatch by phone, and learn
        about problems from an angry customer.
      - A connected system changes the day. Jobs arrive in one place, routes are planned with real
        constraints, drivers receive work on their phones, and everyone sees live status.
      - The same data keeps vehicles compliant and safe. Daily checks, defects, maintenance, and
        driver hours are recorded as the work happens, not reconstructed before an inspection.
      - We work with the telematics and tachograph systems you already use and build the operational
        layer they lack. You keep the hardware and contracts you already have, and gain the
        planning, apps, and visibility they never provided.
  - type: index
    id: needs
    tone: paper
    columns: 2
    label: What we build
    heading: Transportation software we build
    intro: Each part connects to your telematics and accounts, so data is captured once and used
      everywhere.
    items:
      - title: Booking and order intake
        body: Customer orders taken online or through connections with their systems.
      - title: Route and load planning
        body: Routes built around time windows, vehicle sizes, and driver hours.
      - title: Dispatch board
        body: Jobs assigned by drag and drop with live status from every vehicle.
      - title: Driver app
        body: Jobs, vehicle checks, proof of delivery, and messages on one phone app.
      - title: Customer tracking portal
        body: Live location and arrival times customers can check without calling.
      - title: Fleet maintenance and compliance
        body: Inspections, defects, servicing, and documents tracked for every vehicle.
  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about transport software
    items:
      - q: How much does fleet management software cost?
        a:
          A driver app with tracking usually costs $12,000 to $35,000. A full platform with planning and
          maintenance costs $50,000 to $120,000 or more.
      - q: Can you work with our telematics provider?
        a:
          Usually, yes. We read location and vehicle data from their systems and build the operations layer
          on top.
      - q: Can customers track their deliveries?
        a: Yes. Customers get a tracking link with live location and arrival estimates.
      - q: Do drivers need new phones?
        a: No. The app runs on standard iPhone and Android phones, including rugged models.
      - q: Can it handle vehicle checks and defects?
        a: Yes. Drivers complete daily checks in the app, and defects go straight to maintenance.
      - q: Can you connect to our accounts system?
        a:
          Yes. Completed jobs and proof of delivery flow into invoicing automatically. Fuel, tolls, and
          driver expenses can be captured in the same flow, so each job shows its true cost and
          margin when it is invoiced.
