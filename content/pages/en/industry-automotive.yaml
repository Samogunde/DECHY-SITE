    heading: Automotive software we build
    intro:
      Every tool reads from your dealer management system, so stock, customers, and service history
      stay consistent.
    items:
      - title: Dealer website
        body: Fast vehicle search, rich vehicle pages, and clear next steps on every car.
      - title: Live inventory feeds
        body: Stock and prices synced from your dealer system and published to your site and listing
          portals.
      - title: Lead routing
        body: Test drive and enquiry leads sent to the right salesperson instantly, with follow-up
          reminders.
      - title: Finance and trade-in
        body: Online finance applications and trade-in valuations that start the deal before the visit.
      - title: Service booking
        body: Workshop slots, recall checks, reminders, and courtesy cars booked online.
      - title: Customer app
        body: Vehicle history, service reminders, documents, and offers for every owner.
