  - type: faq
    id: faq
    tone: paper
    label: Common questions
    heading: Questions about automotive software
    items:
      - q: How much does a dealership website cost?
        a:
          A dealer website with live inventory usually costs $5,000 to $12,000 and launches in 2 to 3
          weeks.
      - q: Can you connect to our dealer management system?
        a: Usually, yes, through its interface or a stock export, so your website always shows real
          inventory.
      - q: Can customers book a service online?
        a: Yes. Customers choose a slot, add work and a courtesy car, and get reminders before the visit.
      - q: Can buyers apply for finance online?
        a:
          Yes. We build finance application and trade-in valuation tools that connect to your finance
          partners.
      - q: Do you build for dealer groups?
        a: Yes. Groups get one platform across brands and sites with central control and local pages.
      - q: Can you build an app for our customers?
        a:
          Yes. Owners get service history, reminders, documents, and offers in an app with your brand.
          Owners can book their next service from the app in a few taps.
