  - type: prose
    id: different
    tone: white
    label: What is different
    heading: Why automotive buyers need a better online experience
    paragraphs:
      - Most car buyers decide long before they visit. They compare stock, prices, and reviews
        online, then contact one or two dealers. If your website shows cars that have already sold,
        or a form that nobody answers, the buyer goes elsewhere.
      - "The fix is live inventory from your dealer system, clear prices, and simple next steps:
        book a test drive, value a trade-in, or check finance. Every lead lands with the right
        salesperson within minutes."
      - After the sale, service is where loyalty and profit live. Online booking, reminders, and a
        customer app with the vehicle's history keep customers coming back to your workshop.
      - Dealer groups gain one platform across brands and sites, with central control over stock,
        offers, and lead routing, and clear reports on which channels sell.
