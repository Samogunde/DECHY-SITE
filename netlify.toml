# Netlify configuration. The Next.js runtime is detected automatically.
# Required site settings (never committed): see .env.example. The contact form needs
# CONTACT_DELIVERY and its provider variables set in Netlify's environment settings.

[build]
  command = "node scripts/netlify-build.mjs"
  publish = ".next"
  # Builds only the production branch, never pull request previews or doc-only changes.
  ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The netlify.app address sends visitors to the main address (owner, 25 October 2026). Deploy
# previews and branch deploys use their own hostnames and are not affected.
[[redirects]]
  from = "https://dechy-site.netlify.app/*"
  to = "https://www.dechytech.com/:splat"
  status = 301
  force = true
