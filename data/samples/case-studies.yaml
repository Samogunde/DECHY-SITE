# Sample case study pages (review builds only; owner direction, 20 October 2026).
# One page per sample case in proof.yaml, matched by title. The companies, people, quotes, and
# figures are invented for layout and are replaced with real projects when the owner supplies them.
# Pages live at /work/case-studies/<slug>/, render only when DECHY_SHOW_DRAFTS=true, are noindex,
# and never reach the live site, the sitemap, structured data, or the assistant.

cases:
  - slug: field-operations-platform
    title: One system for jobs, crews, and invoices across four regions
    service: software-development
    industry: ind.property-management
    company: Northpeak Facilities
    duration: 10 weeks
    challenge: Northpeak ran 120 engineers across four regions from spreadsheets,
      phone calls, and a paper job sheet. Jobs were double-booked, parts were
      missing on arrival, and invoices went out weeks after the work was done.
    approach:
      - We spent the first week with dispatchers and engineers, mapping every
        step from the customer call to the paid invoice.
      - We designed one dispatch board, one engineer app, and one billing flow,
        and tested them with the team before building.
      - We released in three stages so each region moved over without stopping
        work.
    delivered:
      [
        Dispatch board with drag-and-drop scheduling,
        Engineer app with offline job sheets and photos,
        Automatic invoices on sign-off,
        Live reports by region and engineer,
      ]
    stack: [fw.nextjs, lang.typescript, tech.nodejs, tech.postgresql, tech.react-native, plat.aws]
    quote: { text: "We run four regions from one screen now. Invoices go out the same day,
          and nobody asks where a job is anymore.", name: Grace Whitmore, role: Operations Director }

  - slug: member-portal
    title: A member portal that replaced email renewals and paper forms
    service: software-development
    industry: ind.professional-services
    company: Institute of Practice Managers
    duration: 9 weeks
    challenge: Renewals, event bookings, and certificates were handled by email and
      paper forms. Staff spent the first month of every year chasing payments
      and retyping details.
    approach:
      - We grouped every member task into three journeys, renew, book, and
        download, and designed each in under five screens.
      - We connected payments and the existing member database so nothing had to
        be entered twice.
      - We migrated twelve years of member records and tested renewals with
        fifty members before launch.
    delivered:
      [
        Member accounts with renewals and receipts,
        Event booking with capacity and waitlists,
        Certificate downloads,
        Staff console with search and reports,
      ]
    stack: [fw.nextjs, lang.typescript, tech.postgresql, int.stripe, plat.vercel]
    quote:
      {
        text: "Renewal season used to take over the office. This year it ran itself.",
        name: Helen Carter,
        role: Membership Manager,
      }

