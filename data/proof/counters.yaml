# The proof strip under the home hero, repeated on About us and every service page in the same
# wording (owner, 21 October 2026). Values come from the Approved Facts Register ({{fact:...}}) or
# from the site's own data (certifications are counted from data/certifications). A counter with
# no approved value is not shown. Projects delivered and countries served were supplied by the
# owner on 21 October 2026.
#
# href: where the counter links; fallback: used when that page or section is not published.
counters:
  - id: clients
    label: Happy clients
    value: "{{fact:company.clients}}"
    href: /testimonials/
    fallback: /work/
    faces: true
  - id: projects
    label: Projects delivered
    value: "{{fact:company.projects}}"
    href: /work/
  - id: team
    label: Engineers and designers
    value: "{{fact:company.team}}"
    href: /company/#team
    fallback: /company/
  - id: countries
    label: Countries served
    value: "{{fact:company.countries}}"
    href: /locations/
  - id: certifications
    label: Certifications
    value: "{{count:certifications}}"
    href: /company/certifications/

# One sentence on team size and what it means for the client.
team: "Every project gets its own squad from our {{fact:company.team}} engineers and designers: a project lead, a product designer, and engineers matched to your stack, with the same people from kickoff to launch."
