        id: sol.legacy-system-modernization,
        summary: "Old software that is hard to change and risky to leave.",
      }
    - { id: sol.cloud-migration, summary: "Moving systems to the cloud without a stoppage." }
    - { id: sol.crm-integration, summary: "A customer record that agrees across every tool." }
