# Approved navigation (DEC-10, extended by ADR 0005). An item whose page does not exist yet renders
# as plain text, never as a dead link, a fake route, or a "coming soon" page. When the page is built
# it becomes a link automatically because the item's path matches a published page.
#
# Item kinds
#   services      label links to the Services hub; a chevron opens the grouped services menu
#   technologies  label links to the directory; a chevron opens the category rail and panel
#   work          label links to the Work hub; a chevron opens the grouped "What we build" menu
#   link          a plain link
primary:
  - { label: Services, kind: services, path: /services/ }
  - { label: Solutions, kind: solutions, path: /solutions/ }
  - { label: Technologies, kind: technologies, path: /technologies/ }
  - { label: Industries, kind: industries, path: /industries/ }
  - { label: Work, kind: work, path: /work/ }
  - { label: Resources, kind: link, path: /resources/ }
  - { label: Company, kind: link, path: /company/ }
cta:
  label: Talk to DECHY
  path: /contact/

# Technologies menu and directory. Order is editorial (commercial relevance, then search intent),
# never alphabetical. Every technology page must appear in exactly one category (a validator
# enforces it). The menu shows the first `menuLimit` published items of a category; the rest stay
# reachable through "All technologies in this category" and the directory. Entity-only technologies
# are never listed here: only public pages are destinations.
technologies:
  menuLimit: 10
  categories:
    - id: web
      label: Web & CMS
      summary: Frameworks, languages, and content platforms for sites and web applications.
      items:
        [
          fw.nextjs,
          fw.react,
          lang.typescript,
          plat.wordpress,
          plat.webflow,
          plat.wix,
          plat.wix-studio,
          plat.squarespace,
          plat.drupal,
          lang.php,
          fw.vue,
          fw.angular,
        ]
    - id: backend
      label: Languages & Backend
      summary: Languages and runtimes for servers, services, and data work.
      items: [lang.python, tech.nodejs, lang.java, tech.dotnet, lang.go]
    - id: mobile
      label: Mobile
      summary: Native and cross-platform ways to build iPhone and Android apps.
      items: [tech.flutter, tech.react-native, tech.swift, tech.kotlin]
    - id: ai
      label: AI & Machine Learning
      summary: Model providers and the framework that connects them to your systems.
      items: [prov.openai, prov.anthropic-claude, prov.google-gemini, fw.langchain]
    - id: automation
      label: Automation & Business Platforms
      summary: Workflow tools and customer platforms that move work between systems.
      items:
        [
          plat.hubspot,
          plat.salesforce,
          tech.zapier,
          tech.make,
          tech.n8n,
          plat.airtable,
          tech.microsoft-power-automate,
          plat.microsoft-365,
        ]
    - id: cloud
      label: Cloud & DevOps
      summary: Clouds, containers, and infrastructure as code.
      items:
        [
          plat.aws,
          plat.azure,
          plat.google-cloud,
          tool.docker,
          tool.kubernetes,
          tool.terraform,
          plat.firebase,
          plat.supabase,
          plat.cloudflare,
        ]
    - id: data
      label: Data & Databases
      summary: Databases for applications and reporting.
      items: [tech.postgresql, tech.mysql, tech.mongodb, tech.bigquery, plat.snowflake]
    - id: commerce
      label: Commerce & Payments
      summary: Platforms for selling online and taking payments.
      items: [plat.shopify, plat.woocommerce, plat.bigcommerce, int.stripe, int.paypal]

