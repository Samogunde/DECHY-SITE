        Each of these connects to your existing core through a controlled layer, so new journeys go
        live without touching the system that holds the money.
    steps:
      heading: How we modernize a banking journey
      items:
        - - Choose the journey
          - We agree one journey with clear value, such as account opening, and measure it today.
          - - Journey baseline
            - Success measures
