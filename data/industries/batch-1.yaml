    tech:
      heading: Technical notes for field service
      intro: What to know about offline apps, maps, and accounting links.
      panels:
        - - Apps that work anywhere
          - - Technician apps keep jobs on the phone and sync when signal returns.
            - Photos and signatures are attached to the job and stored securely.
        - - Maps and accounts
          - - Routes and travel times use mapping services to plan realistic days.
            - Invoices and payments flow into accounting tools such as QuickBooks or Xero without
              rekeying.
    faq:
      heading: Questions about field service software
      items:
        - - How much does field service software cost?
          - A technician app with dispatch and invoicing usually costs $12,000 to $30,000 and takes
            4 to 8 weeks.
        - - Why not buy an off-the-shelf tool?
          - Many companies should, and we will say so. We build when your trade, pricing, or
            workflow does not fit the packaged tools.
        - - Can customers book online?
          - Yes. Customers choose a service and a real slot, and dispatch sees the job instantly.
        - - Can technicians take payments?
          - Yes. Technicians take card payments on site, and the invoice is marked paid
            automatically.
        - - Does it work for franchise networks?
          - Yes. Each franchise runs its own jobs, and the owners see performance across the whole
            network.
        - - Can customers track the technician on the way?
          - Yes. Customers get a text when the technician is on the way, with an arrival estimate,
            which cuts calls and missed appointments.
