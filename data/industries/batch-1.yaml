    why:
      heading: Why banking modernization works best in steps
      paragraphs:
        - Banks carry decades of systems that still work and still hold the money. Replacing them
          all at once is expensive and risky, and many such projects stall. Meanwhile customers
          compare your app with the best ones on their phone.
        - We take a different path. We pick one journey, build a modern front end and the services
          behind it, and connect it to the core through a controlled layer. Each release is
          reviewed, tested, and reversible.
        - Customers feel the improvement within months, and your risk team sees evidence at every
          step.
        - Our role is to make each step small enough to approve and safe enough to undo. Your teams
          keep ownership of the core, the data, and the decisions, and we leave behind code, tests,
          and documentation they can run without us.
    needs:
      heading: Banking software we build
      items:
        - - Mobile and online banking
          - Balances, transfers, cards, and statements in an app customers rate highly.
        - - Digital account opening
          - Identity checks and account setup in one sitting, with a handoff to staff when needed.
        - - Loan origination tools
          - Applications, document collection, decisions, and offers that move in days, not weeks.
        - - Staff servicing console
          - One screen for customer details, requests, and history, so calls end sooner.
        - - Integration layer
          - A controlled connection between new apps and the core, with logging and limits.
        - - Management reporting
          - Accurate daily figures for leaders and regulators, from one agreed set of definitions.
