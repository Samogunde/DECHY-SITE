      headline: Digital banking that customers enjoy and auditors approve
      lead:
        We build the apps, onboarding flows, and staff tools your customers judge you by, and connect
        them safely to the core systems you already run. You modernize one journey at a time,
        without a risky big-bang replacement.
      center:
        - The core system
        - Stays the source of truth.
      spokes:
        - - Mobile banking
          - Accounts and payments.
        - - Account opening
          - Online in minutes.
        - - Lending
          - Applications and decisions.
        - - Staff tools
          - Servicing and support.
        - - Notifications
          - Alerts customers want.
        - - Reporting
