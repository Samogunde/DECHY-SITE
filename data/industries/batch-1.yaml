    faq:
      heading: Questions about salon software
      items:
        - - How much does a salon booking website cost?
          - Most booking websites cost $2,500 to $6,000 and launch in 1 to 3 weeks. A branded app
            with loyalty usually adds $8,000 to $20,000.
        - - Can we keep the booking system we already pay for?
          - Yes, if it has an open connection. We can build your website and app on top of it, or
