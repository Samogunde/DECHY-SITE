        audiences and recurring revenue. Pages load instantly under traffic spikes, readers
        subscribe in a minute, and editors publish without fighting the system.
      center:
        - Every reader
        - From first visit to subscriber.
      spokes:
        - - Publishing site
          - Fast under any traffic.
        - - Editorial tools
          - Write
          - edit
          - schedule.
        - - Subscriptions
          - Paywalls and plans.
        - - Newsletters
          - Direct to the inbox.
        - - Podcasts and video
          - Players and feeds.
        - - Audience data
          - What readers value.
      takeaway: Media platforms turn visitors into subscribers when publishing, subscriptions,
        newsletters, audio, video, and audience data share one reader record.
      visual: The platform around a reader
      caption:
        This diagram shows a reader record at the center with the publishing site, editorial tools,
        subscriptions, newsletters, podcasts and video, and audience data around it.
    why:
      heading: Why publishers are rebuilding around readers
      paragraphs:
        - For years, media grew on page views and advertising. Those rates keep falling, and
          platforms control more of the traffic. Publishers that thrive now earn directly from
          readers through subscriptions, memberships, events, and newsletters.
        - That shift needs different technology. Paywalls must be smart enough to convert without
          driving people away. Accounts, payments, and newsletters must work as one. Pages must stay
          fast when a story spreads.
        - "Editors need tools that keep up with the news: drafting, editing, scheduling, and
          publishing to web, apps, and newsletters from one place."
        - We build on modern headless content systems, which separate writing from presentation, so
          your team can publish everywhere while readers get a fast, clean experience.
        - We also help with the business side of the platform. Clear dashboards show which sections,
          authors, and formats bring subscribers, so editorial and commercial teams can plan
          together from the same numbers instead of arguing over different reports.
    projects:
      intro: Publishers usually start with the site and subscriptions, then add audio, video, and apps.
      rows:
        - - Publishing website rebuild
          - Fast templates, content migration, and search setup
          - $6,000 to $16,000
          - 2 to 4 weeks
        - - Subscriptions and paywall
          - Plans, metering, accounts, payments, and offers
          - $8,000 to $24,000
          - 3 to 5 weeks
        - - Podcast or video platform
          - Players, feeds, members-only content, and analytics
          - $12,000 to $28,000
          - 4 to 6 weeks
        - - Full media platform with apps
          - Editorial system, subscriptions, newsletters, and apps
          - $32,000 to $80,000+
          - 2 to 4 months
    needs:
      heading: Media and publishing software we build
      intro: Each piece shares one reader account, so subscriptions, newsletters, and content work
        together.
      items:
        - - Publishing website
          - Fast article pages, section fronts, and search that rank well and stay up under spikes.
        - - Headless editorial system
          - Write once and publish to web, apps, and newsletters, with roles and scheduling.
        - - Subscriptions and paywalls
          - Metered or hard paywalls, plans, gifts, and offers tested against conversion.
        - - Newsletters
          - Sign-up, segments, and automated editions from your published stories.
        - - Podcast and video hubs
          - Players, episode pages, feeds, and members-only content.
        - - Audience dashboards
          - Which stories bring subscribers, and which readers are at risk of leaving.
    steps:
      heading: How we build media platforms
      intro:
        A rebuilt publishing site usually launches in two to four weeks, with subscriptions close
        behind.
      items:
        - - Study the readers
          - We look at how readers arrive, what they read, and where they subscribe or leave.
          - - Audience review
            - Conversion points
        - - Model the content
          - We structure stories, authors, and sections so content can travel to every channel.
          - - Content model
            - Migration plan
        - - Build for speed
          - We build pages that load fast and stay fast during traffic spikes.
          - - Performance budget
            - Load test
        - - Launch subscriptions
          - We launch plans and the paywall, then test offers to improve conversion.
          - - Subscription flow
            - Offer tests
    help:
      heading: What publishers get from us
      intro:
        Publishers see the change in page speed, editorial calm, and a growing number of readers who
        pay directly.
      cols:
        - - Reader revenue
          - - Subscriptions that convert.
            - Offers you can test.
        - - Speed
          - - Pages that load instantly.
            - Stable under spikes.
        - - Editorial calm
          - - Publish everywhere at once.
            - Scheduling and roles.
        - - Audience insight
          - - Stories that convert.
            - Readers at risk of leaving.
    tech:
      heading: Technical notes for media platforms
      intro: What your product and engineering leads will ask about content systems, caching, and
        payments.
      panels:
        - - Content and caching
          - - We use headless content systems such as Sanity, Strapi, or WordPress with a modern
              front end.
            - Pages are cached at the network edge so traffic spikes do not slow the site.
        - - Subscriptions and access
          - - Subscriptions run through Stripe or your existing provider, with accounts shared
              across web and apps.
            - Paywall rules are configurable by section, story, and reader.
    faq:
      heading: Questions about media and publishing platforms
      items:
        - - How much does a publishing platform cost?
          - A rebuilt publishing site usually costs $6,000 to $16,000. Adding subscriptions and a
            paywall usually costs $8,000 to $24,000.
        - - Can you migrate our archive?
          - Yes. We move articles, images, authors, and URLs, with redirects so search rankings
            carry over.
        - - Will the site stay up when a story goes viral?
          - Yes. Pages are cached at the edge and tested for high traffic before launch.
        - - Can readers pay for podcasts or video?
          - Yes. Members-only episodes and videos are unlocked by the same subscription as articles.
        - - Do you build newsletters?
          - Yes. Sign-ups, segments, and automated editions connect to your stories and subscriber
            accounts.
        - - Can we keep WordPress?
          - Often, yes. We can use WordPress as the editorial system with a faster front end in
            front of it. Readers manage their own subscription and newsletter preferences from one
            account.
