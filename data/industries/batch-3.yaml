# Industry page copy (owner direction, 20 October 2026). One entry per industry, each written for
# that industry. scripts/build-industry-pages.mjs turns these into content/pages/en/industry-*.yaml.
industries:
  - slug: recruitment
    entity: ind.recruitment
    name: HR and recruitment
    service: software-development
    title: Recruitment and HR Software Development | DECHY
    description:
      "Recruitment and HR software from DECHY: job boards, applicant tracking, candidate and
      client portals, onboarding, and AI screening tools."
    intent:
      - recruitment software development
      - applicant tracking system development
      - hr software development
    comprehension:
      what:
        We build job boards, applicant tracking, candidate and client portals, onboarding, timesheets,
        and AI-assisted screening for recruiters and HR teams.
      problem:
        Candidates apply and hear nothing, recruiters copy details between job boards, inboxes, and
        spreadsheets, and clients chase updates by phone.
      audience: Recruitment agencies, staffing firms, in-house talent teams, HR departments, and HR
        technology startups.
      choose:
        Start with applicant tracking and a candidate portal if speed to placement matters, or with
        onboarding and timesheets if you place temporary staff.
      next: Tell us how candidates move from application to placement. We reply with a plan, a price
        range, and a timeline.
    hero:
      headline: Recruitment and HR software that places people faster
      lead:
        We build the job boards, applicant tracking, and portals that move candidates from application
        to first day without the email chaos. Recruiters spend time with people instead of
        spreadsheets, candidates always know where they stand, and clients see progress without
        calling.
      center:
        - Every candidate
        - From application to first day.
      spokes:
        - - Job board
          - Your roles
          - your brand.
        - - Applicant tracking
          - Every stage in view.
        - - Screening
          - Faster shortlists.
        - - Client portal
          - Shortlists and feedback.
        - - Onboarding
          - Documents and checks.
        - - Timesheets
          - Hours and invoices.
      takeaway: Recruitment software follows each candidate from application to first day, with job
        boards, tracking, screening, client portals, onboarding, and timesheets sharing one record.
      visual: The journey of a candidate
      caption:
        This diagram shows a candidate record at the center with the job board, applicant tracking,
        screening, client portal, onboarding, and timesheets around it.
    why:
      heading: Why recruiters need their own platform
      paragraphs:
        - Recruitment is a speed business. The best candidates are off the market within days, and
          the agency that shortlists first usually places. Every hour spent copying a CV between
          systems is an hour a competitor uses.
        - Off-the-shelf applicant tracking tools cover the basics, but many agencies bend their
          process to fit them. A platform built around your desks, sectors, and clients lets
          recruiters work the way they win.
        - Candidates notice the difference too. A clear application, status updates, and a simple
          portal for documents turn a stressful search into a good experience, and good experiences
          become referrals.
        - We add AI where it saves time without making decisions about people. It can summarize CVs,
          suggest matches, and draft messages, while recruiters always make the call.
        - The result is a desk that runs on one system. Recruiters see every candidate, client, and
          role in one place, managers see which desks and sources produce placements, and the
          business can grow without adding administrators for every new recruiter.
    projects:
      intro: Most agencies and HR teams start with tracking and a portal, then automate onboarding.
      rows:
        - - Branded job board
          - Job listings, search, applications, and alerts
          - $4,000 to $10,000
          - 2 to 3 weeks
        - - Applicant tracking system
          - Pipelines, notes, emails, and client shortlists
          - $16,000 to $36,000
          - 5 to 8 weeks
        - - Onboarding and timesheets
          - Documents, checks, timesheets, and invoicing
          - $12,000 to $28,000
          - 4 to 6 weeks
        - - Full recruitment platform with AI screening
          - Job board, tracking, portals, onboarding, and AI tools
          - $40,000 to $80,000+
          - 2 to 4 months
    needs:
      heading: Recruitment and HR software we build
      intro: Every tool shares one candidate and one client record, so nobody types the same details
        twice.
      items:
        - - Job board and careers site
          - Your roles on a fast, search-friendly site with simple applications from a phone.
        - - Applicant tracking
          - Pipelines by role and desk, with notes, emails, and interview scheduling in one place.
        - - Candidate portal
          - Application status, documents, interview details, and offers in one secure place.
        - - Client portal
          - Shortlists, feedback, interview booking, and placement status for hiring managers.
        - - Onboarding and compliance
          - Right-to-work checks, contracts, and documents collected before the first day.
        - - Timesheets and invoicing
          - Hours approved by clients and turned into pay and invoices automatically.
    steps:
      heading: How we build recruitment software
      intro: A branded job board launches in two to three weeks, and tracking and portals follow in
        stages.
      items:
        - - Map the desk
          - We follow a role from brief to placement and count every manual step.
          - - Process map
            - Time per stage
        - - Design for speed
          - We design pipelines and portals around the fastest path to a shortlist.
          - - Prototype
            - Pipeline stages
        - - Connect the boards
          - We connect job boards, email, and calendars so candidates arrive in one place.
          - - Integrations
            - Candidate import
        - - Add AI with care
          - We add AI summaries and matching once the data is clean, with recruiters in control.
          - - AI assistant
            - Review rules
    help:
      heading: What recruiters and HR teams get from us
      intro:
        Recruiters feel the change in hours saved each week, and candidates and clients notice how
        much faster and clearer every step has become.
      cols:
        - - Faster placements
          - - Shortlists in hours.
            - Interviews booked automatically.
        - - Better candidate experience
          - - Status updates without chasing.
            - Documents uploaded once.
        - - Happier clients
          - - Shortlists in a portal.
            - Feedback captured in one click.
        - - Less admin
          - - No copying between systems.
            - Timesheets that invoice themselves.
    tech:
      heading: Technical notes for recruitment platforms
      intro: What to know about job boards, personal data, and AI.
      panels:
        - - Job boards and calendars
          - - We post to job boards and import applications through their interfaces.
            - Interviews are scheduled against real calendar availability.
        - - Personal data and AI
          - - Candidate data is access-controlled, retained only as long as needed, and deletable on
              request.
            - AI summarizes and suggests, and every hiring decision stays with a person.
    faq:
      heading: Questions about recruitment software
      items:
        - - How much does an applicant tracking system cost?
          - A custom applicant tracking system usually costs $16,000 to $36,000 and takes 5 to 8
            weeks. A full platform with portals and AI costs more.
        - - Can you connect to the job boards we use?
          - Usually, yes. We post roles and import applications through job board interfaces where
            they offer them.
        - - Will AI decide who gets hired?
          - No. AI helps summarize and match, but recruiters and hiring managers make every decision.
        - - Can clients see shortlists online?
          - Yes. Clients get a portal for shortlists, feedback, and interview booking.
        - - Can it handle temporary staff and timesheets?
          - Yes. Workers submit hours, clients approve them, and pay and invoices are created
            automatically.
        - - How do you protect candidate data?
          - Access is role-based, data is encrypted, and retention rules delete records when they
            are no longer needed.
    related:
      services:
        - svc.software-development
        - svc.ai
        - svc.automation
        - svc.web-development
      work:
        - workarea.customer-portals
        - workarea.workflow-automation
        - workarea.ai-solutions
      tech:
        - fw.nextjs
        - lang.python
        - tech.postgresql
        - prov.anthropic-claude
    cta:
      heading: Tell us how candidates reach placement
      body: Share your desks, tools, and clients. We reply with a plan, a price range, and a timeline.
      label: Plan recruitment software
  - slug: legal
