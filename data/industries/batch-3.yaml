        automation if drafting time is the cost.
      next: Tell us which tasks take your team the most unbilled time. We reply with a plan, a price
        range, and a timeline.
    hero:
      headline: Legal software that gives lawyers their hours back
      lead:
        We build the intake, portals, and document automation that take routine work off your lawyers'
        desks. Clients get answers and updates without calling, standard documents draft themselves,
        and fee earners spend their time on advice.
      center:
        - Every matter
        - Client, documents, deadlines, and fees.
      spokes:
        - - Client intake
          - Online and conflict-checked.
        - - Client portal
          - Updates and documents.
        - - Document automation
          - Drafts in minutes.
        - - Matter management
          - Tasks and deadlines.
        - - AI tools
          - Research and summaries.
        - - Billing
          - Time and invoices.
      takeaway:
        Legal software organizes every matter so intake, the client portal, documents, deadlines,
        AI tools, and billing share one record.
      visual: The systems around a legal matter
      caption:
        This diagram shows a matter record at the center with client intake, the client portal,
        document automation, matter management, AI tools, and billing around it.
    why:
      heading: Why law firms are rethinking routine work
      paragraphs:
        - Much legal work is repeatable. Intake questions, engagement letters, standard agreements,
          and status updates follow patterns, yet they are still typed by people whose time is worth
          hundreds an hour.
        - Automating that work does not replace lawyers. It removes the parts clients do not want to
          pay for, so fixed fees become profitable and fee earners spend their day on judgement.
        - Clients expect the same convenience they get from their bank. A secure portal for
          documents, updates, and payments builds trust and cuts the calls that interrupt focused
          work.
        - Confidentiality shapes every decision we make. Access is strict, actions are logged, and
          AI tools are configured so client information is never used to train outside models.
        - Most firms do not need a huge program to see results. One well-chosen automation, such as
          intake for a busy practice area or templates for its most common documents, often frees
          enough time in the first quarter to fund the next step.
    projects:
      intro: Firms usually start with intake or document automation, then add the portal.
      rows:
        - - Online intake and booking
          - Questionnaires, conflict checks, and consultation booking
          - $4,000 to $10,000
          - 2 to 3 weeks
        - - Document automation
          - Templates, question flows, and drafts for standard documents
          - $8,000 to $24,000
          - 3 to 5 weeks
        - - Secure client portal
          - Documents, updates, messages, and payments
          - $12,000 to $28,000
          - 4 to 6 weeks
        - - Matter platform with AI tools
          - Matters, deadlines, AI research and summaries, and billing links
          - $32,000 to $72,000+
          - 2 to 3 months
    needs:
      heading: Legal software we build
      intro:
        Each tool connects to the practice management system you already use, so matters and time
        stay in one place.
      items:
        - - Client intake
          - Online questionnaires that collect facts, run conflict checks, and book consultations.
        - - Secure client portal
          - Documents, updates, signatures, and payments in one place clients can trust.
        - - Document automation
          - Standard documents drafted from a short set of questions, ready for lawyer review.
        - - Matter and deadline tracking
          - Tasks, key dates, and reminders so nothing important slips.
        - - AI research and summaries
          - Long documents summarized and key terms extracted, with sources shown.
        - - Fixed-fee and billing tools
          - Packaged services, online payment, and time captured against each matter.
    steps:
      heading: How we build legal technology
      intro: Most firms see their first automated documents or online intake within a month.
      items:
        - - Find the repeat work
          - We list the tasks your team repeats and time how long each takes.
          - - Task inventory
            - Time study
        - - Turn templates into flows
          - We convert your best precedents into question-led templates lawyers approve.
          - - Template library
            - Review rules
        - - Build the client side
          - We build intake and the portal so clients self-serve the common requests.
          - - Portal
            - Intake forms
        - - Add AI carefully
          - We add AI tools with strict data controls and lawyer review on every output.
          - - AI tools
            - Data controls
    help:
      heading: What law firms get from us
      intro:
        Firms see the benefit in fewer interruptions, faster turnaround on standard work, and fixed
        fees that finally make money.
      cols:
        - - More billable time
          - - Routine drafting automated.
            - Fewer status calls.
        - - Better client service
          - - Updates in a portal.
            - Documents signed online.
        - - Profitable fixed fees
          - - Standard work packaged.
            - Paid online.
        - - Lower risk
          - - Deadlines tracked.
            - Every action logged.
    tech:
      heading: Technical notes for legal teams
      intro: What your IT and risk partners will ask about confidentiality, systems, and AI.
      panels:
        - - Confidentiality and access
          - - Documents are encrypted, access is role-based, and every view is logged.
            - Data location is chosen to meet your professional and client obligations.
        - - Systems and AI
          - - We connect to practice management and document systems through their interfaces.
            - AI providers are configured so client data is not retained or used for training.
    faq:
      heading: Questions about legal software
      items:
        - - How much does legal document automation cost?
          - Document automation for a set of standard documents usually costs $8,000 to $24,000 and
            takes 3 to 5 weeks.
        - - Will AI give legal advice to our clients?
          - No. AI helps your lawyers summarize and draft, and a lawyer reviews everything before it
            reaches a client.
        - - Can you connect to our practice management system?
          - Usually, yes, through its interfaces, so matters, contacts, and time stay in one place.
        - - Is client data safe in a portal?
          - Yes. Data is encrypted, access is strictly controlled, and every action is logged.
        - - Do you work with in-house legal teams?
          - Yes. In-house teams use our intake, contract automation, and request tracking to handle
            business requests faster.
        - - Can clients sign documents online?
          - Yes. Clients can review and sign documents in the portal using established e-signature
            services. Signed documents are filed against the matter automatically, so nobody has to
            download and upload them again.
    related:
      services:
        - svc.software-development
        - svc.ai
        - svc.automation
        - svc.cybersecurity
      work:
        - workarea.customer-portals
        - workarea.knowledge-and-content-systems
        - workarea.ai-solutions
      tech:
        - lang.python
        - prov.anthropic-claude
        - plat.azure
        - plat.microsoft-365
    cta:
      heading: Tell us where your team loses unbilled hours
      body: Share the tasks and systems involved. We reply with a plan, a price range, and a timeline.
