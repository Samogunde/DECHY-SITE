      - name: Salesforce Certified B2C Commerce Developer
        issuer: Salesforce
        file: salesforce-certified-b2c-commerce-developer.png
        text: Shows the ability to build and customize online stores on Salesforce B2C Commerce Cloud.
      - name: Microsoft 365 Certified Developer Associate
        issuer: Microsoft
        file: microsoft-365-certified-developer-associate.png
        text: Proves the skill to build apps and integrations across Microsoft 365, Teams, and Microsoft Graph.
      - name: Zoho Creator Certified Developer Associate
        issuer: Zoho
        file: zoho-creator-certified-developer-associate.png
        text: Shows the ability to build custom business apps and workflows on Zoho Creator.
      - name: Edchart Certified Flutter Developer, Subject Matter Expert
        issuer: Edchart
        file: edchart-certified-flutter-developer.png
        text: Shows expert-level Flutter skill for building one app that runs on both iPhone and Android.

  - id: security
    label: Security
    summary: Security knowledge that shapes every system we build.
    items:
      - name: Google Cybersecurity Certificate and CompTIA Security+
        issuer: Google and CompTIA
        file: google-cybersecurity-certificate-comptia-security-plus.png
