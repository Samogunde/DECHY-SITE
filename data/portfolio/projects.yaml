projects:
  - slug: claimbridge-insurance-claims-platform
    title: ClaimBridge
    headline: An insurance claims platform that settles claims in days, not weeks
    service: software-development
    services: [software-development, ai, automation]
    industry: ind.insurance
    client: A regional property and auto insurer
    images: [claimbridge-insurance-claims-dashboard]
    duration: 10 weeks
    goal: Replace email, spreadsheets, and a legacy claims tool with one platform where every claim moves from intake to settlement with clear owners and deadlines.
    problem: Claims handlers retyped details from forms and photos, documents went missing between teams, and customers phoned daily for updates. The average claim took 21 days to settle and the backlog kept growing.
    solution: We built ClaimBridge, a claims platform with a five-step workflow from intake to closure, AI document verification that checks IDs, photos, and repair estimates, quick actions for adjusters, and live claim status for every customer.
    delivered:
      [
        Five-step claims workflow with owners and deadlines,
        AI verification of claim documents,
        Adjuster workspace with quick actions,
        Customer status updates by email and text,
        Management reporting on volume and cycle time,
      ]
    stack: [fw.nextjs, lang.typescript, tech.nodejs, tech.postgresql, prov.openai, plat.azure]
    results:
      - { value: "68%", label: Faster average settlement }
      - { value: "3x", label: Claims handled per adjuster }
      - { value: "92%", label: Documents verified automatically }
      - { value: "45%", label: Fewer customer status calls }

