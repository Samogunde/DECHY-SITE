# Asset registry and provenance. Every image and diagram on the site is listed here with its
# source and license. The validator fails the build if a file in public/ or brand/ is missing from
# this registry, if a license or alt text is absent, or if a registered file does not exist.
#
# kind:     file (a binary asset) | component (an original diagram drawn as an SVG React component)
# source:   owner-supplied | original | licensed-stock | client-supplied
# For licensed-stock entries also record: sourceUrl, creator, license, licenseUrl, acquired, and
# keep the license evidence under data/assets/licenses/.
#
# No licensed stock photography is used in Phase 1: available candidates were generic
# (glowing code on screens, sticky-note whiteboards) and did not meet the "purposeful, authentic"
# standard. Real project or team photography is preferred when supplied.
assets:
