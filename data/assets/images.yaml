    kind: file
    file: brand/logos/primary/dechy-logo-primary.png
    role: logo
    source: owner-supplied
    creator: DECHY
    license: Owned by DECHY. The approved logo, used exactly as supplied; never redrawn, recolored, or altered.
    originalFilename: Minimalist DECHY Tech Logo.png
    sha256: c8079c2161bcd9290c1d70878b15bdea155dacda50225265a0dd86ab0f95711c
    width: 1536
    height: 676
    alt: "DECHY: Technology, Software, AI & Digital Solutions"
