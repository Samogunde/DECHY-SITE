        key: medium,
        label: Medium,
        hint: "A complete product for one team or audience",
        share: [0.3, 0.75],
      }
    - { key: large, label: Large, hint: "Many users, roles, or integrations", share: [0.6, 1] }

  # Mobile platforms: a multiplier on the app's base range, and on its weeks. Two native apps
  # cost 60 percent more than one shared app.
  platforms:
    - {
        key: both-cross,
        label: "iPhone and Android, one shared app (recommended)",
        factor: 1,
        weeks: 1,
      }
    - { key: ios, label: "iPhone only", factor: 0.7, weeks: 0.85 }
    - { key: android, label: "Android only", factor: 0.7, weeks: 0.85 }
    - { key: both-native, label: "iPhone and Android, two native apps", factor: 1.6, weeks: 1.3 }

  # A web version alongside the mobile app (top at most 1.6 times its bottom).
  webCompanion: { label: "A web version too", cost: [5000, 8000], weeks: [1, 3] }

  # Design levels. A proven template takes 10 percent off the total; custom and premium design
  # add the dollar amounts each flow sets in its `designs`.
  designs:
    - { key: template, label: "Proven template, your brand applied", factor: 0.9 }
    - { key: custom, label: "Custom design", factor: 1 }
    - { key: premium, label: "Premium design with motion and illustration", factor: 1 }

  # Each connected system: the single-integration range, per system.
  integration: { cost: [1500, 4000], weeks: [0.5, 1] }

  # Step 4 asks when the visitor wants to start. It never changes the price; the answer is sent
  # with the lead so enquiries can be sorted.
  starts:
    - { key: asap, label: "As soon as possible" }
    - { key: month, label: "Within a month" }
    - { key: researching, label: "Just researching" }

  excludes:
    - Third-party subscriptions and fees, such as hosting, app store accounts, payment processing, AI usage, and paid plugins.
    - Content you supply, such as photography, video, and legal text, unless you ask us to create it.
    - Ongoing care after launch, which is a separate monthly plan.
    - Taxes, which depend on where your business is registered.
