# Every DECHY price in one place (owner direction, 22 October 2026: "one source for every
# price"). The service pages, cost guides, cost hub, estimator, FAQ answers and their structured
# data, titles, and descriptions all read from this file. In content, write a price as a token so
# it always matches this file: {{fact:price.<service>-<plan>}} for a service tier (for example
# {{fact:price.web-development-landing-page}}), {{fact:price.care-<plan>}} for a care plan,
# {{fact:price.mvp-<name>}}, {{fact:price.rate-<role>}}, and {{fact:price.team-<name>}}. The
# tokens are listed by `npm run prices`. Every figure here was agreed in the owner's pricing
# review of 22 October 2026 and is confirmed by the owner before the site goes live.
#
# Service tiers: typical ranges and delivery times. Every project is quoted in writing after a
# short call; these ranges show where most projects land. Timelines count from approved scope.
services:
  software-development:
    heading: What custom software costs
    plans:
      - {
          name: Internal tool or admin system,
          range: "$15,000 to $30,000",
          timeline: 4 to 6 weeks,
          summary: "Replaces spreadsheets and manual steps with one tool your team logs into.",
        }
      - {
          name: Customer or partner portal,
          range: "$25,000 to $50,000",
          timeline: 6 to 8 weeks,
          summary: "Accounts, documents, requests, and status updates in one secure place.",
        }
      - {
          name: Operations platform,
          range: "$40,000 to $80,000",
          timeline: 2 to 3 months,
          summary: "Orders, scheduling, inventory, billing, and reporting built around your process.",
        }
      - {
          name: SaaS product,
          range: "$50,000 to $100,000",
          timeline: 2 to 3 months,
          summary: "A subscription product with plans, billing, onboarding, and an admin console.",
        }
      - {
          name: Enterprise system or modernization,
          range: "$100,000+",
          timeline: 3 to 4 months,
          summary: "Large or legacy systems rebuilt in stages while the business keeps running.",
        }
    factors:
      [
        Number of user roles and screens,
        Integrations and data migration,
        Reporting and dashboards,
        Security and compliance needs,
      ]

