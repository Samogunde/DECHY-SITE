# Hourly rates (owner, 21 October 2026): three simple rates for change requests and
# time-and-materials work, not a per-role rate card. Most work is quoted as a fixed price.
rates:
  - { role: "Design and development", range: "$35 to $55 an hour" }
  - { role: "Specialist work: AI, cloud, and architecture", range: "$45 to $80 an hour" }
  - { role: "Testing and quality assurance", range: "$25 to $35 an hour" }

# Dedicated teams, billed monthly (about 160 hours per full-time person).
teams:
  - name: One dedicated engineer
    range: "$6,000 to $11,000 a month"
    who: One full-time engineer matched to your stack, with a delivery lead overseeing quality.
  - name: Starter squad
    range: "$11,000 to $17,000 a month"
    who: Two engineers and a part-time delivery lead.
  - name: Product squad
    range: "$18,000 to $28,000 a month"
    who: Two to three engineers, a part-time designer, a delivery lead, and part-time QA.
  - name: Scale team
    range: "$35,000 to $55,000+ a month"
    who: Four to six engineers, a designer, a delivery lead, QA, and DevOps.

# Care plans after launch, billed monthly.
maintenance:
  - name: Essential care
    range: "$100 to $300 a month"
    for: Websites and simple web apps
    includes: Platform and plugin updates, daily backups, uptime monitoring, security patches, and up to 2 hours of small changes.
  - name: Growth care
    range: "$350 to $900 a month"
    for: Web apps and mobile apps in daily use
    includes: Everything in Essential, plus iOS and Android release updates, error tracking, a monthly report, and 10 to 20 hours of improvements.
  - name: Product care
    range: "$1,200 to $3,000 a month"
    for: Business-critical systems and SaaS products
    includes: Everything in Growth, plus a one-hour response target for urgent issues, on-call cover, performance tuning, and 40 or more hours of development.

# Headline ranges (owner's pricing review, 22 October 2026): what most projects of each kind
# cost, and where a first version starts. Guide introductions, the cost hub, and the service pages
# open with these instead of the widest extremes. Keep them in step with the tiers above.
summaries:
  - { id: website, range: "$3,000 to $7,000", from: "$2,000" }
  - { id: web-app, range: "$5,000 to $25,000", from: "$5,000" }
  - { id: mobile-app, range: "$20,000 to $35,000", from: "$10,000" }
  - { id: custom-software, range: "$25,000 to $80,000", from: "$15,000" }
  - { id: online-store, range: "$2,500 to $15,000", from: "$20,000" }
  - { id: ai, range: "$4,000 to $18,000", from: "$4,000" }
  - { id: integration, range: "$1,500 to $12,000", from: "$1,500" }
  - { id: mvp, range: "$6,000 to $20,000", from: "$3,000" }

# MVPs: the first version that proves an idea.
mvp:
  - { name: Clickable prototype, range: "$3,000 to $6,000", timeline: "1 to 2 weeks" }
  - { name: Web app MVP, range: "$6,000 to $12,000", timeline: "2 to 4 weeks" }
  - { name: Mobile app MVP, range: "$10,000 to $20,000", timeline: "2 to 4 weeks" }
  - { name: AI product MVP, range: "$8,000 to $18,000", timeline: "2 to 4 weeks" }
  - { name: SaaS MVP with billing, range: "$25,000 to $50,000", timeline: "6 to 8 weeks" }

# The cost estimator (/tools/cost-estimator/), reviewed 22 October 2026 (owner's pricing review).
# Base ranges are the service tiers above, so the tool always agrees with the service pages and
# cost guides. Add-ons are [low, high] in dollars; weeks are [low, high].
#
# How a total is worked out (src/lib/estimate.ts):
#   low  = base low + the lows of every add-on (a proven template takes 10 percent off)
#   high = low + 0.6 x (the sum of every high minus that low): add-ons are built alongside each
#          other, so a project rarely reaches the top of every item at once
#   rounded to $500 under $20,000 and to $1,000 above; under $25,000 the high is at most twice
#   the low; and no tier ever shows a total above the top of the next tier's base range.
# The timeline answer never changes the price.
#
# Add-on rules: on the web flow the prices are the owner's agreed figures. On every other flow
# each add-on's top is at most 1.6 times its bottom. A feature with `from` belongs to that tier
# (and every bigger one): on a smaller tier the visitor is offered the switch. A tier's
# `maxFeatures` limits how many add-ons it takes; `onlyFeatures` lists the add-ons it allows.
estimator:
  services:
    - key: software
      label: Custom software
      hint: Internal tools, portals, operations platforms, SaaS products
      pricing: [software-development]
      features:
        - {
            id: roles,
            label: "Several user roles and permissions",
            cost: [3000, 4500],
            weeks: [1, 2],
          }
        - { id: dashboards, label: "Dashboards and reports", cost: [3500, 5500], weeks: [1, 2] }
        - {
            id: migration,
            label: "Moving data from spreadsheets or an old system",
            cost: [3500, 5500],
            weeks: [1, 2],
          }
        - {
            id: payments,
            label: "Payments, invoices, or subscriptions",
            cost: [3000, 4500],
            weeks: [1, 2],
          }
        - {
            id: documents,
            label: "Document upload, signing, or generation",
            cost: [2000, 3000],
            weeks: [0.5, 1],
          }
        - {
            id: ai,
            label: "An AI feature (assistant, summaries, predictions)",
            cost: [5500, 8500],
            weeks: [1, 3],
          }
        - {
            id: audit,
            label: "Audit logs and compliance controls",
            cost: [3500, 5500],
            weeks: [1, 2],
          }
      designs: { custom: [0, 0], premium: [3000, 4800] }
    - key: web
      label: Website or web app
      hint: Business websites, content sites, booking and client areas, web apps
      pricing: [web-development]
      tierRules:
        "Landing page": { onlyFeatures: [cms, copy, booking, languages, seo], maxFeatures: 4 }
      features:
        - { id: cms, label: "Editable pages and a blog", cost: [400, 1200], weeks: [0, 0.5] }
        - { id: copy, label: "We write the content", cost: [600, 1800], weeks: [0.5, 1] }
        - { id: booking, label: "Bookings or quote requests", cost: [800, 2000], weeks: [0.5, 1] }
        - {
            id: accounts,
            label: "User accounts and a client area",
            cost: [1500, 4000],
            weeks: [1, 2],
            from: "Web app",
          }
        - {
            id: payments,
            label: "Online payments",
            cost: [800, 2000],
            weeks: [0.5, 1],
            from: "Web app",
          }
        - { id: languages, label: "More than one language", cost: [800, 2000], weeks: [0.5, 1] }
        - {
            id: seo,
            label: "Search setup and launch analytics",
            cost: [400, 1000],
            weeks: [0, 0.5],
          }
      # Custom design is priced over the template; premium over custom design.
      designs: { custom: [800, 2500], premium: [2300, 6000] }
      switchNote: "Accounts and payments make this a web app. See the web app estimate, from {from}."
