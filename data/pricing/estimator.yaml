# The cost estimator (/tools/cost-estimator/). Base ranges come from data/pricing/services.yaml,
# the same figures the service pages and cost guides show, so the estimate always agrees with
# them. This file adds the choices on top: features, platforms, design level, integrations, and
# timeline, each with its own effect. Dollar add-ons are written as [low, high]; weeks as [low, high].

services:
  - key: software
    label: Custom software
    hint: Internal tools, portals, operations platforms, SaaS products
    pricing: [software-development]
    features:
      - {
          id: roles,
          label: "Several user roles and permissions",
          cost: [3000, 8000],
          weeks: [1, 2],
        }
      - { id: dashboards, label: "Dashboards and reports", cost: [3000, 10000], weeks: [1, 2] }
      - {
          id: migration,
          label: "Moving data from spreadsheets or an old system",
          cost: [2500, 12000],
          weeks: [1, 2],
        }
      - {
          id: payments,
          label: "Payments, invoices, or subscriptions",
          cost: [3000, 8000],
          weeks: [1, 2],
        }
      - {
          id: documents,
          label: "Document upload, signing, or generation",
          cost: [2000, 6000],
          weeks: [0.5, 1],
        }
      - {
          id: ai,
          label: "An AI feature (assistant, summaries, predictions)",
          cost: [5000, 15000],
          weeks: [1, 3],
        }
      - {
          id: audit,
          label: "Audit logs and compliance controls",
          cost: [3000, 9000],
          weeks: [1, 2],
        }
  - key: web
    label: Website or web app
    hint: Business websites, content sites, booking and client areas, web apps
    pricing: [web-development]
    features:
      - { id: cms, label: "Editable pages and a blog", cost: [800, 2500], weeks: [0, 0.5] }
      - { id: copy, label: "We write the content", cost: [1200, 4000], weeks: [0.5, 1] }
      - { id: booking, label: "Bookings or quote requests", cost: [1500, 5000], weeks: [0.5, 1] }
      - {
          id: accounts,
          label: "User accounts and a client area",
          cost: [3000, 9000],
          weeks: [1, 2],
        }
      - { id: payments, label: "Online payments", cost: [1500, 5000], weeks: [0.5, 1] }
      - { id: languages, label: "More than one language", cost: [1500, 4000], weeks: [0.5, 1] }
      - { id: seo, label: "Search setup and launch analytics", cost: [800, 2500], weeks: [0, 0.5] }
  - key: mobile
    label: Mobile app
    hint: iPhone and Android apps for customers, staff, or field teams
    pricing: [mobile-app-development]
    platforms: true
    features:
      - { id: accounts, label: "Sign-in and user profiles", cost: [2000, 5000], weeks: [0.5, 1] }
      - { id: push, label: "Push notifications", cost: [1000, 3000], weeks: [0.5, 1] }
      - {
          id: payments,
          label: "In-app payments or subscriptions",
          cost: [3000, 8000],
          weeks: [1, 2],
        }
      - { id: offline, label: "Works offline and syncs later", cost: [4000, 12000], weeks: [1, 2] }
      - { id: maps, label: "Maps, location, or live tracking", cost: [3000, 9000], weeks: [1, 2] }
      - { id: chat, label: "In-app chat or messaging", cost: [4000, 10000], weeks: [1, 2] }
      - { id: admin, label: "An admin panel for your team", cost: [4000, 12000], weeks: [1, 2] }
  - key: ecommerce
    label: Online store
    hint: Shopify, WooCommerce, custom stores, marketplaces
    pricing: [ecommerce]
    features:
      - {
          id: catalog,
          label: "More than 500 products or many variants",
          cost: [1500, 5000],
          weeks: [0.5, 1],
        }
      - {
          id: subscriptions,
          label: "Subscriptions or memberships",
          cost: [2500, 7000],
          weeks: [1, 1.5],
        }
      - {
          id: b2b,
          label: "Trade accounts and wholesale pricing",
          cost: [3000, 8000],
          weeks: [1, 2],
        }
      - {
          id: inventory,
          label: "Live stock sync with your warehouse or POS",
          cost: [3000, 9000],
          weeks: [1, 2],
        }
      - {
          id: migration,
          label: "Moving from another platform",
          cost: [2000, 6000],
          weeks: [0.5, 1],
        }
      - { id: checkout, label: "A custom checkout", cost: [3000, 10000], weeks: [1, 2] }
  - key: ai
    label: AI or automation
    hint: Assistants, AI features, agents, workflow and process automation
    pricing: [ai, automation]
    features:
      - {
          id: documents,
          label: "Reads documents, emails, or forms",
          cost: [3000, 10000],
          weeks: [1, 2],
        }
      - {
          id: assistant,
          label: "A chat assistant for customers or staff",
          cost: [4000, 12000],
          weeks: [1, 2],
        }
      - { id: approvals, label: "Human approval steps", cost: [1500, 5000], weeks: [0.5, 1] }
      - {
          id: reporting,
          label: "Accuracy and usage reporting",
          cost: [2000, 6000],
          weeks: [0.5, 1],
        }
      - { id: languages, label: "Several languages", cost: [2000, 6000], weeks: [0.5, 1] }
  - key: integration
    label: Connecting systems
    hint: CRM, accounting, store, ERP, and custom APIs working together
    pricing: [api-integration]
    features:
      - {
          id: realtime,
          label: "Real-time sync instead of nightly",
          cost: [2000, 7000],
          weeks: [0.5, 1],
        }
      - {
          id: legacy,
          label: "An older system with no modern API",
          cost: [4000, 12000],
          weeks: [1, 2],
        }
      - {
          id: monitoring,
          label: "Monitoring, alerts, and retry handling",
          cost: [1500, 5000],
          weeks: [0.5, 1],
        }
      - { id: history, label: "Moving historical records", cost: [2000, 8000], weeks: [0.5, 1.5] }

# Size within the chosen project type: the share of its range a project of that size usually uses.
sizes:
  - { key: small, label: Small, hint: "A focused first version", share: [0, 0.45] }
  - {
      key: medium,
      label: Medium,
      hint: "A complete product for one team or audience",
      share: [0.3, 0.75],
    }
  - { key: large, label: Large, hint: "Many users, roles, or integrations", share: [0.6, 1] }

# Mobile platforms: a multiplier on the app's base range, and on its weeks.
platforms:
  - {
      key: both-cross,
      label: "iPhone and Android, one shared app (recommended)",
      factor: 1,
      weeks: 1,
    }
  - { key: ios, label: "iPhone only", factor: 0.7, weeks: 0.85 }
  - { key: android, label: "Android only", factor: 0.7, weeks: 0.85 }
  - { key: both-native, label: "iPhone and Android, two native apps", factor: 1.6, weeks: 1.3 }

# A web version alongside the mobile app (the approved web app range).
webCompanion: { label: "A web version too", cost: [5000, 20000], weeks: [1, 3] }

designs:
  - { key: template, label: "Proven template, your brand applied", factor: 0.9 }
  - { key: custom, label: "Custom design", factor: 1 }
  - { key: premium, label: "Premium design with motion and illustration", factor: 1.15 }

# Integrations with other systems: the approved single-integration range, per system.
integration: { cost: [2000, 6000], weeks: [0.5, 1] }

timelines:
  - { key: flexible, label: "Flexible: best price", factor: 0.95, weeks: 1.2 }
  - { key: standard, label: "Standard", factor: 1, weeks: 1 }
  - { key: rush, label: "Fast: as soon as possible", factor: 1.25, weeks: 0.75 }

excludes:
  - Third-party subscriptions and fees, such as hosting, app store accounts, payment processing, AI usage, and paid plugins.
  - Content you supply, such as photography, video, and legal text, unless you ask us to create it.
  - Ongoing care after launch, which is a separate monthly plan.
  - Taxes, which depend on where your business is registered.
