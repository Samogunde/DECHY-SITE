# Typical price ranges and delivery times per service (owner direction, 20 October 2026).
# Every project is quoted in writing after a short call; these ranges show where most projects land.
# The top tier of every service ends with "+". Timelines are DECHY's short delivery times.
# Rendered as a "Pricing" section before the questions on each service page (src/lib/content/load.ts).

services:
  software-development:
    heading: What custom software costs
    plans:
      - {
          name: Internal tool or admin system,
          range: "$15,000 to $30,000",
          timeline: 4 to 6 weeks,
          summary: "Replaces spreadsheets and manual steps with one tool your team logs into.",
        }
      - {
          name: Customer or partner portal,
          range: "$25,000 to $50,000",
          timeline: 6 to 8 weeks,
          summary: "Accounts, documents, requests, and status updates in one secure place.",
        }
      - {
          name: Operations platform,
          range: "$40,000 to $80,000",
          timeline: 2 to 3 months,
          summary: "Orders, scheduling, inventory, billing, and reporting built around your process.",
        }
      - {
          name: SaaS product,
          range: "$50,000 to $100,000",
          timeline: 2 to 3 months,
          summary: "A subscription product with plans, billing, onboarding, and an admin console.",
        }
      - {
          name: Enterprise system or modernization,
          range: "$100,000+",
          timeline: 3 to 4 months,
          summary: "Large or legacy systems rebuilt in stages while the business keeps running.",
        }
    factors:
      [
        Number of user roles and screens,
        Integrations and data migration,
        Reporting and dashboards,
        Security and compliance needs,
      ]

  web-development:
    heading: What a website or web app costs
    plans:
      - {
          name: Landing page,
          range: "$2,000 to $4,000",
          timeline: 1 week,
          summary: "One focused page for a product, campaign, or launch, built to convert.",
        }
      - {
          name: Business website,
          range: "$3,000 to $7,000",
          timeline: 1 to 2 weeks,
          summary: "A fast, editable site with your services, pages, forms, and search setup.",
        }
      - {
          name: Content or CMS website,
          range: "$5,000 to $10,000",
          timeline: 2 to 3 weeks,
          summary: "Larger sites with blogs, resources, multiple languages, or many page types.",
        }
      - {
          name: Web app,
          range: "$5,000 to $20,000",
          timeline: 1 to 3 weeks,
          summary: "Booking, quoting, client areas, or internal tools that run in the browser.",
        }
      - {
          name: Advanced web app,
          range: "$20,000 to $50,000+",
          timeline: 3 to 6 weeks,
          summary: "Accounts, dashboards, payments, and integrations for a product people use daily.",
        }
    factors:
      [
        Number of pages and templates,
        Content and copywriting,
        Integrations and payments,
        User accounts and roles,
      ]

  mobile-app-development:
    heading: What a mobile app costs
    plans:
      - {
          name: MVP app,
          range: "$10,000 to $20,000",
          timeline: 2 to 4 weeks,
          summary: "The core features on iPhone and Android, ready to test with real users.",
        }
      - {
          name: Business app,
          range: "$20,000 to $35,000",
          timeline: 4 to 6 weeks,
          summary: "Accounts, notifications, payments, and an admin panel for your team.",
        }
      - {
          name: Marketplace or on-demand app,
          range: "$30,000 to $50,000",
          timeline: 6 to 8 weeks,
          summary: "Two-sided apps for customers and providers, with matching, payments, and tracking.",
        }
      - {
          name: Complex or enterprise app,
          range: "$50,000 to $60,000+",
          timeline: 8 weeks,
          summary: "Offline use, hardware, heavy integrations, or strict security requirements.",
        }
    factors:
      [
        "iPhone, Android, or both",
        Number of screens and features,
        Back end and admin panel,
        Integrations and hardware,
      ]

  ecommerce:
    heading: What an online store costs
    plans:
      - {
          name: Store setup,
          range: "$3,000 to $8,000",
          timeline: 1 to 2 weeks,
          summary: "A Shopify or WooCommerce store with your products, payments, and shipping.",
        }
      - {
          name: Store migration,
          range: "$4,000 to $12,000",
          timeline: 1 to 3 weeks,
          summary: "Products, customers, orders, and search rankings moved to a better platform.",
        }
      - {
          name: Custom store with integrations,
          range: "$8,000 to $25,000",
          timeline: 2 to 4 weeks,
          summary: "A designed store connected to your stock, accounting, and marketing tools.",
        }
      - {
          name: Headless store or marketplace,
          range: "$25,000 to $60,000+",
          timeline: 4 to 8 weeks,
          summary: "Multi-vendor marketplaces and custom storefronts for high traffic.",
        }
    factors:
      [
        Number of products and variants,
        Platform and apps,
        Integrations with stock and accounting,
        Custom checkout or subscriptions,
      ]

  ai:
    heading: What AI work costs
    plans:
      - {
          name: AI assistant on your content,
          range: "$5,000 to $15,000",
          timeline: 1 to 3 weeks,
          summary: "A chat assistant that answers from your documents, site, or help center.",
        }
      - {
          name: AI feature in your product,
          range: "$10,000 to $30,000",
          timeline: 2 to 4 weeks,
          summary: "Search, summaries, classification, or drafting built into the software you have.",
        }
      - {
          name: AI agent connected to your systems,
          range: "$20,000 to $50,000",
          timeline: 4 to 6 weeks,
          summary: "An agent that reads, decides, and takes actions in your tools, with approvals.",
        }
      - {
          name: Custom model or AI platform,
          range: "$50,000 to $150,000+",
          timeline: 2 to 3 months,
          summary: "Trained models, evaluation, and the platform to run AI across the business.",
        }
    factors:
      [
        Amount and quality of your data,
        Systems the AI must connect to,
        Accuracy and review needs,
        Usage volume and running costs,
      ]

  automation:
    heading: What automation costs
    plans:
      - {
          name: Workflow automation,
          range: "$1,500 to $5,000",
          timeline: 1 week,
          summary: "Zapier, Make, or n8n flows that move data between the tools you already use.",
        }
      - {
          name: Business process automation,
          range: "$5,000 to $20,000",
          timeline: 2 to 4 weeks,
          summary: "Approvals, onboarding, invoicing, or order handling run end to end without copy and paste.",
        }
      - {
          name: AI-powered automation,
          range: "$10,000 to $35,000",
          timeline: 3 to 5 weeks,
          summary: "Automations that read emails and documents, decide, and hand off to people when needed.",
        }
      - {
          name: Enterprise automation,
          range: "$30,000 to $80,000",
          timeline: 6 to 8 weeks,
          summary: "Many systems, departments, approvals, and audit trails, with monitoring.",
        }
      - {
          name: Industrial automation software,
          range: "$40,000 to $120,000+",
          timeline: 2 to 3 months,
          summary: "Software that connects machines, sensors, and plant systems to your business data.",
        }
    factors:
      [
        Number of steps and systems,
        Exceptions and approvals,
        AI or document reading,
        Volume and monitoring needs,
      ]

  data-analytics:
    heading: What data and analytics work costs
    plans:
      - {
          name: Dashboards on your data,
          range: "$3,000 to $10,000",
          timeline: 1 to 2 weeks,
          summary: "Clear dashboards on the data you already have, in the tool your team prefers.",
        }
      - {
          name: Reporting system,
          range: "$10,000 to $30,000",
          timeline: 3 to 5 weeks,
          summary: "Data pipelines that pull from your tools and keep reports up to date.",
        }
      - {
          name: Data warehouse and BI platform,
          range: "$30,000 to $80,000+",
          timeline: 6 to 10 weeks,
          summary: "One source of truth for the whole business, with governance and access rules.",
        }
    factors:
      [Number of data sources, Data quality and cleanup, Refresh frequency, Users and access rules]

  api-integration:
    heading: What integration work costs
    plans:
      - {
          name: Single integration,
          range: "$2,000 to $6,000",
          timeline: 1 week,
          summary: "Two systems connected so data moves without anyone copying it.",
        }
      - {
          name: Multi-system integration,
          range: "$6,000 to $20,000",
          timeline: 2 to 4 weeks,
          summary: "Your customer records, accounting, payments, and operations tools working from the same data.",
        }
      - {
          name: Custom API,
          range: "$10,000 to $30,000",
          timeline: 3 to 5 weeks,
          summary: "A secure, documented API for your apps, partners, or customers.",
        }
      - {
          name: Integration platform,
          range: "$30,000 to $80,000+",
          timeline: 6 to 10 weeks,
          summary: "Middleware that connects many systems, with retries, logging, and monitoring.",
        }
    factors:
      [
        Number of systems,
        Quality of their APIs,
        Data volume and timing,
        Error handling and monitoring,
      ]

  cloud:
    heading: What cloud and DevOps work costs
    plans:
      - {
          name: Cloud setup and deployment,
          range: "$3,000 to $8,000",
          timeline: 1 to 2 weeks,
          summary: "Hosting, environments, and automatic deployments set up properly.",
        }
      - {
          name: Single application migration,
          range: "$8,000 to $25,000",
          timeline: 2 to 4 weeks,
          summary: "One application moved to AWS, Azure, or Google Cloud with no lost data.",
        }
      - {
          name: Platform migration,
          range: "$25,000 to $70,000+",
          timeline: 4 to 10 weeks,
          summary: "Several applications, databases, or a container platform moved and optimized.",
        }
      - {
          name: Managed DevOps,
          range: "$1,500 to $6,000+ a month",
          timeline: Ongoing,
          summary: "Monitoring, updates, backups, and cost control after launch.",
        }
    factors:
      [
        Number of applications,
        Data size and downtime limits,
        Security and compliance,
        Ongoing support level,
      ]

  cybersecurity:
    heading: What security work costs
    plans:
      - {
          name: Security review,
          range: "$2,500 to $7,000",
          timeline: 1 week,
          summary: "A clear report on the risks in your website, app, or cloud setup.",
        }
      - {
          name: Penetration test and fixes,
          range: "$6,000 to $20,000",
          timeline: 2 to 3 weeks,
          summary: "We test like an attacker, then fix what we find.",
        }
      - {
          name: Hardening and monitoring,
          range: "$10,000 to $30,000",
          timeline: 2 to 4 weeks,
          summary: "Access control, backups, logging, and alerts set up across your systems.",
        }
      - {
          name: Compliance readiness,
          range: "$25,000 to $60,000+",
          timeline: 6 to 10 weeks,
          summary: "Controls and evidence prepared for audits such as SOC 2 or ISO 27001.",
        }
    factors:
      [Number of systems in scope, Depth of testing, Compliance requirements, Fixes included or not]

  ui-ux:
    heading: What design work costs
    plans:
      - {
          name: UX audit,
          range: "$2,000 to $5,000",
          timeline: 1 week,
          summary: "What confuses your users, and exactly what to change.",
        }
      - {
          name: Website or app design,
          range: "$4,000 to $12,000",
          timeline: 1 to 3 weeks,
          summary: "Designed screens for a site or app, ready for development.",
        }
      - {
          name: Full product design,
          range: "$12,000 to $30,000",
          timeline: 3 to 6 weeks,
          summary: "Research, flows, a clickable prototype, and every screen designed.",
        }
      - {
          name: Design system,
          range: "$15,000 to $40,000+",
          timeline: 4 to 8 weeks,
          summary: "Components, rules, and documentation so every new screen stays consistent.",
        }
    factors: [Number of screens and flows, User research, Prototype depth, Platforms covered]

  branding:
    heading: What branding costs
    plans:
      - {
          name: Logo and starter identity,
          range: "$1,500 to $4,000",
          timeline: 1 week,
          summary: "A logo, colors, and type that work from a favicon to a sign.",
        }
      - {
          name: Full brand identity,
          range: "$4,000 to $12,000",
          timeline: 2 to 3 weeks,
          summary: "Identity, voice, templates, and brand guidelines your team can follow.",
        }
      - {
          name: Rebrand and rollout,
          range: "$12,000 to $35,000+",
          timeline: 4 to 6 weeks,
          summary: "Strategy, messaging, a new identity, and the rollout across every touchpoint.",
        }
    factors:
      [
        Number of concepts and rounds,
        Messaging and naming,
        Templates and assets,
        Rollout across channels,
      ]

  seo-aeo-geo:
    heading: What search visibility work costs
    plans:
      - {
          name: Technical audit and fixes,
          range: "$1,500 to $5,000",
          timeline: 1 to 2 weeks,
          summary: "Speed, indexing, structure, and schema fixed so search engines and AI tools read you correctly.",
        }
      - {
          name: Migration protection,
          range: "$3,000 to $10,000",
          timeline: 1 to 3 weeks,
          summary: "Rankings and traffic kept safe through a redesign or platform move.",
        }
      - {
          name: Monthly SEO,
          AEO and GEO,
          range: "$1,000 to $4,000 a month",
          timeline: Ongoing,
          summary: "Content, technical care, and reporting to grow visibility in Google and AI answers.",
        }
      - {
          name: Content and authority program,
          range: "$3,000 to $8,000+ a month",
          timeline: Ongoing,
          summary: "Guides, comparison pages, and mentions that make you the answer people find.",
        }
    factors:
      [
        Size of the site,
        Competition in your market,
        Content volume,
        Number of markets and languages,
      ]

  digital-marketing:
    heading: What digital marketing costs
    plans:
      - {
          name: Campaign setup,
          range: "$1,500 to $4,000",
          timeline: 1 week,
          summary: "Google or Meta campaigns, tracking, and landing pages set up to measure results.",
        }
      - {
          name: Email and marketing automation,
          range: "$2,500 to $8,000",
          timeline: 1 to 2 weeks,
          summary: "Welcome series and nurture flows connected to your customer records, so every lead gets a follow-up.",
        }
      - {
          name: Paid media management,
          range: "$1,000 to $5,000 a month",
          timeline: Ongoing,
          summary: "Campaigns managed and improved every week. Ad spend is separate.",
        }
      - {
          name: Full-funnel marketing program,
          range: "$5,000 to $15,000+ a month",
          timeline: Ongoing,
          summary: "Ads, content, email, and reporting run as one plan tied to revenue.",
        }
    factors: [Number of channels, Ad spend, Creative and content volume, Reporting needs]

  consulting:
    heading: What consulting costs
    plans:
      - {
          name: Technology assessment,
          range: "$2,500 to $7,000",
          timeline: 1 to 2 weeks,
          summary: "A clear view of your systems, risks, and where money is being wasted.",
        }
      - {
          name: Transformation roadmap,
          range: "$7,000 to $20,000",
          timeline: 2 to 4 weeks,
          summary: "A costed, step-by-step plan your team and budget can actually follow.",
        }
      - {
          name: Fractional CTO or advisory,
          range: "$3,000 to $10,000+ a month",
          timeline: Ongoing,
          summary: "Senior technology leadership for decisions, vendors, and delivery.",
        }
    factors:
      [
        Size of the organization,
        Number of systems and teams,
        Depth of analysis,
        Ongoing involvement,
      ]
