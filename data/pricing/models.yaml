# Pricing beyond the per-service ranges (data/pricing/services.yaml), set 21 October 2026 at the
# owner's direction ("put in all the numbers, figures, costs"), then cut by 20% at the owner's
# direction the same day. Dedicated team prices were not cut (owner).
# Every cost guide, the estimator, and the cost hub read them from here, so one edit updates all.

# Hourly rates (owner, 21 October 2026): three simple rates for change requests and
# time-and-materials work, not a per-role rate card. Most work is quoted as a fixed price.
rates:
  - { role: "Design and development", range: "$35 to $55 an hour" }
  - { role: "Specialist work: AI, cloud, and architecture", range: "$45 to $80 an hour" }
  - { role: "Testing and quality assurance", range: "$25 to $35 an hour" }

# Dedicated teams, billed monthly (about 160 hours per full-time person).
teams:
  - name: One dedicated engineer
    range: "$6,000 to $11,000 a month"
    who: One full-time engineer matched to your stack, with a delivery lead overseeing quality.
  - name: Starter squad
    range: "$11,000 to $17,000 a month"
    who: Two engineers and a part-time delivery lead.
  - name: Product squad
    range: "$18,000 to $28,000 a month"
    who: Two to three engineers, a part-time designer, a delivery lead, and part-time QA.
  - name: Scale team
    range: "$35,000 to $55,000+ a month"
    who: Four to six engineers, a designer, a delivery lead, QA, and DevOps.

# Care plans after launch, billed monthly.
maintenance:
  - name: Essential care
    range: "$250 to $650 a month"
    for: Websites and simple web apps
    includes: Platform and plugin updates, daily backups, uptime monitoring, security patches, and up to 3 hours of small changes.
  - name: Growth care
    range: "$1,000 to $2,500 a month"
    for: Web apps and mobile apps in daily use
    includes: Everything in Essential, plus iOS and Android release updates, error tracking, a monthly report, and 10 to 20 hours of improvements.
  - name: Product care
    range: "$3,000 to $8,000+ a month"
    for: Business-critical systems and SaaS products
    includes: Everything in Growth, plus a one-hour response target for urgent issues, on-call cover, performance tuning, and 40 or more hours of development.

# MVPs: the first version that proves an idea.
mvp:
  - { name: Clickable prototype, range: "$3,000 to $6,000", timeline: "1 to 2 weeks" }
  - { name: Web app MVP, range: "$6,000 to $16,000", timeline: "2 to 4 weeks" }
  - { name: Mobile app MVP, range: "$10,000 to $20,000", timeline: "2 to 4 weeks" }
  - { name: AI product MVP, range: "$8,000 to $24,000", timeline: "2 to 4 weeks" }
  - { name: SaaS MVP with billing, range: "$25,000 to $50,000", timeline: "6 to 8 weeks" }
