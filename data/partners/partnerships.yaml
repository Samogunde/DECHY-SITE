# Partnerships and compliance, confirmed by the owner in chat on 21 October 2026.
# The owner confirmed DECHY is enrolled in these partner programs and works in compliance with
# these standards. Official partner and certification marks replace the text tiles once the owner
# supplies them from the partner portals and certificates.
# Logos (owner direction, 22 October 2026: "the logo of those partners anywhere they appear"):
# the official SVG logos from Wikimedia Commons, in public/partners/. For the black site the
# AWS and Google Cloud wordmark text is white and the Microsoft symbol drops its gray backing
# square, as in each company's own light-on-dark version. Shapes and brand colors are unchanged.
# Sources: commons.wikimedia.org/wiki/File:Amazon_Web_Services_Logo.svg,
# File:Microsoft_logo.svg, File:Salesforce.com_logo.svg, File:Google_Cloud_logo.svg.
# Owner, 22 October 2026: DECHY is also in partnership with Wix, Squarespace, Shopify, WordPress,
# Figma, Meta, Adobe, Oracle, and Cisco, with more to follow from the owner. Their logos: Adobe,
# Oracle, and Figma from Wikimedia Commons (File:Adobe_Corporate_Horizontal_Red_HEX.svg,
# File:Oracle_logo.svg, File:Figma-logo.svg); the others are the marks from Simple Icons
# (simple-icons package), in brand color or white on the black site. WordPress and Figma show
# "Agency partner" until the owner names the program. Webflow, HubSpot, and Stripe in
# data/partners/programs.json stay unconfirmed until the owner says otherwise.

partners:
  - name: Amazon Web Services
    program: AWS Partner Network
    short: AWS
    logo: aws.svg
    wordmark: true
    text: Cloud architecture, migration, and managed workloads on AWS.
  - name: Microsoft
